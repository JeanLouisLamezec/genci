                    // Colonne existante : vérifier le type
                    var expectedType = colDef.opts?.type || colDef.type;
                    var existingType = existingCol.type;
                    
                    if (existingType !== expectedType) {
                        // Type incorrect : tenter réparation
                        log('[GENCI refs] Type incorrect: ' + key + ' (attendu: ' + expectedType + ', actuel: ' + existingType + ')');
                        
                        // Vérifier que la table cible existe
                        var targetType = getRefTarget(expectedType);
                        if (targetType && metadata.tableById[targetType]) {
                            try {
                                await grist.docApi.applyUserActions([
                                    ['ModifyColumn', tableId, colDef.id, { type: expectedType }]
                                ]);
                                result.repaired.push(key);
                            } catch (e) {
                                result.errors.push({
                                    table: tableId,
                                    column: colDef.id,
                                    action: 'repair',
                                    expectedType: expectedType,
                                    actualType: existingType,
                                    error: e.message || String(e)
                                });
                            }
                        } else {
                            result.errors.push({
                                table: tableId,
                                column: colDef.id,
                                action: 'repair-skipped',
                                reason: 'Table cible non trouvée: ' + targetType
                            });
                        }
                    }
                }
            }
        }
        
        return result;
    }

    // Attend que toutes les colonnes Ref soient visibles dans les métadonnées
    async function waitForReferenceColumns(grist, schemaDef, formulasMap, options) {
        options = options || {};
        var maxAttempts = options.maxAttempts || 20;
        var baseDelay = options.baseDelay || 200;
        var attempt = 0;
        var lastMissing = [];
        var lastInvalid = [];
        
        // Construire la liste des colonnes Ref attendues
        var expectedRefs = [];
        for (var i = 0; i < SCHEMA.tableOrder.length; i++) {
            var tableId = SCHEMA.tableOrder[i];
            var tableDef = schemaDef.tables[tableId];
            if (!tableDef) continue;
            
            var columns = tableDef.columns || [];
            var split = splitColumns(columns, formulasMap, tableId);
            
            for (var j = 0; j < split.ref.length; j++) {
                var colDef = split.ref[j];
                expectedRefs.push({
                    table: tableId,
                    column: colDef.id,
                    expectedType: colDef.opts?.type || colDef.type
                });
            }
        }
        
        log('[GENCI sync] Attente des colonnes Ref (' + expectedRefs.length + ' colonnes)...');
        
        while (attempt < maxAttempts) {
            try {
                var metadata = await loadSchemaMetadata(grist);
                var missing = [];
                var invalid = [];
                
                for (var k = 0; k < expectedRefs.length; k++) {
                    var ref = expectedRefs[k];
                    var key = ref.table + '.' + ref.column;
                    var col = metadata.columnByKey[key];
                    
                    // Vérifier principalement l'existence de la colonne
                    if (!col) {
                        missing.push(key);
                    } else if (col.type !== ref.expectedType) {
                        // Types incorrects collectés mais ne bloquent pas la stabilisation
                        invalid.push({
                            key: key,
                            expected: ref.expectedType,
                            actual: col.type
                        });
                    }
                }
                
                // Sauvegarder pour le rapport final
                lastMissing = missing.slice();
                lastInvalid = invalid.slice();
                
                // Succès si toutes les colonnes existent (peu importe le type pour l'instant)
                if (missing.length === 0) {
                    log('[GENCI sync] Toutes les colonnes Ref sont présentes (' + attempt + ' tentatives)');
                    if (invalid.length > 0) {
                        log('[GENCI sync] Types incorrects détectés (seront réparés): ' + invalid.length);
                    }
                    return {
                        success: true,
                        missing: [],
                        invalid: invalid,
                        attempts: attempt + 1
                    };
                }
                
                if (missing.length > 0) {
                    log('[GENCI sync] Colonnes Ref manquantes: ' + missing.join(', '));
                }
                
            } catch (e) {
                log('[GENCI sync] Erreur de lecture métadonnées: ' + (e.message || e));
            }
            
            attempt++;
            if (attempt < maxAttempts) {
                await delay(baseDelay * Math.min(attempt, 5));
            }
        }
        
        return {
            success: false,
            error: 'Timeout après ' + attempt + ' tentatives',
            attempts: attempt,
            missing: lastMissing,
            invalid: lastInvalid
        };
    }

    // ========================================================================
    // PASSE 3 — Colonnes calculées (formules)
    // ========================================================================
    
    async function ensureFormulaColumns(grist, formulasMap) {
        var metadata = await loadSchemaMetadata(grist);
        var result = { added: [], skipped: [], errors: [], repaired: [], warnings: [] };
        
        for (var tableName in formulasMap) {
            if (!formulasMap.hasOwnProperty(tableName)) continue;
            
            var formulas = formulasMap[tableName];
            var tableMeta = metadata.tableById[tableName];
            
            if (!tableMeta) {
                result.skipped.push({ table: tableName, reason: 'Table non trouvée' });
                continue;
            }
            
            for (var colId in formulas) {
                if (!formulas.hasOwnProperty(colId)) continue;
                
                var formula = formulas[colId];
                var key = tableName + '.' + colId;
                var existingCol = metadata.columnByKey[key];
                
                // Retrouver la déclaration de colonne dans le schéma
                var schemaTable = SCHEMA.tables[tableName];
                var schemaCol = schemaTable ? schemaTable.columns.find(function(c) { return c.id === colId; }) : null;
                var declaredType = schemaCol ? (schemaCol.opts?.type || schemaCol.type) : null;
                
                if (!existingCol) {
                    // Colonne manquante : l'ajouter avec le type déclaré
                    var targetType = declaredType || 'Any';
                    try {
                        await grist.docApi.applyUserActions([
                            ['AddColumn', tableName, colId, {
                                type: targetType,
                                isFormula: true,
                                formula: formula
                            }]
                        ]);
                        result.added.push(key);
                    } catch (e) {
                        result.errors.push({
                            table: tableName,
                            column: colId,
                            error: e.message || String(e)
                        });
                    }
                } else {
                    // Colonne existante : vérifier l'état
                    var existingFormula = existingCol.formula || '';
                    var existingIsFormula = existingCol.isFormula || false;
                    var existingType = existingCol.type;
                    
                    // Cas 1 : Formule vide "" → réparer si on a une formule centrale
                    if (existingIsFormula && existingFormula === '' && formula && formula !== '') {
                        try {
                            await grist.docApi.applyUserActions([
                                ['ModifyColumn', tableName, colId, {
                                    formula: formula
                                }]
                            ]);
                            result.repaired.push({ key: key, reason: 'formule-vide' });
                        } catch (e) {
                            result.errors.push({
                                table: tableName,
                                column: colId,
                                action: 'repair-empty-formula',
                                error: e.message || String(e)
                            });
                        }
                    }
                    // Cas 2 : Placeholder [] → réparer
                    else if (existingIsFormula && existingFormula === '[]' && formula && formula !== '[]') {
                        try {
                            await grist.docApi.applyUserActions([
                                ['ModifyColumn', tableName, colId, {
                                    formula: formula
                                }]
                            ]);
                            result.repaired.push({ key: key, reason: 'placeholder' });
                        } catch (e) {
                            result.errors.push({
                                table: tableName,
                                column: colId,
                                action: 'repair-placeholder',
                                error: e.message || String(e)
                            });
                        }
                    }
                    // Cas 3 : isFormula=false mais devrait être true → warning
                    else if (!existingIsFormula && declaredType) {
                        result.warnings.push({
                            table: tableName,
                            column: colId,
                            issue: 'should-be-formula',
                            expectedType: declaredType,
                            actualType: existingType,
                            expectedFormula: true,
                            actualFormula: existingIsFormula
                        });
                        result.skipped.push({ table: tableName, column: colId, reason: 'not-a-formula' });
                    }
                    // Cas 4 : Type incompatible → warning
                    else if (existingType !== declaredType && declaredType) {
                        result.warnings.push({
                            table: tableName,
                            column: colId,
                            issue: 'type-mismatch',
                            expectedType: declaredType,
                            actualType: existingType
                        });
                        result.skipped.push({ table: tableName, column: colId, reason: 'type-mismatch' });
                    }
                    // Cas 5 : Formule personnalisée (différente de celle du schéma) → skipped
                    else if (existingIsFormula && existingFormula && existingFormula !== formula) {
                        result.skipped.push({ table: tableName, column: colId, reason: 'custom-formula' });
                    }
                    // Cas 6 : Tout est conforme → skipped
                    else {
                        result.skipped.push({ table: tableName, column: colId, reason: 'conforme' });
                    }
                }
            }
        }
        
        return result;
    }

    // ========================================================================
    // PASSE 4 — Configuration des Choices et statuts
    // ========================================================================
    
    async function configureChoiceColumns(grist, defaultChoices) {
        var result = { configured: [], skipped: [] };
        
        for (var key in defaultChoices) {
            if (!defaultChoices.hasOwnProperty(key)) continue;
            
            var parts = key.split('.');
            if (parts.length !== 2) continue;
            
            var table = parts[0];
            var column = parts[1];
            var choices = defaultChoices[key];
            
            try {
                var statusList = choices.map(function(v) {
                    return { value: v, label: v, fillColor: '#94a3b8', textColor: '#ffffff' };
                });
                
                var seedResult = await TF.seedStatusChoices(grist, table, column, statusList);
                
                if (seedResult.ok && seedResult.changed) {
                    result.configured.push(key);
                } else if (seedResult.ok && !seedResult.changed) {
                    result.skipped.push({ key: key, reason: seedResult.reason || 'Déjà configuré' });
                } else {
                    result.skipped.push({ key: key, reason: seedResult.error || 'Erreur inconnue' });
                }
            } catch (e) {
                result.skipped.push({ key: key, reason: e.message || String(e) });
            }
        }
        
        return result;
    }

    // ========================================================================
    // PASSE 5 — Configuration des colonnes visibles des références
    // ========================================================================
    
    async function configureAllRefDisplays(grist, specs) {
        log('[GENCI display] Configuration affichage références...');
        
        var result = await TF.setRefDisplayColumns(grist, specs);
        
        if (result.configured && result.configured.length > 0) {
            log('[GENCI display] Configurés: ' + result.configured.length);
        }
        if (result.alreadyCorrect && result.alreadyCorrect.length > 0) {
            log('[GENCI display] Déjà corrects: ' + result.alreadyCorrect.length);
        }
        if (result.skipped && result.skipped.length > 0) {
            log('[GENCI display] Ignorés: ' + result.skipped.length, result.skipped);
        }
        if (result.errors && result.errors.length > 0) {
            log('[GENCI display] Erreurs: ' + result.errors.length, result.errors);
        }
        
        return result;
    }

    // Helper : obtient toutes les spécifications de références depuis le schéma
    function getExpectedReferenceSpecs(schema) {
        var specs = [];
        
        for (var tableId in schema.tables) {
            if (!Object.prototype.hasOwnProperty.call(schema.tables, tableId)) {
                continue;
            }
            
            var columns = schema.tables[tableId].columns || [];
            
            for (var i = 0; i < columns.length; i++) {
                var column = columns[i];
                var opts = column.opts || column;
                var type = opts.type || '';
                
                if (/^(Ref|RefList):/.test(type)) {
                    specs.push({
                        table: tableId,
                        column: column.id,
                        expectedType: type,
                        targetTable: getRefTarget(type)
                    });
                }
            }
        }
        
        return specs;
    }
    
    // Helper : charge les colonnes réelles des tables utilisateur
    async function loadActualTableColumns(grist, tableIds) {
        var columnsByTable = {};
        var errors = [];
        
        for (var i = 0; i < tableIds.length; i++) {
            var tableId = tableIds[i];
            
            try {
                var data = await grist.docApi.fetchTable(tableId);
                columnsByTable[tableId] = new Set(Object.keys(data || {}));
            } catch (e) {
                columnsByTable[tableId] = new Set();
                errors.push({
                    table: tableId,
                    error: e.message || String(e)
                });
            }
        }
        
        return {
            columnsByTable: columnsByTable,
            errors: errors
        };
    }

    function isEmptyListValue(value) {
        return Array.isArray(value) && (
            value.length === 0 ||
            (value.length === 1 && value[0] === 'L')
        );
    }

    function isDefaultColumnValue(value, type) {
        var normalizedType = String(type || 'Any');
        if (value == null || value === '') return true;
        if (isEmptyListValue(value)) return true;
        if (normalizedType === 'Bool') return value === false || value === 0;
        if (normalizedType === 'Int' || normalizedType === 'Numeric') return value === 0;
        if (/^Ref:/.test(normalizedType)) return value === 0;
        return false;
    }

    function comparableColumnValue(value) {
        if (isEmptyListValue(value)) return '[]';
        if (Array.isArray(value)) return JSON.stringify(value);
        if (value && typeof value === 'object') return JSON.stringify(value);
        if (value == null) return '';
        return String(value);
    }

    // Audit strictement en lecture seule des colonnes suffixées créées par erreur.
    // Une valeur Grist « non vide » n'est pas forcément une donnée métier : Numeric,
    // Bool et Ref sont notamment matérialisés par 0/false, et les formules ont un
    // résultat sur chaque ligne. L'audit distingue donc les valeurs par défaut,
    // les formules équivalentes et les divergences réelles.
    async function auditDuplicateColumns(grist) {
        var duplicates = [];
        var errors = [];

        var metadata = null;

        try {
            metadata = await loadSchemaMetadata(grist);
        } catch (metadataError) {
            errors.push({ table: '_grist_Tables_column', error: metadataError.message || String(metadataError) });
        }

        for (var i = 0; i < SCHEMA.tableOrder.length; i++) {
            var tableId = SCHEMA.tableOrder[i];
            var tableDef = SCHEMA.tables[tableId];
            if (!tableDef) continue;

            try {
                var data = await grist.docApi.fetchTable(tableId);
                var actualColumns = Object.keys(data || {});
                var canonicalIds = (tableDef.columns || []).map(function (column) { return column.id; });

                for (var j = 0; j < canonicalIds.length; j++) {
                    var canonicalId = canonicalIds[j];
                    var escaped = canonicalId.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                    var pattern = new RegExp('^' + escaped + '[0-9]+$');

                    for (var k = 0; k < actualColumns.length; k++) {
                        var columnId = actualColumns[k];
                        if (!pattern.test(columnId)) continue;
                        var values = Array.isArray(data[columnId]) ? data[columnId] : [];
                        var canonicalValues = Array.isArray(data[canonicalId]) ? data[canonicalId] : [];
                        var canonicalMeta = metadata && metadata.columnByKey[tableId + '.' + canonicalId];
                        var duplicateMeta = metadata && metadata.columnByKey[tableId + '.' + columnId];
                        var schemaColumn = (tableDef.columns || []).find(function (column) {
                            return column.id === canonicalId;
                        });
                        var columnType = (duplicateMeta && duplicateMeta.type) ||
                            (canonicalMeta && canonicalMeta.type) ||
                            (schemaColumn && schemaColumn.opts && schemaColumn.opts.type) ||
                            (schemaColumn && schemaColumn.type) ||
                            'Any';
                        var nonEmptyCount = values.filter(function (value) {
                            if (value == null || value === '') return false;
                            if (value === false) return false;
                            if (isEmptyListValue(value)) return false;
                            return true;
                        }).length;
                        var meaningfulCount = values.filter(function (value) {
                            return !isDefaultColumnValue(value, columnType);
                        }).length;
                        var differingFromCanonicalCount = values.filter(function (value, index) {
                            return comparableColumnValue(value) !== comparableColumnValue(canonicalValues[index]);
                        }).length;
                        var canonicalIsFormula = !!(canonicalMeta && canonicalMeta.isFormula);
                        var duplicateIsFormula = !!(duplicateMeta && duplicateMeta.isFormula);
                        var sameFormula = canonicalIsFormula && duplicateIsFormula &&
                            String(canonicalMeta.formula || '').trim() === String(duplicateMeta.formula || '').trim() &&
                            String(canonicalMeta.type || '') === String(duplicateMeta.type || '');
                        var classification;
                        var safeToRemove;

                        if (sameFormula) {
                            classification = 'equivalent-formula';
                            safeToRemove = true;
                        } else if (canonicalIsFormula || duplicateIsFormula) {
                            classification = 'formula-conflict';
                            safeToRemove = false;
                        } else if (meaningfulCount === 0) {
                            classification = 'default-only';
                            safeToRemove = true;
                        } else if (differingFromCanonicalCount === 0) {
                            classification = 'redundant-copy';
                            safeToRemove = true;
                        } else {
                            classification = 'divergent-data';
                            safeToRemove = false;
                        }

                        duplicates.push({
                            table: tableId,
                            canonicalColumn: canonicalId,
                            duplicateColumn: columnId,
                            type: columnType,
                            rowCount: values.length,
                            nonEmptyCount: nonEmptyCount,
                            meaningfulCount: meaningfulCount,
                            differingFromCanonicalCount: differingFromCanonicalCount,
                            formula: duplicateIsFormula,
                            classification: classification,
                            safeToRemove: safeToRemove,
                            // Compatibilité avec les premiers scripts d'audit.
                            empty: meaningfulCount === 0
                        });
                    }
                }
            } catch (error) {
                errors.push({ table: tableId, error: error.message || String(error) });
            }
        }

        return {
            safeToRemoveAll: errors.length === 0 && duplicates.every(function (item) { return item.safeToRemove; }),
            duplicateCount: duplicates.length,
            safeToRemoveCount: duplicates.filter(function (item) { return item.safeToRemove; }).length,
            requiresReviewCount: duplicates.filter(function (item) { return !item.safeToRemove; }).length,
            duplicates: duplicates,
            errors: errors
        };
    }

    // ========================================================================
    // INSPECTION — Vérification complète du schéma
    // ========================================================================
    
    async function inspectGenciSchema(grist, requiredTables, metadataSnapshot) {
        var result = {
            ready: true,
            missingTables: [],
            missingColumns: [],
            metadataPending: [],
            invalidColumnTypes: [],
            invalidRefTargets: [],
            invalidVisibleColumns: [],
            missingFormulaColumns: [],
            duplicateColumns: [],
            corrupted: false
        };
        
        try {
            // Utiliser le snapshot fourni ou charger les métadonnées
            var metadata = metadataSnapshot || await loadSchemaMetadata(grist);
            
            // Vérifier les tables essentielles
            for (var i = 0; i < requiredTables.length; i++) {
                var tableId = requiredTables[i];
                if (!metadata.tableById[tableId]) {
                    result.missingTables.push(tableId);
                    result.ready = false;
                }
            }
            
            // Vérifier TOUTES les références du schéma (pas juste 6)
            var expectedRefs = getExpectedReferenceSpecs(SCHEMA);
            
            // Charger les colonnes réelles des tables pour distinguer absent vs retardé
            var refTableIds = Array.from(new Set(expectedRefs.map(function(ref) {
                return ref.table;
            })));
            
            var actualColumns = await loadActualTableColumns(grist, refTableIds);
            
            for (var j = 0; j < expectedRefs.length; j++) {
                var ref = expectedRefs[j];
                var key = ref.table + '.' + ref.column;
                var metadataCol = metadata.columnByKey[key];
                var actualTableCols = actualColumns.columnsByTable[ref.table];
                var existsInTable = actualTableCols && actualTableCols.has(ref.column);
                
                // Cas 1 : Colonne absente des métadonnées ET de la table réelle
                if (!metadataCol && !existsInTable) {
                    result.missingColumns.push(key);
                    result.ready = false;
                    continue;
                }
                
                // Cas 2 : Colonne présente dans la table mais absente des métadonnées (retard)
                if (!metadataCol && existsInTable) {
                    result.metadataPending.push(key);
                    // Ne pas mettre ready = false, c'est temporaire
                    continue;
                }
                
                // Cas 3 : Colonne présente dans les métadonnées, vérifier le type
                if (metadataCol.type !== ref.expectedType) {
                    result.invalidColumnTypes.push({
                        column: key,
                        expected: ref.expectedType,
                        actual: metadataCol.type
                    });
                    result.ready = false;
                    
                    // Vérifier si la table cible existe
                    var targetType = ref.targetTable;
                    if (!metadata.tableById[targetType]) {
                        result.invalidRefTargets.push({
                            column: key,
                            expectedTarget: targetType
                        });
                    }
                }
            }
            
            // Vérifier les visibleCol sur TOUTES les références de SCHEMA.referenceDisplays
            var refDisplaySpecs = SCHEMA.referenceDisplays || [];
            
            for (var k = 0; k < refDisplaySpecs.length; k++) {
                var spec = refDisplaySpecs[k];
                var specKey = spec.table + '.' + spec.column;
                var specCol = metadata.columnByKey[specKey];
                
                if (!specCol) {
                    // Référence absente des métadonnées
                    if (!result.metadataPending.includes(specKey)) {
                        result.metadataPending.push(specKey);
                    }
                    continue;
                }
                
                var targetTable = getRefTarget(specCol.type);
                if (targetTable) {
                    var visColKey = targetTable + '.' + spec.visibleColId;
                    var visCol = metadata.columnByKey[visColKey];
                    
                    if (visCol) {
                        // Vérification stricte du visibleCol
                        if (Number(specCol.visibleCol) !== Number(visCol.id)) {
                            result.invalidVisibleColumns.push({
                                column: specKey,
                                expected: visCol.id,
                                actual: specCol.visibleCol
                            });
                            result.ready = false;
                        }
                    }
                }
            }
            
            // ====================================================================
            // DETECTION DES COLONNES DUPLIQUEES (CORRUPTION)
            // ====================================================================
            // Pour chaque table du schéma, vérifier les colonnes qui correspondent
            // au pattern ^<canonical>[0-9]+$ pour détecter les duplications
            for (var tableIdx = 0; tableIdx < SCHEMA.tableOrder.length; tableIdx++) {
                var tableId = SCHEMA.tableOrder[tableIdx];
                var tableDef = SCHEMA.tables[tableId];
                
                if (!tableDef || !metadata.tableById[tableId]) {
                    continue;
                }
                
                // Obtenir toutes les colonnes de cette table depuis les métadonnées
                var tableColumns = metadata.columns.filter(function(col) {
                    var parentTable = metadata.tables.find(function(t) { 
                        return sameRecordId(t.id, col.parentId);                    });
                    return parentTable && parentTable.tableId === tableId;
                });
                
                // Pour chaque colonne canonique du schéma
                for (var colIdx = 0; colIdx < tableDef.columns.length; colIdx++) {
                    var canonicalCol = tableDef.columns[colIdx];
                    var canonicalId = canonicalCol.id;
                    
                    // Échapper l'identifiant canonique pour la RegExp
                    var escapedCanonical = canonicalId.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                    var duplicatePattern = new RegExp('^' + escapedCanonical + '[0-9]+$');
                    
                    // Trouver les duplications
                    var duplicates = tableColumns.filter(function(col) {
                        return duplicatePattern.test(col.colId);
                    }).map(function(col) {
                        return col.colId;
                    });
                    
                    if (duplicates.length > 0) {
                        result.duplicateColumns.push({
                            table: tableId,
                            canonicalColumn: canonicalId,
                            duplicates: duplicates
                        });
                    }
                }
            }
            
            // Marquer comme corrompu si des duplications sont trouvées
            if (result.duplicateColumns.length > 0) {
                result.corrupted = true;
            }
            
        } catch (e) {
            result.error = e.message || String(e);
            result.ready = false;
        }
        
        return result;
    }

    // Helper : extrait l'ID d'un enregistrement créé
    function getAddedRecordId(actionResult, label) {
        var value = Array.isArray(actionResult)
            ? actionResult[0]
            : actionResult;

        if (typeof value === 'number' && Number.isFinite(value)) {
            return value;
        }

        if (
            value &&
            typeof value === 'object' &&
            typeof value.id === 'number'
        ) {
            return value.id;
        }

        throw new Error(
            'ID de ligne introuvable après AddRecord' +
            (label ? ' (' + label + ')' : '') +
            ': ' + JSON.stringify(actionResult)
        );
    }

    // ========================================================================
    // SEED — Données de démonstration (UNIQUEMENT si tables vides)
    // ========================================================================
    
    async function seedInitialData(grist, context) {
        var seedEntries = [];
        context = context || {};
        
        try {
            // Vérifier si Tasks est vide
            var tasksData = await grist.docApi.fetchTable('Tasks');
            var tasksCount = (tasksData && tasksData.id && tasksData.id.length) || 0;
            
            if (tasksCount > 0) {
                log('[GENCI seed] Tables non vides (' + tasksCount + ' tasks) — seed ignoré');
                return { seeded: false, reason: 'Tables non vides' };
            }
            
            log('[GENCI seed] Tables vides — création données de démonstration...');
            
            // Créer les données dans l'ordre de dépendance
            var createdIds = {};
            
            // 1. Entités
            if (context.tablesCreated && context.tablesCreated.indexOf('Entites') !== -1) {

    async function ensureGenciSchema(grist, options) {
        options = options || {};
        
        // Utiliser les formules et choix centralisés par défaut
        var formulasMap = options.formulasMap || SCHEMA.formulas || {};
        var defaultChoices = options.defaultChoices || SCHEMA.defaultChoices || {};
        
        // Sérialise les appels dans une même iframe
        if (bootstrapPromise) {
            return bootstrapPromise;
        }
        
        if (bootstrapComplete && !options.force) {
            return Promise.resolve({ success: true, alreadyComplete: true });
        }
        
        bootstrapPromise = (async function () {
            var startTime = Date.now();
            var globalLog = [];
            var result = {
                success: false,
                phases: {},
                errors: [],
                warnings: []
            };
            
            try {
                log('Démarrage initialisation...');
                
                // Phase 0 : Inspection et détection du type de document
                log('Phase 0: Inspection...');
                var migrationLog = await migrateLegacyTables(grist);
                globalLog = globalLog.concat(migrationLog);
                
                // Inspection des tables existantes
                var tablesData = await grist.docApi.fetchTable('_grist_Tables');
                var tables = columnarToRows(tablesData);
                var tableIds = tables.map(function(t) { return t.tableId; });
                
                var essentialTables = ['Team', 'Feuilles', 'TimeEntries', 'TaskFlow_Meta'];
                var hasAnyEssentialTable = essentialTables.some(function(tableId) {
                    return tableIds.indexOf(tableId) !== -1;
                });
                
                var isNewDoc = !hasAnyEssentialTable;
                
                if (isNewDoc) {
                    log('Document véritablement neuf détecté : création des tables avant migrations');
                    
                    // Pour un document neuf : créer les tables D'ABORD
                    log('Phase 1: Création tables (document neuf)...');
                    var phase1 = await ensureBaseTables(grist, SCHEMA, formulasMap);
                    globalLog.push('Tables créées: ' + phase1.created.join(', '));
                    result.phases.tables = phase1;
                    
                    // Synchronisation
                    var allExpectedTables = SCHEMA.tableOrder.slice();
                    var metadata = await syncMetadata(grist, allExpectedTables);
                    result.phases.sync = { success: true };
                    
                    // Phase 2 : Colonnes Ref
                    log('Phase 2: Colonnes Ref (document neuf)...');
                    var phase2 = await ensureRefColumns(grist, SCHEMA, formulasMap);
                    globalLog.push('Ref ajoutées: ' + phase2.added.join(', '));
                    if (phase2.repaired.length > 0) {
                        globalLog.push('Ref réparées: ' + phase2.repaired.join(', '));
                    }
                    
                    if (phase2.errors.length > 0) {
                        result.errors.push({ phase: 'refs', errors: phase2.errors });
                        result.success = false;
                        log('Échec création des colonnes Ref, arrêt du bootstrap');
                        return result;
                    }
                    
                    result.phases.refs = phase2;
                    
                    // Pause stabilisation
                    await delay(500);
                    
                    // Phase 3 : Formules
                    if (formulasMap && Object.keys(formulasMap).length > 0) {
                        log('Phase 3: Formules (document neuf)...');
                        var phase3 = await ensureFormulaColumns(grist, formulasMap);
                        globalLog.push('Formules ajoutées: ' + phase3.added.join(', '));
                        if (phase3.repaired.length > 0) {
                            globalLog.push('Formules réparées: ' + phase3.repaired.join(', '));
                        }
                        result.phases.formulas = phase3;
                    }
                    
                    // Maintenant que les tables existent, exécuter les migrations
                    log('Tables créées, exécution des migrations...');
                }
                
                // Exécuter les migrations versionnées si TaskFlowMigrations est disponible
                var migrationFailed = false;
                if (global.TaskFlowMigrations) {
                    try {
                        var currentVersion = await global.TaskFlowMigrations.getCurrentVersion(grist);
                        log('Version actuelle du schéma: v' + currentVersion);
                        
                        var migrationResult = await global.TaskFlowMigrations.runMigrations(grist, currentVersion);
                        
                        if (migrationResult.success) {
                            log('Migrations appliquées: ' + migrationResult.applied + ' migrations, version finale: v' + migrationResult.finalVersion);
                            globalLog.push('Migrations: v' + currentVersion + ' → v' + migrationResult.finalVersion);
                            result.phases.migrations = migrationResult;
                        } else {
                            migrationFailed = true;
                            result.errors.push({ phase: 'migrations', message: 'Certaines migrations ont échoué' });
                        }
                    } catch (migrationError) {
                        log('Erreur lors des migrations: ' + (migrationError.message || migrationError));
                        migrationFailed = true;
                        result.errors.push({ phase: 'migrations', error: migrationError.message || String(migrationError) });
                    }
                }
                
                result.phases.migration = migrationLog;
                
                // FAIL CLOSED : si les migrations ont échoué ET que ce n'est pas un document neuf, arrêter
                if (migrationFailed && !isNewDoc) {
                    log('Échec des migrations sur document existant - arrêt du bootstrap en mode fail closed');
                    result.success = false;
                    bootstrapComplete = false;
                    return result;
                }
                
                // Si c'est un document neuf et que les migrations ont échoué, continuer avec le schéma déclaratif
                if (migrationFailed && isNewDoc) {
                    log('Document neuf : migrations échouées mais on continue avec le schéma déclaratif');
                }
                
                // Pour un document neuf, les phases 1-3 ont déjà été exécutées
                if (!isNewDoc) {
                    // Phase 1 : Création des tables (sans Ref)
                    log('Phase 1: Création tables...');
                    var phase1 = await ensureBaseTables(grist, SCHEMA, formulasMap);
                    globalLog.push('Tables créées: ' + phase1.created.join(', '));
                    result.phases.tables = phase1;
                    
                    // Synchronisation
                    var allExpectedTables = SCHEMA.tableOrder.slice();
                    var metadata = await syncMetadata(grist, allExpectedTables);
                    result.phases.sync = { success: true };
                    
                    // Phase 2 : Colonnes Ref
                    log('Phase 2: Colonnes Ref...');
                    var phase2 = await ensureRefColumns(grist, SCHEMA, formulasMap);
                    globalLog.push('Ref ajoutées: ' + phase2.added.join(', '));
                    if (phase2.repaired.length > 0) {
                        globalLog.push('Ref réparées: ' + phase2.repaired.join(', '));
                    }
                    
                    if (phase2.errors.length > 0) {
                        result.errors.push({ phase: 'refs', errors: phase2.errors });
                        result.success = false;
                        log('Échec création des colonnes Ref, arrêt du bootstrap');
                        return result;
                    }
                    
                    result.phases.refs = phase2;
                    
                    // Pause stabilisation avant formules
                    await delay(500);
                    
                    // Phase 3 : Formules
                    if (formulasMap && Object.keys(formulasMap).length > 0) {
                        log('Phase 3: Formules...');
                        var phase3 = await ensureFormulaColumns(grist, formulasMap);
                        globalLog.push('Formules ajoutées: ' + phase3.added.join(', '));
                        if (phase3.repaired.length > 0) {
                            globalLog.push('Formules réparées: ' + phase3.repaired.join(', '));
                        }
                        result.phases.formulas = phase3;
                    }
                }
                
                // Phase 4 : Choices
                log('Phase 4: Choices...');
                var phase4 = await configureChoiceColumns(grist, defaultChoices);
                result.phases.choices = phase4;
                
                // Phase 5 : Affichage des références
                log('Phase 5: Affichage références...');
                var phase5 = await configureAllRefDisplays(grist, GENCI_REF_DISPLAY_SPECS);
                result.phases.display = phase5;
                
                if (!phase5.ok) {
                    result.warnings.push({ phase: 'display', errors: phase5.errors });
                }
                
                // Phase 6 : Seed (seulement si demandé explicitement)
                if (options.seedDemo === true) {
                    log('Phase 6: Seed de démonstration...');
                    var seedContext = { tablesCreated: phase1.created };
                    var phase6 = await seedInitialData(grist, seedContext);
                    result.phases.seed = phase6;
                    if (phase6.seeded) {
                        globalLog = globalLog.concat(phase6.log || []);
                    }
                    if (phase6.error) {
                        result.errors.push({ phase: 'seed', error: phase6.error });
                    }
                } else {
                    result.phases.seed = {
                        seeded: false,
                        reason: 'Seed de démonstration désactivé (options.seedDemo !== true)'
                    };
                }
                
                // Vérification finale
                log('Vérification finale...');
                
                // Délai de stabilisation avant validation
                await delay(300);
                
                // Relire les métadonnées fraîches
                metadata = await loadSchemaMetadata(grist);
                
                var requiredTables = ['Team', 'Programmes', 'Entites', 'Projects', 'Tasks', 'Actions'];
                var inspection = await inspectGenciSchema(grist, requiredTables, metadata);
                
                if (!inspection.ready) {
                    result.errors.push({
                        phase: 'validation',
                        missingTables: inspection.missingTables,
                        missingColumns: inspection.missingColumns,
                        invalidTypes: inspection.invalidColumnTypes
                    });
                    
                    // Ne pas considérer comme échec total si ce sont juste des visibleCol ou metadataPending
                    if (inspection.missingTables.length === 0 && inspection.missingColumns.length === 0) {
                        result.success = true;
                        result.warnings.push({ phase: 'validation', details: inspection });
                    } else {
                        result.success = false;
                    }
                } else {
                    result.success = true;
                }
                
                // ====================================================================
                // ÉCRITURE DU MARQUEUR 'ready' DANS TaskFlow_Meta (SEULEMENT SI SUCCÈS)
                // ====================================================================
                if (result.success && TF && TF.writeSchemaReady) {
                    try {
                        log('Écriture de TaskFlow_Meta avec statut ready...');
                        
                        // Vérifier que la version dans TaskFlow_Meta correspond à SCHEMA.version
                        var metaData = await grist.docApi.fetchTable('TaskFlow_Meta');
                        var metaRows = columnarToRows(metaData);
                        var metaVersion = metaRows && metaRows.length > 0 ? metaRows[0].schemaVersion : null;
                        
                        if (metaVersion !== SCHEMA.version) {
                            log('Attention: version TaskFlow_Meta (' + metaVersion + ') != SCHEMA.version (' + SCHEMA.version + ')');
                            result.errors.push({
                                phase: 'validation',
                                code: 'SCHEMA_VERSION_NOT_CONFIRMED',
                                expected: SCHEMA.version,
                                actual: metaVersion
                            });
                            result.success = false;
                            bootstrapComplete = false;
                            return result;
                        }
                        
                        // Utiliser le nom de la dernière migration appliquée, pas la version numérique
                        var lastAppliedMigration = null;
                        if (result.phases.migrations && result.phases.migrations.results) {
                            var migrationResults = result.phases.migrations.results;
                            if (migrationResults.length > 0) {
                                lastAppliedMigration = migrationResults[migrationResults.length - 1].name;
                            }
                        }
                        
                        // Construire les options conditionnellement pour ne pas effacer lastMigration
                        var readyOptions = {
                            schemaVersion: SCHEMA.version,
                            installedBy: 'TaskFlowBootstrap'
                        };
                        
                        if (lastAppliedMigration) {
                            readyOptions.lastMigration = lastAppliedMigration;
                        }
                        
                        var writeResult = await TF.writeSchemaReady(grist, readyOptions);
                        
                        if (writeResult.success) {
                            log('TaskFlow_Meta écrit avec succès: ' + writeResult.action);
                        } else {
                            log('Attention: échec écriture TaskFlow_Meta:', writeResult.error);
                            result.warnings.push({
                                phase: 'meta-write',
                                error: writeResult.error
                            });
                        }
                    } catch (writeError) {
                        log('Erreur lors de l\'écriture de TaskFlow_Meta:', writeError);
                        result.warnings.push({
                            phase: 'meta-write',
                            error: writeError.message || String(writeError)
                        });
                        // Ne pas considérer comme échec total, c'est un métadata
                    }
                }
                
                // Afficher le détail de la validation
                console.info(
                    '[GENCI validation]',
                    JSON.stringify({
                        ready: inspection.ready,
                        missingTables: inspection.missingTables,
                        missingColumns: inspection.missingColumns,
                        metadataPending: inspection.metadataPending,
                        invalidColumnTypes: inspection.invalidColumnTypes.length,
                        invalidRefTargets: inspection.invalidRefTargets.length,
                        invalidVisibleColumns: inspection.invalidVisibleColumns.length
                    }, null, 2)
                );
                
                // Afficher les warnings techniques
                if (result.warnings && result.warnings.length > 0) {
                    console.warn('[GENCI] Warnings:', result.warnings);
                }
                
                // Afficher les erreurs si échec
                if (!result.success && result.errors && result.errors.length > 0) {
                    console.error('[GENCI] Errors:', JSON.stringify(result.errors, null, 2));
                }
                
                // bootstrapComplete seulement si succès
                bootstrapComplete = result.success === true;
                var duration = Date.now() - startTime;
                log('Initialisation terminée (' + duration + 'ms)');
                result.duration = duration;
                result.log = globalLog;
                
                return result;
                
            } catch (e) {
                log('Échec initialisation: ' + (e.message || e));
                result.errors.push({ phase: 'global', error: e.message || String(e) });
                result.success = false;
                bootstrapComplete = false;
                throw e;
            } finally {
                bootstrapPromise = null;
            }
        })();
        
        return bootstrapPromise;

const DAY = 86400000;
const JOURS = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven'];  // 5 jours uniquement

const S = {
  alone: false, gOk: false,
  me: null,                 // id Team du connecte (pour soumission)

// ---- Utils ----------------------------------------------------------------
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const gristToMs = (ts) => ts ? ts * 1000 : 0;
const msToGrist = (ms) => Math.floor(ms / 1000);

// CORRECTION : Formater une date locale en ISO YYYY-MM-DD sans passer par UTC
function localDateIso(ms) {
  const date = new Date(ms);
  return [
    date.getFullYear(),
    String(date.getMonth() + 1).padStart(2, '0'),
    String(date.getDate()).padStart(2, '0')
  ].join('-');
}

function refIds(v) { return Array.isArray(v) && v[0] === 'L' ? v.slice(1).map(Number) : []; }
function mondayOf(ms) { const x = new Date(ms); const dow = (x.getDay() + 6) % 7; x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - dow); return x.getTime(); }
function weekDays() { 
  const r = []; 
  for (let i = 0; i < 5; i++)  // Lun-Ven uniquement (5 jours)
    r.push(S.weekStart + i * DAY); 
  return r; 
}
function sameDay(a, b) { return mondayOf(a) === mondayOf(b) && new Date(a).getDate() === new Date(b).getDate(); }

// unite : facteur de conversion heures <-> unite
function unitFactor() { return S.unit === 'jours' ? S.hoursPerDay : (S.unit === 'demi' ? S.hoursPerDay / 2 : 1); }
function unitLabel() { return S.unit === 'jours' ? 'jours' : (S.unit === 'demi' ? 'demi-journees' : 'heures'); }
function hoursToQty(h) { const q = h / unitFactor(); return Math.round(q * 100) / 100; }
function qtyToHours(q) { return (Number(q) || 0) * unitFactor(); }

/**
 * Parseur pour la saisie en mode correction manager
 * CONTRAT: distingue chaîne vide et zéro
 * @param {string} qtyStr - Chaîne saisie par l'utilisateur
 * @returns {{ valid: boolean, hours?: number, error?: string }}
 */
function parseManagerHoursInput(qtyStr) {
  // Chaîne vide ou uniquement des espaces
  if (qtyStr === null || qtyStr === undefined || String(qtyStr).trim() === '') {
    return { valid: false, error: 'Valeur requise' };
  }
  
  const trimmed = String(qtyStr).trim();
  const parsed = Number(trimmed);
  
  // Valeur non numérique
  if (!Number.isFinite(parsed)) {
    return { valid: false, error: 'Valeur numérique requise' };
  }
  
  // Valeur négative
  if (parsed < 0) {
    return { valid: false, error: 'Valeur positive requise' };
  }
  
  // Zéro est valide
  return { valid: true, hours: parsed };
}
function fmtQty(h) { if (!h) return ''; const q = hoursToQty(h); return String(q); }

// PHASE 5 : Formatter pour inputs (distingue 0 explicite de null)
function fmtInputQty(hours, hasValue) {
  if (!hasValue) {
    return '';
  }
  return String(hoursToQty(hours));
}

function activeAssignmentForCraCell(taskId, dayMs, personId) {
  if (typeof CRAController === 'undefined' || !CRAController.resolveActiveAssignment) return null;
  const task = S.indexes && S.indexes.taskById
    ? S.indexes.taskById.get(Number(taskId))
    : S.tasks.find(t => Number(t.id) === Number(taskId));
  const project = task && task.projet
    ? S.projects.find(p => Number(p.id) === Number(task.projet))
    : null;
  const result = CRAController.resolveActiveAssignment(
    Number(taskId),
    Number(personId),
    localDateIso(dayMs),
    S.assignments,
    {
      projectStartDate: project ? project.dateDebut : null,
      projectEndDate: project ? project.dateFin : null,
      allowWeekends: false
    }
  );
  return result && result.status === 'found' ? result.assignment : null;
}

function assignmentForCraEntry(entry) {
  if (!entry) return null;
  if (entry.affectation && S.indexes && S.indexes.assignmentById) {
    const exact = S.indexes.assignmentById.get(Number(entry.affectation));
    if (exact) return exact;
  }
  if (entry.tache && entry.membre && entry.date != null) {
    return activeAssignmentForCraCell(Number(entry.tache), gristToMs(entry.date), Number(entry.membre));
  }
  return null;
}

function isPunctualCraEntry(entry) {
  const assignment = assignmentForCraEntry(entry);
  return Boolean(assignment && assignment.modeRepartition === 'ponctuel');
}

// Les anciennes versions pouvaient matérialiser une proposition positive pour
// une affectation ponctuelle. Elle ne doit plus préremplir le CRA : seul le
// réalisé explicitement saisi par l'utilisateur compte.
function effectiveCraPlannedHours(entry) {
  return isPunctualCraEntry(entry) ? 0 : (Number(entry && entry.heuresPrevues) || 0);
}

function hasExplicitCraActual(entry) {
  return Boolean(entry) && entry.heures !== null && entry.heures !== undefined &&
    entry.heures !== '' && Number.isFinite(Number(entry.heures));
}

function effectiveCraDisplayedHours(entry) {
  return hasExplicitCraActual(entry) ? Number(entry.heures) : effectiveCraPlannedHours(entry);
}

// PHASE 5 : Helper pour obtenir l'état d'affichage d'une cellule
function getCellDisplayState(taskId, dayMs, personId) {
  const entries = cellEntries(taskId, dayMs, personId);
  const assignment = activeAssignmentForCraCell(taskId, dayMs, personId);
  const isVirtualPunctual = Boolean(assignment && assignment.modeRepartition === 'ponctuel');
  
  if (!entries || entries.length === 0) {
    return {
      actualHours: 0,
      plannedHours: 0,
      displayedHours: 0,
      hasDisplayValue: isVirtualPunctual,
      hasExplicitActual: false,
      isPrefilled: false,
      isVirtualPunctual: isVirtualPunctual
    };
  }
  
  // Utiliser les helpers du contrôleur si disponibles
  if (typeof CRAController !== 'undefined' && CRAController.buildCellDisplayState) {
    const state = CRAController.buildCellDisplayState(entries, {
      ignorePlanned: isVirtualPunctual,
      virtualZero: isVirtualPunctual
    });
    state.isVirtualPunctual = isVirtualPunctual && !state.hasExplicitActual;
    return state;
  }
  
  // Fallback : calcul local
  let actualHours = 0;
  let plannedHours = 0;
  let displayedHours = 0;
  let hasExplicitActual = false;
  let isPrefilled = false;
  
  for (const entry of entries) {
    const hasActual = (
      entry.heures !== null &&
      entry.heures !== undefined &&
      entry.heures !== '' &&
      Number.isFinite(Number(entry.heures))
    );
    
    const entryActual = hasActual ? Number(entry.heures) : 0;
    const entryPlanned = effectiveCraPlannedHours(entry);
    const entryDisplayed = hasActual ? Number(entry.heures) : entryPlanned;
    
    actualHours += entryActual;
    plannedHours += entryPlanned;
    displayedHours += entryDisplayed;
    
    if (hasActual) {
      hasExplicitActual = true;
    }
    
    if (!hasActual && entryPlanned > 0) {
      isPrefilled = true;
    }
  }
  
  return {
    actualHours,
    plannedHours,
    displayedHours,
    hasDisplayValue: displayedHours > 0 || hasExplicitActual || isVirtualPunctual,
    hasExplicitActual,
    isPrefilled,
    isVirtualPunctual: isVirtualPunctual && !hasExplicitActual
  };
}

// Tâches pour une personne donnée (optimisé avec index)
function gridTasksForPerson(personId) {
  const ids = new Set();
  
  // Tâches assignées à cette personne (via index)
  if (S.indexes && S.indexes.taskById) {
    for (const [taskId, task] of S.indexes.taskById) {
      if (refIds(task.assignees).includes(personId)) {
        ids.add(taskId);
      }
    }
  } else {
    // Fallback sans index
    for (const t of S.tasks) {
      if (refIds(t.assignees).includes(personId)) {
        ids.add(t.id);
      }
    }
  }
  
  // Tâches provenant des affectations actives (optimisé avec index)
  if (S.indexes && S.indexes.assignmentsByPersonTask) {
    for (const [key, assignment] of S.indexes.assignmentsByPersonTask) {
      if (key.startsWith(personId + '|')) {
        ids.add(assignment.tache);
      }
    }
  } else {
    // Fallback
    for (const a of S.assignments) {
      if (a.membre === personId && a.actif !== false) {
        ids.add(a.tache);
      }
    }
  }
  
  // Tâches avec saisie cette semaine (déjà dans les index entriesByPersonWeek)
  if (S.indexes && S.indexes.entriesByPersonWeek) {
    for (const [key, entries] of S.indexes.entriesByPersonWeek) {
      if (key.startsWith(personId + '|')) {
        const taskId = Number(key.split('|')[1]);
        if (taskId) {
          ids.add(taskId);
        }
      }
    }
  }
  
  // Tâches ajoutées manuellement
  const extraForPerson = S.extraRows[personId] || [];
  for (const id of extraForPerson) {
    ids.add(id);
  }
  
  // Construire la liste des tâches candidates
  let candidateTasks = [...ids].map(id => {
    if (S.indexes && S.indexes.taskById) {
      return S.indexes.taskById.get(id);
    }
    return S.tasks.find(t => t.id === id);
  }).filter(Boolean);
  
  // Appliquer les filtres project, programme, task
  return S.filterSync.filterCraTasks(candidateTasks, S.filters, S.projects);
}

  const allTasks = new Set();
  for (const personId of S.visiblePersonIds) {

  }
  return [...allTasks].map(id => S.tasks.find(t => t.id === id)).filter(Boolean);

// Parse Team.indispos (JSON) + Disponibilites table pour une personne donnée
function parseIndisposFor(personId) {
  const indispos = [];
  // Depuis Team.indispos (JSON inline)
  const person = S.team.find(t => t.id === personId);
  if (person && person.indispos) {
    try {
      const arr = JSON.parse(person.indispos);
      if (Array.isArray(arr)) indispos.push(...arr);
    } catch (e) {}
  }
  // Depuis Disponibilites table
  for (const d of S.disponibilites) {
    if (d.membre === personId) {
      indispos.push({
        start: gristToMs(d.dateDebut),
        end: gristToMs(d.dateFin),
        type: d.type || 'autre',
        dispo: d.dispo != null ? d.dispo : 0,  // % de dispo (0 = indispo totale)
        label: d.commentaire || d.type
      });
    }
  }
  return indispos;
}

// Parse pour moi (legacy)
function parseIndispos() {
  return parseIndisposFor(S.me);
}

// Est-ce qu'un jour (ms) est en indisponibilité ?
function isIndispo(dayMs, indispos) {
  for (const ind of indispos) {
    if (dayMs >= ind.start && dayMs <= ind.end) {
      // Si dispo=0 ou non défini = indispo totale
      if (!ind.dispo || ind.dispo === 0) return { isIndispo: true, type: ind.type, label: ind.label };
      // Sinon dispo partielle (ex: 50% = on peut travailler 50% de la capacité)
      return { isIndispo: true, type: ind.type, label: ind.label, dispo: ind.dispo };
    }
  }
  return { isIndispo: false };
}
