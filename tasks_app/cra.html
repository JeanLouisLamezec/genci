      accessibleSheetCount: managerState.accessibleSheets ? managerState.accessibleSheets.length : 0,
      pendingCount: managerState.pendingCount,
      shouldShowManagerTab: managerState.shouldShowManagerTab
    });
  }
  document.querySelectorAll('#tabSeg button').forEach(b => b.classList.toggle('active', b.dataset.t === S.tab));
  updateSubmitBtn();
  const main = document.getElementById('main');
  if (!S.hasTable) {
    main.innerHTML = '<div class="empty-cta">La feuille de temps n\'est pas encore activee sur ce document.<br>'
      + 'Elle cree les tables <b>TimeEntries</b> + <b>Feuilles</b> (opt-in, non destructif).<br><br>'
      + '<button class="btn" id="activateBtn">Activer la feuille de temps</button></div>';
    const b = document.getElementById('activateBtn'); if (b) b.onclick = activate;
    return;
  }
  if (S.tab === 'valider') return renderValider();
  renderSaisie();
}

// ============================================================================
// ASSOCIATION LIBRE - Dialogue et service
// ============================================================================

let associationInProgress = false;
let selectedAssociationMemberId = null;

/**
 * Affiche le dialogue d'association
 */
function showAssociationDialog() {
  if (!S.identityState || S.identityState.status !== 'ASSOCIATION_REQUIRED') {
    console.warn('[CRA] showAssociationDialog appelé hors état ASSOCIATION_REQUIRED');
    return;
  }
  
  // Réinitialiser l'état de sélection
  selectedAssociationMemberId = null;
  associationInProgress = false;
  
  const candidates = S.identityState.candidates || [];
  
  // Créer la modale si elle n'existe pas
  let modal = document.getElementById('craAssociationModal');
  if (modal) {
    modal.remove();
  }
  
  modal = document.createElement('div');
  modal.id = 'craAssociationModal';
  modal.className = 'modal-ov';
  modal.setAttribute('role', 'dialog');
  modal.setAttribute('aria-modal', 'true');
  modal.setAttribute('aria-labelledby', 'craAssociationTitle');
  
  modal.innerHTML = `
    <div class="modal">
      <h2 id="craAssociationTitle">Associer votre compte Grist</h2>
      <p class="csub">
        Votre compte n'est pas encore associé à un membre de l'équipe.
        Sélectionnez votre propre profil pour continuer.
      </p>
      
      <div id="craAssociationError" style="background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:12px;margin-bottom:16px;color:#dc2626;font-size:.85rem;display:none"></div>
      
      <div style="margin-bottom:16px;max-height:400px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;">
        ${candidates.length === 0 ? 
          '<p style="padding:20px;text-align:center;color:var(--text-muted)">Aucun candidat disponible</p>' :
          candidates.map(c => `
            <div class="cra-association-option" data-member-id="${c.id}" style="padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:12px;" role="radio" aria-checked="false" tabindex="0">
              <div style="width:20px;height:20px;border:2px solid var(--border);border-radius:50%;flex-shrink:0;"></div>
              <div style="flex:1">
                <div style="font-weight:600;font-size:.9rem;">${escapeHtml(c.nom)}</div>
                <div style="font-size:.8rem;color:var(--text-muted);">${escapeHtml(c.email)}</div>
              </div>
            </div>
          `).join('')
        }
      </div>
      
      <div class="cacts" style="display:flex;gap:8px;justify-content:flex-end;">
        <button class="cbtn" id="craAssociationCancel">Annuler</button>
        <button class="cbtn primary" id="craAssociationConfirm" disabled>Associer mon compte</button>
      </div>
    </div>
  `;
  
  document.body.appendChild(modal);
  
  // Gestionnaires d'événements
  const cancelBtn = document.getElementById('craAssociationCancel');
  const confirmBtn = document.getElementById('craAssociationConfirm');
  const errorEl = document.getElementById('craAssociationError');
  const options = modal.querySelectorAll('.cra-association-option');
  
  // Annuler
  cancelBtn.onclick = () => {
    closeModal();
  };
  
  // Confirmer
  confirmBtn.onclick = () => {
    if (selectedAssociationMemberId) {
      performAssociation(selectedAssociationMemberId);
    }
  };
  
  // Sélection d'une option
  options.forEach(option => {
    option.onclick = () => selectOption(option);
    option.onkeydown = (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        selectOption(option);
      }
    };
  });
  
  // Échap pour fermer
  const escHandler = (e) => {
    if (e.key === 'Escape' && !associationInProgress) {
      closeModal();
    }
  };
  document.addEventListener('keydown', escHandler);
  
  // Afficher la modale
  modal.classList.add('open');
  modal.setAttribute('aria-hidden', 'false');
  
  // Focus sur le premier élément
  if (options.length > 0) {
    options[0].focus();
  }
  
  // Fonctions locales
  function selectOption(selectedOption) {
    if (associationInProgress) return;
    
    // Désélectionner toutes les options
    options.forEach(opt => {
      opt.setAttribute('aria-checked', 'false');
      const circle = opt.firstElementChild;
      if (circle) circle.style.borderColor = 'var(--border)';
      opt.style.background = '';
    });
    
    // Sélectionner l'option cliquée
    selectedOption.setAttribute('aria-checked', 'true');
    const selectedCircle = selectedOption.firstElementChild;
    if (selectedCircle) selectedCircle.style.borderColor = 'var(--primary)';
    selectedOption.style.background = 'color-mix(in srgb, var(--primary) 8%, transparent)';
    
    selectedAssociationMemberId = Number(selectedOption.getAttribute('data-member-id'));
    confirmBtn.disabled = false;
    confirmBtn.focus();
  }
  
  function closeModal() {
    if (associationInProgress) return;
    document.removeEventListener('keydown', escHandler);
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden', 'true');
    setTimeout(() => modal.remove(), 200);
  }
  
  function performAssociation(memberId) {
    if (associationInProgress) return;
    associationInProgress = true;
    
    // Désactiver l'interface
    confirmBtn.disabled = true;
    cancelBtn.disabled = true;
    options.forEach(opt => opt.style.pointerEvents = 'none');
    
    // Afficher l'état de chargement
    confirmBtn.textContent = 'Association en cours…';
    errorEl.style.display = 'none';
    
    // Obtenir le module de service (depuis le bundle TaskFlowCra)
    const identityModule = globalThis.TaskFlowCra?.identity;
    const claimService = globalThis.TaskFlowCra?.claimService;
    
    if (!identityModule || !claimService) {
      showError('Service d\'association indisponible');
      associationInProgress = false;
      confirmBtn.disabled = false;
      cancelBtn.disabled = false;
      options.forEach(opt => opt.style.pointerEvents = '');
      confirmBtn.textContent = 'Associer mon compte';
      return;
    }
    
    // Valider la demande avec S.currentGristUserId (155719, pas S.currentUserMemberId)
    const validation = identityModule.buildIdentityClaim({
      team: S.team,
      selectedTeamMemberId: memberId,
      currentGristUserId: S.currentGristUserId
    });
    
    if (!validation.allowed) {
      showError(validation.reason || 'Demande invalide');
      associationInProgress = false;
      confirmBtn.disabled = false;
      cancelBtn.disabled = false;
      options.forEach(opt => opt.style.pointerEvents = '');
      confirmBtn.textContent = 'Associer mon compte';
      return;
    }
    
    // Afficher la confirmation
    const selectedMember = candidates.find(c => c.id === memberId);
    if (!confirm(`Votre compte sera associé à :\n\n${selectedMember.nom}\n${selectedMember.email}\n\nCette association ne pourra pas être modifiée depuis le CRA.\n\nConfirmer ?`)) {
      associationInProgress = false;
      confirmBtn.disabled = false;
      cancelBtn.disabled = false;
      options.forEach(opt => opt.style.pointerEvents = '');
      confirmBtn.textContent = 'Associer mon compte';
      return;
    }
    
    // Appel au service
    claimService.claimCurrentUserIdentity({
      grist: grist,
      teamMemberId: memberId,
      currentGristUserId: S.currentGristUserId,  // Utiliser le userId Grist brut
      team: S.team,
      reloadSnapshot: () => {
        // Recharger via CraDataLoader
        if (typeof CraDataLoader !== 'undefined' && CraDataLoader.requestCraReload) {
          return CraDataLoader.requestCraReload({
            reason: 'identity-association',
            immediate: true
          });
        }
        return Promise.resolve();
      }
    }).then(result => {
      if (result.success) {
        // Succès : fermer et recharger
        associationInProgress = false;  // Libérer AVANT de fermer
        selectedAssociationMemberId = null;  // Réinitialiser la sélection
        closeModal();  // Maintenant que associationInProgress = false, ça ferme
        // Le rechargement mettra à jour S.identityState et S.currentUserMemberId
        if (typeof notify !== 'undefined') {
          notify('Compte associé avec succès', 'success');
        }
      } else {
        // Échec : afficher l'erreur
        let message = 'Échec de l\'association';
        if (result.code === 'IDENTITY_CLAIM_CONFLICT') {
          message = 'Cette ligne a été associée entre-temps. Veuillez recharger.';
        } else if (result.code === 'IDENTITY_CLAIM_WRITE_FAILED') {
          message = 'Erreur lors de l\'enregistrement. Veuillez réessayer.';
        } else if (result.reason) {
          message = result.reason;
        }
        showError(message);
        associationInProgress = false;
        confirmBtn.disabled = false;
        cancelBtn.disabled = false;
        options.forEach(opt => opt.style.pointerEvents = '');
        confirmBtn.textContent = 'Associer mon compte';
      }
    }).catch(e => {
      showError('Erreur inattendue : ' + (e.message || String(e)));
      associationInProgress = false;
      confirmBtn.disabled = false;
      cancelBtn.disabled = false;
      options.forEach(opt => opt.style.pointerEvents = '');
      confirmBtn.textContent = 'Associer mon compte';
    });
  }
  
  function showError(message) {
    errorEl.textContent = message;
    errorEl.style.display = 'block';
  }
}

/**
 * Helper : échapper le HTML
 */
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}
function updateSubmitBtn() {
  const sb = document.getElementById('submitBtn'), eb = document.getElementById('exportBtn');
  eb.style.display = (S.hasTable && S.visiblePersonIds.length > 0) ? '' : 'none';
  if (!(S.tab === 'saisie' && S.hasTable && S.visiblePersonIds.length > 0)) { sb.style.display = 'none'; return; }
  sb.style.display = '';
  
  // Vérifier si on est en mode correction manager
  if (S.managerCorrectionSheetId) {
    // Mode correction manager : bouton de revalidation
    sb.textContent = 'Revalider la feuille';
    sb.disabled = false;
    sb.className = 'btn';
    sb.onclick = () => {
      if (typeof CraWorkflowIntegration !== 'undefined' && CraWorkflowIntegration.revalidateSheet) {
        CraWorkflowIntegration.revalidateSheet(S.managerCorrectionSheetId);
      }
    };
    return;
  }
  
  // Utiliser currentUserMemberId (identité réelle), jamais selectedPersonId ou visiblePersonIds[0]
  const currentUserId = S.currentUserMemberId;
  
  // Vérifier l'état d'identité pour l'association libre
  if (S.identityState && S.identityState.status === 'ASSOCIATION_REQUIRED') {
    // Afficher le bouton d'association
    sb.textContent = 'Associer mon compte…';
    sb.disabled = false;
    sb.className = 'btn primary';
    sb.onclick = () => {
      showAssociationDialog();
    };
    return;
  }
  
  // Si identityState indique un conflit bloquant
  if (S.identityState && S.identityState.status !== 'IDENTIFIED' && S.identityState.status !== 'ASSOCIATION_REQUIRED') {
    sb.textContent = 'Identité impossible';
    sb.disabled = true;
    sb.className = 'btn ghost';
    sb.onclick = null;
    return;
  }
  
  if (!currentUserId) {
    // Utilisateur non identifié (sans candidats)
    sb.textContent = 'Utilisateur non identifié';
    sb.disabled = true;
    sb.className = 'btn ghost';
    sb.onclick = null;
    return;
  }
  
  // Vérifier si la personne affichée est l'utilisateur courant
  const displayedPersonId = S.selectedPersonId || S.visiblePersonIds[0];
  const isViewingOwnSheet = displayedPersonId === currentUserId;
  
  if (!isViewingOwnSheet) {
    // Consultation d'une autre personne : bouton désactivé
    sb.textContent = 'Feuille d\'une autre personne';
    sb.disabled = true;
    sb.className = 'btn ghost';
    sb.onclick = null;
    return;
  }
  
  // Utilisateur consult sa propre feuille
  const st = myStatutForPerson(currentUserId);
  
  // 1.2.2 - Utiliser normalizeSheetStatus pour comparer
  const status = normalizeSheetStatus(st);
  
  if (status === 'valide') { 
    sb.textContent = 'Semaine validee'; 
    sb.disabled = true; 
    sb.className = 'btn ghost'; 
    sb.onclick = null; 
  }
  else if (status === 'soumis') { 
    sb.textContent = 'Retirer la soumission'; 
    sb.disabled = false; 
    sb.className = 'btn ghost'; 
    sb.onclick = () => {
      if (typeof CraWorkflowIntegration !== 'undefined' && CraWorkflowIntegration.withdrawCurrentWeek) {
        CraWorkflowIntegration.withdrawCurrentWeek();
      }
    }; 
  }
  else { 
    sb.textContent = 'Soumettre la semaine' + (status === 'rejete' ? ' (rejetee)' : ''); 
    sb.disabled = false; 
    sb.className = 'btn'; 
    sb.onclick = () => {
      if (typeof CraWorkflowIntegration !== 'undefined' && CraWorkflowIntegration.submitCurrentWeek) {
        CraWorkflowIntegration.submitCurrentWeek();
      }
    }; 
  }
}

function renderSaisie() {
  const main = document.getElementById('main');
  const todayMs = Date.now();
  const weekDaysArr = weekDays();
  
  // Vérifier et mettre à jour le mode correction manager
  if (S.managerCorrectionSheetId) {
    const correctionSheet = S.feuilles.find(f => f.id === S.managerCorrectionSheetId);
    if (!correctionSheet || normalizeSheetStatus(correctionSheet.statut) !== 'correction_manager') {
      // La feuille n'est plus en correction_manager, quitter le mode
      S.managerCorrectionSheetId = null;
    }
  }
  
  // MODE CORRECTION PRIORITAIRE : afficher même si visiblePersonIds est vide
  let personsToShow = S.visiblePersonIds;
  if (S.managerCorrectionSheetId) {
    const correctionSheet = S.feuilles.find(f => f.id === S.managerCorrectionSheetId);
    if (correctionSheet) {
      // Forcer l'affichage du propriétaire, même s'il est filtré
      personsToShow = [correctionSheet.membre];
    }
  }
  
  // Vérifier si aucune personne à afficher (hors mode correction)
  if (personsToShow.length === 0) {
    if (S.isEmptyDueToFilter) {
      main.innerHTML = '<div class="empty-cta">' +
        '<div style="font-size:1.05rem;font-weight:600;margin-bottom:8px;color:var(--text)">Aucune personne ne correspond aux filtres sélectionnés</div>' +
        '<div style="margin-top:16px"><button class="btn ghost" onclick="S.filterManager.clearAll()">Effacer les filtres</button></div>' +
        '</div>';
    } else {
      main.innerHTML = '<div class="empty-cta">Aucune personne dans l\'équipe</div>';
    }
    return;
  }
  
  let html = '';
  
  // Bandeau mode correction manager
  if (S.managerCorrectionSheetId) {
    const correctionSheet = S.feuilles.find(f => f.id === S.managerCorrectionSheetId);
    if (correctionSheet) {
      const owner = S.team.find(t => t.id === correctionSheet.membre);
      const ownerName = owner ? owner.nom : '?';
      html += '<div class="manager-correction-banner" style="background:color-mix(in srgb, #3b82f6 15%, var(--card-bg));border:2px solid #3b82f6;border-radius:8px;padding:12px 16px;margin-bottom:16px;">' +
        '<div style="font-size:.95rem;font-weight:700;color:#3b82f6;margin-bottom:4px">Correction manager — vous modifiez les heures de ' + esc(ownerName) + '</div>' +
        '<div style="font-size:.8rem;color:var(--text-muted)">Semaine du ' + new Date(correctionSheet.semaine * 1000).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' }) + '</div>' +
        (correctionSheet.motifCorrection ? '<div style="font-size:.8rem;color:var(--text-muted);margin-top:6px;font-style:italic">Motif : ' + esc(correctionSheet.motifCorrection) + '</div>' : '') +
        '<div style="margin-top:8px"><button class="btn ghost" onclick="leaveManagerCorrection()" style="font-size:.75rem;padding:4px 8px">Quitter le mode correction</button></div>' +
        '</div>';
    }
  }
  
  // Une section par personne
  for (const personId of personsToShow) {
    const person = S.team.find(t => t.id === personId);
    if (!person) continue;
    
    const indispos = parseIndisposFor(personId);
    const st = myStatutForPerson(personId);
    // 1.2.2 - Utiliser normalizeSheetStatus pour le verrouillage
    const status = normalizeSheetStatus(st);
    const isLocked = ['soumis', 'valide'].includes(status);
    
    // En-tête de section
    html += '<div class="person-section" style="margin-bottom:24px;padding:16px;background:var(--card-bg);border:1px solid var(--border);border-radius:8px;page-break-inside:avoid">'
      + '<h2 style="margin:0 0 12px 0;font-size:1.1rem;color:var(--primary);border-bottom:2px solid var(--primary);padding-bottom:8px">' + esc(person.nom) + '</h2>'
      + '<div style="font-size:.8rem;color:var(--text-muted);margin-bottom:12px">Capacité: ' + (person.capaciteHebdo || 35) + 'h/semaine';
    
    if (st !== 'brouillon') {
      html += ' | Statut: <span class="fbadge ' + st + '">' + st + '</span>';
    }
    html += '</div>';
    
    // Grille pour cette personne
    html += '<table class="grid" style="table-layout:fixed;width:100%"><thead><tr><th class="left" style="width:25%;min-width:120px">Tâche / Projet</th>';
    weekDaysArr.forEach((d, i) => {
      const dt = new Date(d);
      const cap = dayCapacityForPerson(d, personId);
      const ind = isIndispo(d, indispos);
      let thClass = 'day' + (sameDay(d, todayMs) ? ' today' : '');
      if (ind.isIndispo && (!ind.dispo || ind.dispo === 0)) thClass += ' indispo';
      html += '<th class="' + thClass + '" style="width:15%">' + JOURS[i] + '<br><small>' + dt.getDate() + '/' + (dt.getMonth() + 1) + '</small></th>';
    });
    html += '<th class="total" style="width:10%;text-align:right">Total</th></tr></thead><tbody>';
    
    const tasks = gridTasksForPerson(personId);
    if (!tasks.length) {
      html += '<tr><td class="tcell" colspan="' + (weekDaysArr.length + 2) + '" style="color:var(--text-muted)">Aucune tâche pour cette personne</td></tr>';
    } else {
      for (const t of tasks) {
        html += '<tr><td class="tcell"><div class="tt" style="font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(t.titre) + '</div><div class="tp" style="font-size:.75rem;color:var(--text-muted)">' + esc(projName(t)) + '</div></td>';
        weekDaysArr.forEach((d) => {
          // PHASE 5 : Utiliser l'état de cellule complet
          const cellState = getCellDisplayState(t.id, d, personId);
          const displayedH = cellState.displayedHours;
          const plannedH = cellState.plannedHours;
          const cap = dayCapacityForPerson(d, personId);
          const ind = isIndispo(d, indispos);
          const isDayIndispo = ind.isIndispo && (!ind.dispo || ind.dispo === 0);
          
          let tdClass = 'day';
          if (cellState.hasDisplayValue) tdClass += ' filled';
          if (cellState.isPrefilled) tdClass += ' prefilled';
          if (sameDay(d, todayMs)) tdClass += ' today';
          if (isDayIndispo) tdClass += ' indispo-cell';
          
          let cellHtml = '<td class="' + tdClass + '">';
          if (isDayIndispo) {
            cellHtml += '<div style="height:38px;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text-muted);font-size:.75rem">' 
              + (ind.label || 'Indispo') + '</div>';
          } else {
            // PHASE 5 : Utiliser displayedHours et fmtInputQty
            cellHtml += '<input type="number" min="0" step="0.5" value="' + fmtInputQty(displayedH, cellState.hasDisplayValue) + '"' 
              + (isLocked ? ' disabled' : '')
              + ' onchange="setCell(' + t.id + ',' + d + ',' + personId + ',this.value)" style="width:100%;font-size:.85rem">';
            if (plannedH > 0 && !cellState.hasExplicitActual) {
              cellHtml += '<div class="planned-indicator">Prévu: <strong>' + fmtQty(plannedH) + '</strong></div>';
  }
}

          cellHtml += '</td>';
          html += cellHtml;
        });
        // PHASE 5 : Utiliser les totaux affichés (propositions incluses)
        const totalDisplayed = taskWeekDisplayedHours(t.id, personId);
        const totalPlanned = taskWeekPlannedHours(t.id, personId);
        html += '<td class="total" style="text-align:right;font-weight:700;padding-right:12px">' + (fmtQty(totalDisplayed) || '0')
          + (totalPlanned > 0 ? '<br><small style="color:var(--text-muted);font-weight:400">/ ' + fmtQty(totalPlanned) + ' prevu</small>' : '')
          + '</td></tr>';
      }
    }
    
    // Pied de tableau avec totaux
    html += '</tbody><tfoot><tr><td class="left" style="text-align:right;font-weight:600;padding:8px">Total (declare ou propose / prevu)</td>';
    weekDaysArr.forEach((d) => {
      // PHASE 5 : Utiliser les heures affichées (propositions incluses)
      const displayed = dayDisplayedHours(d, personId);
      const planned = dayPlannedHours(d, personId);
      const cap = dayCapacityForPerson(d, personId);
      html += '<td style="text-align:center;font-weight:600;padding:8px">' + (fmtQty(displayed) || '0')
        + (planned > 0 ? '<br><small style="color:var(--text-muted);font-size:.7rem;font-weight:400">' + fmtQty(planned) + ' prevu</small>' : '')
        + '<br><small style="color:var(--text-muted);font-size:.75rem">Cap: ' + cap.toFixed(1) + 'h</small>'
        + '</td>';
    });
    const weekCap = weekDaysArr.reduce((s,d) => s + dayCapacityForPerson(d, personId), 0);
    // PHASE 5 : Utiliser les totaux affichés
    const weekDisplayed = weekDisplayedHours(personId);
    const weekPl = weekPlannedHours(personId);
    html += '<td class="total" style="text-align:center;font-weight:700;padding:8px">' + (fmtQty(weekDisplayed) || '0')
      + (weekPl > 0 ? '<br><small style="color:var(--text-muted);font-weight:400">/ ' + fmtQty(weekPl) + ' prevu</small>' : '')
      + '<br><small style="color:var(--text-muted);font-size:.75rem">Cap: ' + weekCap.toFixed(1) + 'h</small>'
      + '</td></tr></tfoot></table>';
    
    html += '</div>';  // Fin person-section
  }
  
  main.innerHTML = html;
}

function renderValider() {
  const main = document.getElementById('main');
  
  // Utiliser l'état manager calculé
  const managerState = S.managerWorkspaceState || {
    accessibleSheets: [],
    pendingCount: 0,
    validatedCount: 0,
    correctionCount: 0,
    directReportIds: [],
    directReportCount: 0
  };
  
  // Si aucune feuille accessible, afficher un état vide informatif
  if (!managerState.accessibleSheets || managerState.accessibleSheets.length === 0) {
    let message = '<div class="empty-cta">';
    
    if (managerState.managesSomeone && managerState.directReportCount > 0) {
      // Cas A : Il gère des personnes mais aucune feuille soumise
      const reportNames = S.team
        .filter(m => managerState.directReportIds.includes(m.id))
        .slice(0, 5)
        .map(m => m.nom)
        .join(', ');
      
      const countText = managerState.directReportCount > 5
        ? managerState.directReportCount + ' personnes'
        : reportNames;
      
      message += '<h3>Aucune feuille à valider</h3>';
      message += '<p>Vous êtes responsable de : <strong>' + countText + '</strong></p>';
      message += '<p>Aucune feuille ne vous a encore été soumise.</p>';
      message += '<p class="csub">Les feuilles apparaîtront ici après leur soumission.</p>';
    } else {
      // Cas B : Pas de subordonnés et pas de feuilles
      message += '<h3>Aucune feuille en attente</h3>';
      message += '<p>Vous n\'avez actuellement aucune feuille soumise à traiter.</p>';
      message += '<p class="csub">Les feuilles validées et les corrections restent disponibles ci-dessous si elles existent.</p>';
    }
    
    message += '</div>';
    main.innerHTML = message;
    return;
  }
  
  // Trier les feuilles accessibles
  const subs = managerState.accessibleSheets.sort((a, b) => {
    const statusA = normalizeSheetStatus(a.statut);
    const statusB = normalizeSheetStatus(b.statut);
    // Priorité : soumis > correction_manager > valide
    const priority = { 'soumis': 0, 'submitted': 0, 'correction_manager': 1, 'valide': 2, 'validated': 2 };
    return (priority[statusA] || 99) - (priority[statusB] || 99);
  });
  
  let html = '<table class="grid"><thead><tr><th class="left">Agent</th><th class="left">Semaine</th><th class="total">Total</th><th class="left">Statut</th><th class="left">Action</th></tr></thead><tbody>';
  for (const f of subs) {
    const p = S.team.find(t => t.id === f.membre), wk = gristToMs(f.semaine);
    const status = normalizeSheetStatus(f.statut);
    
    // Actions selon le statut
    let act = '';
    if (status === 'soumis' || status === 'submitted') {
      act = '<button class="btn" onclick="validerFeuille(' + f.id + ')">Valider</button> <button class="btn ghost" onclick="rejeterFeuille(' + f.id + ')">Rejeter</button>';
    } else if (status === 'valide' || status === 'validated') {
      act = '<button class="btn ghost" onclick="CraWorkflowIntegration.openCorrection(' + f.id + ')">Ouvrir une correction</button>';
    } else if (status === 'correction_manager') {
      // En mode correction_manager : bouton pour entrer dans le mode édition
      act = '<button class="btn" onclick="enterManagerCorrection(' + f.id + ')">Corriger les heures</button> <button class="btn" onclick="revalidateSheet(' + f.id + ')">Revalider</button>';
    }
    
    html += '<tr><td class="tcell">' + esc(p ? p.nom : '?') + '</td>'
      + '<td class="tcell">' + new Date(wk).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }) + '</td>'
      + '<td class="total">' + (fmtQty(weekTotalFor(f.membre, wk)) || '0') + '</td>'
      + '<td class="tcell"><span class="fbadge ' + status + '">' + status + '</span>' + (f.motifCorrection ? '<br><small style="color:var(--text-muted);font-style:italic">' + esc(f.motifCorrection.substring(0, 50)) + '...</small>' : '') + '</td>'
      + '<td class="tcell">' + act + '</td></tr>';
  }
  html += '</tbody></table>';
  main.innerHTML = html;
}

  const s = new Date(S.weekStart), e = new Date(S.weekStart + 6 * DAY);
  const f = (x) => x.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
  return 'Semaine du ' + f(s) + ' au ' + f(e);

/**
 * Crée un adaptateur Grist minimal pour le mode démo (S.alone)
 * Simule applyUserActions sans appeler l'API Grist réelle
 */
function createDemoGristAdapter() {
  return {
    docApi: {
      applyUserActions: function(actions) {
        const retValues = [];
        for (const action of actions) {
          const [type, tableName, recordId, data] = action;
          
          if (type === 'AddRecord' && tableName === 'TimeEntries') {
            // Générer un ID déterministe
            const maxId = S.entries.length > 0 ? Math.max.apply(null, S.entries.map(function(e) { return e.id; })) : 0;
            const newId = maxId + 1;
            retValues.push(newId);
          } else if (type === 'UpdateRecord' && tableName === 'TimeEntries') {
            retValues.push(null);
          } else if (type === 'RemoveRecord' && tableName === 'TimeEntries') {
            retValues.push(null);
          } else {
            // Tables non supportées en mode démo
            throw new Error('Table non supportée en mode démo: ' + tableName);
          }
        }
        return Promise.resolve({ retValues: retValues });
      }
    }
  };
}

async function setCell(taskId, dayMs, personId, qtyStr) {
  // ROUTAGE MODE CORRECTION MANAGER
  if (S.managerCorrectionSheetId) {
    const correctionSheet = S.feuilles.find(f => f.id === S.managerCorrectionSheetId);
    if (correctionSheet && normalizeSheetStatus(correctionSheet.statut) === 'correction_manager') {
      const dayIso = CRAController.localDayKeyFromMs(dayMs);
      const existingEntry = S.entries.find(e => 
        e.membre === personId && 
        e.tache === taskId && 
        CRAController.gristDateKey(e.date) === dayIso &&
        e.feuille === S.managerCorrectionSheetId
      );
      
      if (!existingEntry) {
        toast('Mode correction : seules les entrées existantes peuvent être modifiées');
        render();
        return;
      }
      
      const parseResult = parseManagerHoursInput(qtyStr);
      if (!parseResult.valid) {
        toast(parseResult.error || 'Valeur invalide');
        render();
        return;
      }
      
      if (typeof CraWorkflowIntegration !== 'undefined' && CraWorkflowIntegration.updateManagerActual) {
        await CraWorkflowIntegration.updateManagerActual(S.managerCorrectionSheetId, existingEntry.id, parseResult.hours);
      } else {
        toast('Adaptateur non initialisé');
      }
      return;
    } else {
      S.managerCorrectionSheetId = null;
    }
  }
  
  const hours = qtyToHours(qtyStr);
  
  const weekLock = CRAController.isPersonWeekLocked(
    personId,
    CRAController.localDayKeyFromMs(S.weekStart),
    S.feuilles
  );
  
  if (!S.managerCorrectionSheetId && personId !== S.currentUserMemberId) {
    toast('Vous ne pouvez modifier que votre propre feuille');
    render();
    return;
  }
  
  if (weekLock.locked) {
    toast('Semaine verrouillée - saisie impossible');
    render();
    return;
  }
  
  // PRÉPARER LES DÉPENDANCES POUR LE CONTRÔLEUR
  const dayIso = CRAController.localDayKeyFromMs(dayMs);
  
  // Utiliser l'adaptateur démo si S.alone est vrai
  const effectiveGrist = S.alone ? createDemoGristAdapter() : grist;
  
  // APPELER LA FONCTION TESTABLE DU CONTRÔLEUR
  // C'est le vrai parcours de sauvegarde du CRA
  const result = await CRAController.saveCraCellChange({
    taskId: taskId,
    personId: personId,
    dateIso: dayIso,
    hours: hours,
    allowWeekends: false
  }, {
    tasks: S.tasks,
    projects: S.projects,
    assignments: S.assignments,
    entries: S.entries,
    sheets: S.feuilles,
    dailyCapacities: S.dailyCapacities || [],
    team: S.team || [],
    grist: effectiveGrist
  });
  
  // TRAITER LE RÉSULTAT
  if (!result.ok) {
    if (result.code === 'INVALID_DISTRIBUTION_MODE') {
      toast('Type de planification invalide sur l\'affectation');
    } else if (result.code === 'AMBIGUOUS_ACTIVE_ASSIGNMENT') {
      toast('Erreur : plusieurs affectations actives pour cette tâche');
    } else if (result.code === 'MISSING_ACTIVE_ASSIGNMENT') {
      toast('Aucune affectation autorisée pour cette date');
    } else if (result.code === 'DUPLICATE_TIME_ENTRY') {
      toast('Erreur : plusieurs entrées pour cette cellule');
    } else if (result.code === 'MISSING_WEEKLY_SHEET') {
      toast('Erreur : feuille introuvable pour cette semaine');
    } else if (result.code === 'INVALID_ENTRY_DATE') {
      toast('Date de saisie invalide');
    } else if (result.code === 'DUPLICATE_WEEKLY_SHEET') {
      toast('Plusieurs feuilles existent pour cette personne et cette semaine');
    } else if (result.code === 'GRIST_API_UNAVAILABLE') {
      toast('API Grist indisponible');
    } else if (result.code === 'TIME_ENTRY_WRITE_FAILED') {
      toast('Écriture de la saisie impossible');
    } else if (result.code === 'TIME_ENTRY_ID_NOT_RETURNED') {
      toast('La saisie a été envoyée mais son identifiant n\'a pas été retourné');
    } else {
      toast('Action bloquée : ' + (result.code || 'erreur inconnue'));
    }
    render();
    return;
  }
  
  // METTRE À JOUR L'ÉTAT LOCAL APRÈS SUCCÈS
  if (S.alone) {
    // Mode démo : mise à jour locale seulement
    if (result.action === 'update') {
      const entry = S.entries.find(e => e.id === result.entryId);
      if (!entry) {
        toast('Entrée enregistrée mais cache local incohérent');
        render();
        return;
      }
      Object.assign(entry, result.fields);
    } else if (result.action === 'create') {
      if (result.entryId === null || result.entryId === undefined) {
        toast('Entrée créée mais ID non retourné');
        render();
        return;
      }
      S.entries.push({ id: result.entryId, ...result.fields });
    } else if (result.action === 'delete') {
      S.entries = S.entries.filter(e => e.id !== result.entryId);
    }
    buildCraIndexes();
    render();
    return;
  }
  
  // EN MODE GRIST : LA SAUVEGARDE A DÉJÀ ÉTÉ FAITE PAR saveCraCellChange
  // Mettre à jour localement pour affichage immédiat
  if (result.action === 'update') {
    const entry = S.entries.find(e => e.id === result.entryId);
    if (!entry) {
      toast('Entrée enregistrée mais cache local incohérent');
      render();
      return;
    }
    Object.assign(entry, result.fields);
  } else if (result.action === 'create') {
    if (result.entryId === null || result.entryId === undefined) {
      toast('Entrée créée mais ID non retourné');
      render();
      return;
    }
    S.entries.push({ id: result.entryId, ...result.fields });
  } else if (result.action === 'delete') {
    S.entries = S.entries.filter(e => e.id !== result.entryId);
  }
  
  // PHASE 1.1.6 : SUPPRESSION écriture Tasks.tempsPasse
  // Cette écriture sort du contrat du CRA et sera gérée par une formule Grist ou un service dédié
  
  // Reconstruire les index après modification locale
  buildCraIndexes();
  render();
}

function craExportLocalIsoFromMs(ms) {
  const date = new Date(ms);
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  return year + '-' + month + '-' + day;
}

function formatCraExportSummaryMinutes(value) {
  const minutes = Math.max(0, Math.round(Number(value) || 0));
  const hours = Math.floor(minutes / 60);
  const remainder = minutes % 60;
  return remainder ? hours + 'h' + String(remainder).padStart(2, '0') : hours + 'h';
}

function getCraExportDefaultWeekStart() {
  const displayedWeekStart = Number(S.weekStart);
  
  if (
    Number.isFinite(displayedWeekStart) &&
    displayedWeekStart > 0
  ) {
    return mondayOf(displayedWeekStart);
  }
  
  return mondayOf(Date.now());
}

function getCraExportDependencies() {
  const model = globalThis.CraExportModel;
  const pdf = globalThis.CraExportPdf;
  const csv = globalThis.CraExportCsv;
  
  if (!model) {
    throw new Error('Module CraExportModel non chargé.');
  }
  
  if (!pdf) {
    throw new Error('Module CraExportPdf non chargé.');
  }
  
  if (!csv) {
    throw new Error('Module CraExportCsv non chargé.');
  }
  
  return {
    model: model,
    pdf: pdf,
    csv: csv
  };
}

function getCraExportOrchestrator() {
  const orchestrator = globalThis.CraExportOrchestrator;
  
  if (!orchestrator) {
    throw new Error('Module CraExportOrchestrator non chargé.');
  }
  
  return orchestrator;
}

async function ensureCraPdfMakeLoaded() {
  if (globalThis.pdfMake && typeof globalThis.pdfMake.createPdf === 'function') {
    return globalThis.pdfMake;
  }
  
  if (craPdfMakeLoadingPromise) {
    return craPdfMakeLoadingPromise;
  }
  
  craPdfMakeLoadingPromise = (async () => {
    try {
      let script = document.querySelector('script[src*="pdfmake.min.js"]');
      
      if (!script) {
        script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js';
        document.head.appendChild(script);
      }
      
      await new Promise((resolve, reject) => {
        if (script.readyState === 'loaded' || script.readyState === 'complete') {
          resolve();
        } else {
          script.onload = resolve;
          script.onerror = () => reject(new Error('Chargement pdfmake échoué'));
        }
      });
      
      let vfsScript = document.querySelector('script[src*="vfs_fonts.js"]');
      if (!vfsScript) {
        vfsScript = document.createElement('script');
        vfsScript.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.min.js';
        document.head.appendChild(vfsScript);
        
        await new Promise((resolve, reject) => {
          if (vfsScript.readyState === 'loaded' || vfsScript.readyState === 'complete') {
            resolve();
          } else {
            vfsScript.onload = resolve;
            vfsScript.onerror = () => reject(new Error('Chargement vfs_fonts échoué'));
          }
        });
      }
      
      if (globalThis.pdfMake && typeof globalThis.pdfMake.createPdf === 'function') {
        return globalThis.pdfMake;
      }
      
      throw new Error('pdfmake.createPdf indisponible après chargement');
    } catch (e) {
      craPdfMakeLoadingPromise = null;
      throw e;
    }
  })();
  
  return craPdfMakeLoadingPromise;
}

function renderCraExportFormatOptions() {
  const container = document.getElementById('craExportFormats');
  const orchestrator = getCraExportOrchestrator();
  const formatOptions = orchestrator.getFormatOptions();
  
  container.innerHTML = '';
  
  formatOptions.forEach((opt, index) => {
    const div = document.createElement('div');
    div.className = 'cra-export-format' + (index === 0 ? ' selected' : '');
    div.dataset.format = opt.id;
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = 'craExportFormat';
    radio.id = 'craExportFormat' + opt.id;
    radio.value = opt.id;
    radio.checked = index === 0;
    
    const label = document.createElement('label');
    label.htmlFor = 'craExportFormat' + opt.id;
    
    const title = document.createElement('span');
    title.className = 'cra-export-format-title';
    title.textContent = opt.label;
    
    const desc = document.createElement('span');
    desc.className = 'cra-export-format-desc';
    desc.textContent = opt.description;
    
    label.appendChild(title);
    label.appendChild(desc);
    div.appendChild(radio);
    div.appendChild(label);
    container.appendChild(div);
  });
}

function updateCraExportPreview() {
  const startInput = document.getElementById('craExportStartDate');
  const endInput = document.getElementById('craExportEndDate');
  const summary = document.getElementById('craExportSummary');
  const downloadBtn = document.getElementById('craExportDownloadBtn');
  const errorEl = document.getElementById('craExportError');
  
  if (!craExportUi.format || !startInput.value || !endInput.value) {
    summary.style.display = 'none';
    downloadBtn.disabled = true;
    return;
  }
  
  try {
    const request = buildCraExportRequest();
    const orchestrator = getCraExportOrchestrator();
    const prepared = orchestrator.prepareExport(request, getCraExportDependencies());
    
    craExportUi.prepared = prepared;
    
    document.getElementById('craExportSummaryPeriod').textContent = 
      prepared.summary.startDateIso + ' → ' + prepared.summary.endDateIso;
    document.getElementById('craExportSummarySelected').textContent = 
      prepared.summary.selectedPersonCount;
    document.getElementById('craExportSummaryExported').textContent = 
      prepared.summary.exportedPersonCount;
    document.getElementById('craExportSummaryRows').textContent = 
      prepared.summary.rowCount;
    document.getElementById('craExportSummaryTotal').textContent = 
      formatCraExportSummaryMinutes(prepared.summary.totalMinutes);
    document.getElementById('craExportSummaryFilename').textContent = 
      prepared.filename;
    
    summary.style.display = 'block';
    downloadBtn.disabled = false;
    errorEl.textContent = '';
    errorEl.hidden = true;
  } catch (e) {
    console.warn('Export preview error:', e);
    summary.style.display = 'none';
    downloadBtn.disabled = true;
    errorEl.textContent = 'Aperçu indisponible : ' + (e.message || e);
    errorEl.hidden = false;
  }
}

function buildCraExportRequest() {
  const personIds = Array.isArray(S.visiblePersonIds)
    ? S.visiblePersonIds.slice()
    : [];
  
  const filters = CraFilterAdapter.normalizeCraFilters(S.filters || {});
  
  const data = {
    entries: Array.isArray(S.entries) ? S.entries.slice() : [],
    team: Array.isArray(S.team) ? S.team.slice() : [],
    tasks: Array.isArray(S.tasks) ? S.tasks.slice() : [],
    projects: Array.isArray(S.projects) ? S.projects.slice() : [],
    programmes: Array.isArray(S.programmes) ? S.programmes.slice() : []
  };
  
  return {
    format: craExportUi.format,
    startDateIso: document.getElementById('craExportStartDate').value,
    endDateIso: document.getElementById('craExportEndDate').value,
    personIds: personIds,
    filters: filters,
    data: data
  };
}

async function handleCraExportDownload() {
  if (craExportUi.busy || !craExportUi.prepared) {
    return;
  }
  
  craExportUi.busy = true;
  
  const downloadBtn = document.getElementById('craExportDownloadBtn');
  const startInput = document.getElementById('craExportStartDate');
  const endInput = document.getElementById('craExportEndDate');
  const formatRadios = document.querySelectorAll('input[name="craExportFormat"]');
  const errorEl = document.getElementById('craExportError');
  
  let result;
  
  downloadBtn.disabled = true;
  downloadBtn.textContent = 'Préparation...';
  startInput.disabled = true;
  endInput.disabled = true;
  formatRadios.forEach(radio => {
    radio.disabled = true;
  });
  
  errorEl.textContent = '';
  errorEl.hidden = true;
  
  try {
    const request = buildCraExportRequest();
    
    if (craExportUi.format === 'pdf') {
      const pdfMake = await ensureCraPdfMakeLoaded();
      request.pdfOptions = { pdfMake: pdfMake };
    } else {
      request.csvOptions = { includeBom: true };
    }
    
    const orchestrator = getCraExportOrchestrator();
    result = orchestrator.download(request, getCraExportDependencies());
  } catch (error) {
    console.error('Export error:', error);
    
    errorEl.textContent = 'Erreur export : ' + (error.message || error);
    errorEl.hidden = false;
    return;
  } finally {
    craExportUi.busy = false;
    downloadBtn.disabled = false;
    downloadBtn.textContent = 'Télécharger';
    startInput.disabled = false;
    endInput.disabled = false;
    formatRadios.forEach(radio => {
      radio.disabled = false;
    });
  }
  
  toast('Téléchargement lancé : ' + result.filename);
  closeCraExportModal();
}

function openCraExportModal() {
  if (craExportUi.open || craExportUi.busy) {
    return;
  }
  
  if (!S.hasTable) {
    toast('Feuille de temps non activée');
    return;
  }
  
  if (!Array.isArray(S.visiblePersonIds)) {
    toast('Personnes indisponibles');
    return;
  }
  
  if (S.visiblePersonIds.length === 0) {
    toast('Aucune personne à exporter');
    return;
  }
  
  try {
    getCraExportOrchestrator();
    getCraExportDependencies();
  } catch (e) {
    toast('Export indisponible : ' + (e.message || e));
    return;
  }
  
  const overlay = document.getElementById('craExportOverlay');
  const startInput = document.getElementById('craExportStartDate');
  const endInput = document.getElementById('craExportEndDate');
  const summary = document.getElementById('craExportSummary');
  const downloadBtn = document.getElementById('craExportDownloadBtn');
  const errorEl = document.getElementById('craExportError');
  
  craExportUi.lastFocusedElement = document.activeElement;
  craExportUi.format = 'pdf';
  craExportUi.prepared = null;
  craExportUi.open = true;
  
  renderCraExportFormatOptions();
  
  const defaultWeekStart = getCraExportDefaultWeekStart();
  startInput.value = craExportLocalIsoFromMs(defaultWeekStart);
  endInput.value = craExportLocalIsoFromMs(defaultWeekStart + 6 * DAY);
  
  summary.style.display = 'none';
  downloadBtn.disabled = true;
  errorEl.textContent = '';
  errorEl.hidden = true;
  
  overlay.setAttribute('aria-hidden', 'false');
  overlay.classList.add('open');
  
  const filterPanel = document.getElementById('filterPanel');
  if (filterPanel && filterPanel.style.display === 'block') {
    filterPanel.style.display = 'none';
  }
  
  const firstRadio = document.querySelector('input[name="craExportFormat"]');
  if (firstRadio) {
    firstRadio.focus();
  }
  
  updateCraExportPreview();
}

function closeCraExportModal() {
  if (craExportUi.busy) {
    return;
  }
  
  const overlay = document.getElementById('craExportOverlay');
  
  overlay.setAttribute('aria-hidden', 'true');
  overlay.classList.remove('open');
  
  craExportUi.open = false;
  
  if (craExportUi.lastFocusedElement) {
    craExportUi.lastFocusedElement.focus();
    craExportUi.lastFocusedElement = null;
  }
}

/**
 * 1.2.2 - Normalise un statut de feuille (supporte français et anglais)
 * @param {string} status - Statut brut (soumis/submitted, valide/validated, etc.)
 * @returns {string} Statut normalisé (brouillon/soumis/valide/rejete)
 */
function normalizeSheetStatus(status) {
  const value = String(status || '').trim().toLowerCase();
  
  // Aliases anglais -> français
  const aliases = {
    'draft': 'brouillon',
    'submitted': 'soumis',
    'validated': 'valide',
    'rejected': 'rejete'
  };
  
  return aliases[value] || value || 'brouillon';
}

function myStatutForPerson(personId) { 
  const f = S.feuilles.find(x => x.membre === personId && sameDay(gristToMs(x.semaine), S.weekStart)); 
  return f ? normalizeSheetStatus(f.statut) : 'brouillon'; 
}

// 1.2.1 - Utiliser selectedPersonId au lieu de S.me pour l'affichage
function myStatut() { return myStatutForPerson(S.selectedPersonId); }

function isLocked() { return ['soumis', 'valide'].includes(myStatut()); }
function weekTotalFor(membre, wkMs) { let h = 0; for (let i = 0; i < 7; i++) { const d = wkMs + i * DAY; for (const e of S.entries) if (e.membre === membre && sameDay(gristToMs(e.date), d)) h += Number(e.heures) || 0; } return h; }

/**
 * Extrait l'ID d'un enregistrement créé par applyUserActions
 * @param {*} actionResult - Résultat de AddRecord
 * @param {string} label - Label pour le message d'erreur
 * @returns {number} ID de l'enregistrement
 */
function getAddedRecordId(actionResult, label) {
  let value = actionResult;

  if (
    value &&
    Array.isArray(value.retValues) &&
    value.retValues.length
  ) {
    value = value.retValues[0];
  } else if (Array.isArray(value)) {
    value = value[0];
  }

  if (typeof value === 'number' && Number.isFinite(value)) {
    return value;
  }

  if (
    value &&
    typeof value === 'object' &&
    typeof value.id === 'number'
  ) {
    return value.id;
  }

  throw new Error(
    'ID de ligne introuvable après AddRecord' +
    (label ? ' (' + label + ')' : '') +
    ': ' + JSON.stringify(actionResult)
  );
}

// ---- Export Excel (CSV + BOM, comme le Plan) ------------------------------
function exportCSV() {
  const nameOf = (id) => { const p = S.team.find(t => t.id === id); return p ? p.nom : id; };
  const taskOf = (id) => { const t = S.tasks.find(x => x.id === id); return t ? t.titre : id; };
  const projOf = (id) => { const t = S.tasks.find(x => x.id === id); if (!t) return ''; const p = S.projects.find(x => x.id === t.projet); return p ? p.nom : ''; };
  const statutOf = (membre, dateSec) => { const wk = mondayOf(dateSec * 1000); const f = S.feuilles.find(x => x.membre === membre && sameDay(gristToMs(x.semaine), wk)); return f ? f.statut : 'brouillon'; };
  const fmtDate = (sec) => { const d = new Date(sec * 1000); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const rows = [['Agent', 'Date', 'Projet/Imputation', 'Tache', 'Heures realisees', 'Heures prevues', 'Ecart', 'Statut feuille']];
  S.entries.slice().sort((a, b) => a.date - b.date).forEach(e => {
    const realized = Number(e.heures) || 0;
    const planned = effectiveCraPlannedHours(e);
    const gap = realized - planned;
    rows.push([
      nameOf(e.membre), 
      fmtDate(e.date), 
      projOf(e.tache), 
      taskOf(e.tache), 
      String(realized),
      String(planned),
      String(gap),
      statutOf(e.membre, e.date)
    ]);
  });
  const csv = rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(';')).join('\r\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'feuilles-de-temps.csv'; a.click();
}

// chaine_chefs d'une personne = chefs de son entite + entites ancetres (Entites.parent), borne anti-cycle.
function chaineChefsOf(entiteId) {
  const byId = {}; for (const e of (S.entites || [])) byId[e.id] = e;
  const chefs = []; const seen = new Set(); let e = byId[entiteId];
  while (e && !seen.has(e.id)) { seen.add(e.id); if (e.chef) chefs.push(e.chef); e = e.parent ? byId[e.parent] : null; }
  return chefs;
}
// agents_geres de "me" = personnes (hors soi) dont la chaine_chefs contient me. Replique F_GERES de l'annuaire.
function computeMesGeres(me) {
  const out = [];
  for (const a of (S.team || [])) { if (a.id === me) continue; if (chaineChefsOf(a.entite).includes(me)) out.push(a.id); }
  return out;
}

/**
 * Construit les index de données pour le rendu (TODO 10)
 * 
 * PHASE 3 - CORRECTIONS :
 * - Utilise affectation + date comme clé canonique (pas tache + membre + date)
 * - Initialise weekStart s'il est manquant
 * - Reconstruit les index à chaque appel (pas de cache figé)
 */
function buildCraIndexes() {
  // PHASE 3 : Initialiser weekStart s'il est manquant
  if (!S.weekStart) {
    S.weekStart = mondayOf(Date.now());
    console.warn('[CRA] buildCraIndexes: weekStart initialisé par défaut', new Date(S.weekStart).toISOString());
  }
  
  S.indexes = {
    teamById: new Map(),
    taskById: new Map(),
    projectById: new Map(),
    // PHASE 3 : Nouvelle clé : affectation|date (ou tache|date en fallback)
    entriesByAssignmentDate: new Map(),
    entriesByTaskDate: new Map(),  // Fallback pour données legacy
    entriesByPersonWeek: new Map(),  // URGENT 3 : Initialiser (manquait)
    assignmentById: new Map(),
    assignmentsByPersonTask: new Map(),
    dailyCapacityByPersonDate: new Map(),
    feuillesByPersonWeek: new Map()
  };
  
  // Index team
  for (const m of S.team) {
    S.indexes.teamById.set(m.id, m);
  }
  
  // Index tasks
  for (const t of S.tasks) {
    S.indexes.taskById.set(t.id, t);
  }
  
  // Index projects
  for (const p of S.projects) {
    S.indexes.projectById.set(p.id, p);
  }
  
  // PHASE 3 : Index entries par affectation + date (clé canonique)
  const mondayMs = S.weekStart;
  const sundayMs = mondayMs + (6 * 24 * 60 * 60 * 1000);
  
  for (const e of S.entries) {
    const personId = e.membre;
    const entryMs = typeof e.date === 'number' ? e.date * 1000 : 0;
    
    // Index par affectation + date (clé canonique)
    if (e.affectation != null && e.affectation !== 0) {
      const assignmentKey = e.affectation + '|' + e.date;
      if (!S.indexes.entriesByAssignmentDate.has(assignmentKey)) {
        S.indexes.entriesByAssignmentDate.set(assignmentKey, []);
      }
      S.indexes.entriesByAssignmentDate.get(assignmentKey).push(e);
    }
    
    // Index par tache + date (fallback pour données legacy)
    if (e.tache != null && entryMs >= mondayMs && entryMs <= sundayMs) {
      const taskKey = personId + '|' + e.tache + '|' + e.date;
      if (!S.indexes.entriesByTaskDate.has(taskKey)) {
        S.indexes.entriesByTaskDate.set(taskKey, []);
      }
      S.indexes.entriesByTaskDate.get(taskKey).push(e);
    }
    
    // Index daily capacity
    if (e.capaciteJour) {
      const capKey = personId + '|' + e.date;
      S.indexes.dailyCapacityByPersonDate.set(capKey, e.capaciteJour);
    }
  }
  
  // Index feuilles par personne + semaine
  for (const f of S.feuilles) {
    const fWeekMs = typeof f.semaine === 'number' ? f.semaine * 1000 : 0;
    if (fWeekMs >= mondayMs && fWeekMs <= sundayMs + (24 * 60 * 60 * 1000)) {
      const key = f.membre + '|' + f.semaine;
      S.indexes.feuillesByPersonWeek.set(key, f);
    }
  }
  
  // Index assignments par personne + tache
  for (const a of S.assignments) {
    S.indexes.assignmentById.set(Number(a.id), a);
    if (a.actif) {
      const key = a.membre + '|' + a.tache;
      S.indexes.assignmentsByPersonTask.set(key, a);
    }
  }
  
  // PHASE 1.1.7 : Ajouter index entriesByPersonWeek (manquant)
  // Utilisé par les totaux et agrégats hebdomadaires
  for (const e of S.entries) {
    const personId = e.membre;
    const entryMs = typeof e.date === 'number' ? e.date * 1000 : 0;
    
    if (entryMs >= mondayMs && entryMs <= sundayMs) {
      const key = personId + '|' + e.tache;
      if (!S.indexes.entriesByPersonWeek.has(key)) {
        S.indexes.entriesByPersonWeek.set(key, []);
      }
      S.indexes.entriesByPersonWeek.get(key).push(e);
    }
  }
  
  console.info('[CRA]', {
    phase: 'indexes-built',
    entryCount: S.entries.length,
    assignmentCount: S.assignments.length,
    indexSize: {
      entriesByAssignmentDate: S.indexes.entriesByAssignmentDate.size,
      entriesByTaskDate: S.indexes.entriesByTaskDate.size,
      entriesByPersonWeek: S.indexes.entriesByPersonWeek.size,
      feuillesByPersonWeek: S.indexes.feuillesByPersonWeek.size
    }
  });
}

      });
    } else {
      console.warn('[CRA] CraWorkflowIntegration non disponible, utilisation du mode dégradé');
    }
    
    // Configuration du loader (TODO 2)
    CraDataLoader.configure({
      grist: grist,
      bootstrap: typeof TaskFlowBootstrap !== 'undefined' ? TaskFlowBootstrap : null,
      isReadOnly: TF.isReadOnly,
      applySnapshot: function(normalized, metadata) {
        // PHASE 3 : Application atomique avec initialisation défensive
        Object.assign(S, normalized);
        
        // 1.2.1 - SÉPARATION IDENTITÉ : S.me devient selectedPersonId
        // currentUserMemberId reste immuable (ne change jamais avec les filtres)
        // selectedPersonId peut être modifié par les filtres
        if (!S.selectedPersonId && S.currentUserMemberId) {
          S.selectedPersonId = S.currentUserMemberId;
        }
        
        // Pour compatibilité temporaire, S.me pointe vers selectedPersonId
        S.me = S.selectedPersonId;
        S.meName = S.currentUserMemberName || '';
        
        // PHASE 3 : Initialiser la semaine courante SI non définie
        // Ceci garantit que la semaine n'est jamais undefined ou null
        if (!S.weekStart || typeof S.weekStart !== 'number') {
          S.weekStart = mondayOf(Date.now());
          console.info('[CRA]', {
            phase: 'snapshot',
            weekStartInitialized: new Date(S.weekStart).toISOString(),
            reason: 'week-was-missing',
            currentUserMemberId: S.currentUserMemberId,
            selectedPersonId: S.selectedPersonId
          });
        } else {
          console.info('[CRA]', {
            phase: 'snapshot',
            weekStart: new Date(S.weekStart).toISOString(),
            entryCount: S.entries.length,
            currentUserMemberId: S.currentUserMemberId,
            selectedPersonId: S.selectedPersonId
          });
        }
        
        // Calculer "qui je gere" après chaque snapshot
        // Basé sur currentUserMemberId (identité réelle), pas selectedPersonId
        S.mesGeres = S.currentUserMemberId ? computeMesGeres(S.currentUserMemberId) : [];
        
        // PHASE 3 : Reconstruire les index (utilise maintenant affectation+date)
        buildCraIndexes();
        ensureFilterManager();
        updateFilterManagerData();
        render();
      },
      showLoading: function(message) {
        showCraLoading(message);
      },
      showError: function(error) {
        showCraError(error);
      },
      onSchemaUpgrade: function(inspection) {
        showCraLoading('Mise à niveau du document…');
        console.info('[CRA] Réparation du schéma', inspection);
      }
    });
    
    // Enregistrer les listeners une seule fois (TODO 12)
    registerGristListenersOnce();
    
    // Charger avec fast path (TODO 5, 6)
    await CraDataLoader.requestCraReload({
      reason: 'initial',
      immediate: true,
      allowSchemaRecovery: true
    });
    
    craPerfLog('init.complete');
    
  } catch (error) {
    console.error('[CRA] Initialisation Grist impossible', error);
    
    showCraError(error);
    
    // Mode démo uniquement si hors iframe Grist
    if (window.self === window.top) {
      loadDemo();
    }
  }
}

// Démarrage
initGrist();
</script>
</body>
</html>
