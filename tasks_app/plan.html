function cellColor(h, cap) {
  if (!(h > 0)) return 'transparent';
  if (!(cap > 0)) return 'var(--ok)';
  const r = h / cap; return r > 1 ? 'var(--over)' : r > 0.85 ? 'var(--warn)' : 'var(--ok)';
}

// ============================================================================
// Rendu - VERSION CANONIQUE
// ============================================================================
async function render() {
  // Reconstruire l'index si nécessaire (changement de période, filtre, granularité, etc.)
  if (shouldRebuildCanonIndex()) {
    // Si les données n'ont pas changé, on garde canonData
    // Sinon on recharge tout
    if (!canonData) {
      await loadCanonDataForRender();
    } else {
      // Reconstruire juste l'index avec les nouvelles périodes/filtres
      rebuildCanonPlanIndex();
    }
  }
  
  // segments
  renderSeg('segGran', [['week', 'Sem'], ['month', 'Mois']], S.granularity, v => { S.granularity = v; S.offset = 0; render(); });
  renderSeg('segMode', [['prevu', 'Prévu'], ['realise', 'Réalisé'], ['reste', 'Reste'], ['dispo', 'Dispo']], S.mode, v => { S.mode = v; if (v === 'dispo' && S.groupBy !== 'person') { S.groupBy = 'person'; document.getElementById('selGroup').value = 'person'; toast('Vue Dispo : groupement « Personne » (la marge ne se mesure qu\'au global, tous projets confondus)'); } render(); });
  renderSeg('segUnit', [['pct', '%'], ['hours', 'h']], S.unit, v => { S.unit = v; render(); });
  document.getElementById('selGroup').value = S.groupBy;
  document.getElementById('chkDone').checked = S.includeDone;
  document.getElementById('chkDerive').checked = S.derive;
  document.getElementById('chkWorkdays').checked = S.workdays;
  document.getElementById('navToday').style.display = S.offset !== 0 ? '' : 'none';

  const periods = TF.periodRange(TF.shiftPeriods(new Date(), S.granularity, S.offset), S.granularity, S.horizon);
  const nowKey = TF.periodKey(new Date(), S.granularity);
  document.getElementById('navRange').textContent = plabel(periods[0]) + ' → ' + plabel(periods[periods.length - 1]);

  // Les tâches continues proviennent des TimeEntries matérialisées sur toute
  // leur durée. Seules les tâches ponctuelles ajoutent une projection virtuelle.
  const canonMatrix = canonPlanIndex
    ? PlanCanonAdapter.formatCanonMatrixForRender(canonPlanIndex.byMemberPeriod, S.groupBy, S.mode, canonData)
    : {};
  const rollingMatrix = rollingLoadIndex && canonData
    ? PlanCanonAdapter.formatRollingMatrixForRender(rollingLoadIndex, S.groupBy, canonData)
    : {};
  const matrix = PlanCanonAdapter.mergeCanonAndRollingMatrices(
    canonMatrix,
    rollingMatrix,
    S.mode
  );
  
  const rows = buildRows();
  const wrap = document.getElementById('gridwrap');

  if (!S.team.length) { wrap.innerHTML = '<div class="empty"><div class="ic">▦</div><div>Aucun membre dans la table Team</div></div>'; renderAlerts(matrix, []); return; }
  const hasData = Object.keys(matrix).length > 0;
  if (!hasData) { wrap.innerHTML = '<div class="empty"><div class="ic">▦</div><div>Aucune charge datée à planifier</div><div style="font-size:.78rem">Renseignez la charge par personne + des dates sur les tâches.</div></div>'; renderAlerts(matrix, periods); return; }

  const starts = periodStarts(TF.shiftPeriods(new Date(), S.granularity, S.offset), S.granularity, S.horizon);
  let h = '<table class="grid"><thead><tr><th class="colres">Ressource</th>';
  periods.forEach((p, i) => { h += '<th class="' + (p === nowKey ? 'now' : '') + '"><div class="pk">' + plabel(p) + (p === nowKey ? ' •' : '') + '</div><div class="psub">' + subLabel(starts[i]) + '</div></th>'; });
  h += '<th class="sum">Σ fenêtre</th></tr></thead><tbody>';
  const canEditRes = S.groupBy === 'person';
  for (const row of rows) {
    if (row.isHeader) {
      // En-tête de groupe (projet/rôle) : somme des sous-lignes, sans heat (repère de section).
      const hc = {}; for (const gk of row.gkeys) { const mc = matrix[gk] || {}; for (const p in mc) hc[p] = (hc[p] || 0) + mc[p]; }
      let wtot = 0;
      h += '<tr class="grp"><td class="colres ghead"><div class="res"><span class="gdot" style="background:' + row.color + '"></span><span class="nm">' + esc(row.label) + '</span></div></td>';
      for (let pi = 0; pi < periods.length; pi++) { const p = periods[pi], hr = Number(hc[p]) || 0; wtot += hr; h += '<td class="' + (p === nowKey ? 'nowcol' : '') + '">' + (hr > 0 ? '<span class="gval">' + hoursText(hr) + '</span>' : '<span class="dot">·</span>') + '</td>'; }
      h += '<td class="sum"><div class="sh">' + hoursText(wtot) + ' h</div></td></tr>';
      continue;
    }
    const cells = matrix[row.key] || {};
    const ini = row.label.split(' ').filter(Boolean).map(w => w[0]).slice(0, 2).join('').toUpperCase();
    const resClk = row.isSub || S.groupBy === 'person';
    const resId = row.isSub ? row.teamId : row.key;
    h += '<tr' + (row.isSub ? ' class="subr"' : '') + '><td class="colres' + (row.isSub ? ' sub' : '') + (resClk ? ' clk' : '') + '"' + (resClk ? ' data-res="' + esc(resId) + '" title="Capacité & indisponibilités"' : '') + '><div class="res"><span class="ava" style="background:' + row.color + '">' + esc(ini) + '</span><span><span class="nm">' + esc(row.label) + '</span>' + (row.cap > 0 ? ' <span class="cap">(' + Math.round(row.cap) + 'h)</span>' : '') + '</span></div></td>';
    let win = 0, peakR = 0;
    for (let pi = 0; pi < periods.length; pi++) {
      const p = periods[pi], hr = Number(cells[p]) || 0;
      // Calculer la capacité et le réduit POUR CHAQUE période (pas seulement la première)
      const capP = canonData ? PlanCanonAdapter.getCapacityForRow(row, p, S.granularity, canonData.dailyCapacities, true) : 0;
      const redu = canonData ? PlanCanonAdapter.isRowCapacityReduced(row, p, S.granularity, canonData.dailyCapacities) : false;
      const dispo = S.mode === 'dispo';
      let content;
      if (dispo) { const free = capP > 0 ? Math.max(capP - hr, 0) : 0; win += free; content = fmtDispo(free, capP); }
      else { win += hr; if (capP > 0 && hr / capP > peakR) peakR = hr / capP; content = fmtCell(hr, capP); }
      h += '<td class="cell' + (p === nowKey ? ' nowcol' : '') + (redu ? ' redu' : '') + (String(S._cellKey) === String(row.key) && p === S._cellPeriod ? ' sel' : '') + '" data-key="' + esc(row.key) + '" data-period="' + p + '">' + content + '</td>';
    }
    const peak = Math.round(peakR * 100);
    h += '<td class="sum"><div class="sh">' + hoursText(win) + ' h</div>' + (S.mode === 'dispo' ? '<div class="sp">dispo</div>' : '<div class="sp" style="' + (peak > 100 ? 'color:var(--over)' : '') + '">pic ' + peak + '%</div>') + '</td>';
    h += '</tr>';
  }
  h += '</tbody>';
  // pied : total équipe par période vs capacité canonique
  h += '<tfoot><tr><td class="colres" style="text-align:left;padding:7px 10px">' + (S.mode === 'dispo' ? 'Dispo équipe' : 'Capacité équipe') + '</td>';
  let grand = 0;
  for (let pi = 0; pi < periods.length; pi++) {
    const p = periods[pi];
    let tot = 0; for (const row of rows) if (!row.isHeader) tot += (matrix[row.key] || {})[p] || 0;
    const capTeam = PlanCanonAdapter.getTeamCapacity(activeTeam(), p, S.granularity, canonData ? canonData.dailyCapacities : [], true);
    if (S.mode === 'dispo') {
      const freeTot = Math.max(capTeam - tot, 0); grand += freeTot;
      h += '<td class="' + (p === nowKey ? 'nowcol' : '') + '">' + (freeTot > 0.005 ? hoursText(freeTot) : '·') + '</td>';
    } else {
      grand += tot;
      const pc = capTeam > 0 ? Math.round(tot / capTeam * 100) : null;
      h += '<td class="' + (p === nowKey ? 'nowcol' : '') + '">' + (tot > 0 ? hoursText(tot) + (pc != null ? '<div style="font-size:.66rem;color:var(--text-muted);font-weight:400">' + pc + '%</div>' : '') : '·') + '</td>';
    }
  }
  h += '<td class="sum"><div class="sh">' + hoursText(grand) + ' h</div></td></tr></tfoot></table>';
  if (S.groupBy === 'programme' && !S.projects.some(p => Number(p.programme || p.portefeuille) > 0)) {
    h = '<div class="pf-hint">Aucun projet n\'est rattaché à un programme — tout apparaît sous « Sans programme ». Affectez vos projets dans la table <b>Projects</b> (colonne <b>Programme</b>).</div>' + h;
  }
  wrap.innerHTML = h;
  wrap.querySelectorAll('td.cell').forEach(td => td.addEventListener('click', () => openCell(td.dataset.key, td.dataset.period)));
  wrap.querySelectorAll('td.colres.clk').forEach(td => td.addEventListener('click', () => openResource(td.dataset.res)));
  renderAlerts(matrix, periods);
  if (S.timeline) renderTimeline();
}

/**
 * Charge les données canoniques pour le rendu
 */
async function loadCanonDataForRender() {
  try {
    var state = {
      includeDone: S.includeDone,
      statusCfg: statusCfg,
      filters: S.filters || {}
    };
    
    canonData = await PlanCanonAdapter.loadCanonData(grist, state);
    
    // Construire l'index pour la fenêtre et les filtres courants
    rebuildCanonPlanIndex();
    
    // Mettre à jour l'état de référence
    updateCanonState();
  } catch (e) {
    console.error('Erreur chargement données canoniques:', e);
    invalidateCanonData();
  }
}

/**
 * Reconstruit l'index canonique pour la fenêtre et les filtres courants
 * (sans recharger les données depuis Grist)
 */
function rebuildCanonPlanIndex() {
  if (!canonData) return;
  
  try {
    var periodConfig = {
      granularity: S.granularity,
      keys: TF.periodRange(TF.shiftPeriods(new Date(), S.granularity, S.offset), S.granularity, S.horizon)
    };

    // Le plan ne doit intégrer que les tâches visibles après application des
    // filtres. Les écritures passées restent néanmoins conservées dans les
    // données canoniques et réduisent le reste à faire de chaque affectation.
    var visibleTaskIds = new Set(planTasks().map(function (task) { return Number(task.id); }));
    var scopedCanonData = Object.assign({}, canonData, {
      tasks: canonData.tasks.filter(function (task) { return visibleTaskIds.has(Number(task.id)); }),
      assignments: canonData.assignments.filter(function (assignment) { return visibleTaskIds.has(Number(assignment.tache)); }),
      timeEntries: canonData.timeEntries.filter(function (entry) { return visibleTaskIds.has(Number(entry.taskId)); })
    });

    canonPlanIndex = PlanCanonAdapter.buildCanonPlanIndex(scopedCanonData, periodConfig);
    rollingLoadIndex = PlanCanonAdapter.buildRollingLoadIndex(scopedCanonData, periodConfig, currentLocalIso());

    const rollingSummary = {
      visibleTasks: scopedCanonData.tasks.length,
      activeAssignments: scopedCanonData.assignments.length,
      contributions: rollingLoadIndex.contributions.length,
      diagnostics: rollingLoadIndex.diagnostics
    };
    if (rollingSummary.activeAssignments > 0 && rollingSummary.contributions === 0) {
      console.warn('[Plan rolling] Aucune contribution calculée', rollingSummary);
    } else {
      console.info('[Plan rolling] Projection reconstruite', rollingSummary);
    }
    
    // Mettre à jour l'état de référence
    updateCanonState();
  } catch (e) {
    console.error('Erreur reconstruction index canonique:', e);
    canonPlanIndex = null;
    rollingLoadIndex = null;
  }
}

// Timeline par personne : tâches de chacun en barres sur la même fenêtre que la heatmap (panel du bas).
function toggleTimeline() {
  S.timeline = !S.timeline;
  const b = document.getElementById('btnTimeline'); if (b) b.classList.toggle('active', S.timeline);
  const p = document.getElementById('tlPanel');
  if (S.timeline) { renderTimeline(); p.classList.add('open'); } else p.classList.remove('open');
}
function renderTimeline() {
  const body = document.getElementById('tlBody');
  const periods = TF.periodRange(TF.shiftPeriods(new Date(), S.granularity, S.offset), S.granularity, S.horizon);
  const starts = periodStarts(TF.shiftPeriods(new Date(), S.granularity, S.offset), S.granularity, S.horizon);
  const gName = groupLabel(S.groupBy).toLowerCase();
  const ttl = document.querySelector('#tlPanel .tlhead strong'); if (ttl) ttl.textContent = 'Timeline par ' + gName;
  document.getElementById('tlRange').textContent = '  ' + plabel(periods[0]) + ' → ' + plabel(periods[periods.length - 1]);
  const winStart = starts[0].getTime();
  const winEnd = TF.shiftPeriods(starts[starts.length - 1], S.granularity, 1).getTime();
  const span = (winEnd - winStart) || 1;
  // FOCUS = cellule ouverte dans la heatmap (clé = personne, ou composite "groupe|personne")
  const fKey = S._cellKey != null ? String(S._cellKey) : null;
  const fIdx = (fKey != null && S._cellPeriod) ? periods.indexOf(S._cellPeriod) : -1; // surlignage période seulement si une cellule est focalisée
  let bandStyle = '', bandS = 0, bandE = 0;
  if (fIdx >= 0) {
    bandS = starts[fIdx].getTime();
    bandE = (fIdx + 1 < starts.length ? starts[fIdx + 1].getTime() : winEnd);
    const bl = Math.max(0, (bandS - winStart) / span) * 100;
    const bw = Math.min(100, (bandE - winStart) / span * 100) - bl;
    bandStyle = 'left:' + bl.toFixed(1) + '%;width:' + bw.toFixed(1) + '%';
  }
  const kf = keyFn();            // même clé que la heatmap → filtre les tâches de chaque sous-ligne
  const grouped = S.groupBy !== 'person';
  const tasks = planTasks().filter(t => t.dateDebut != null && t.dateEcheance != null);
  const rows = buildRows();
  let h = '<div class="tl-axis"><div style="width:var(--res-col);flex:none"></div>';
  periods.forEach((p, i) => { h += '<div class="c' + (i === fIdx ? ' on' : '') + '">' + plabel(p) + '</div>'; });
  h += '</div>';
  let any = false, pending = null;
  for (const row of rows) {
    if (row.isHeader) { pending = row; continue; } // section projet/rôle : affichée si au moins une sous-ligne a des tâches
    const laneKey = String(row.key);
    const pid = row.teamId != null ? row.teamId : row.key;
    const mine = tasks
      .filter(t => effCharges(t).some(c => String(kf(t, c)) === laneKey))
      .filter(t => (t.dateEcheance * 1000) >= winStart && (t.dateDebut * 1000) <= winEnd)
      .sort((a, b) => a.dateDebut - b.dateDebut);
    if (!mine.length) continue;
    any = true;
    if (pending) { h += '<div class="tl-sec"><span class="gdot" style="background:' + pending.color + '"></span>' + esc(pending.label) + '</div>'; pending = null; }
    const isF = fKey != null && laneKey === fKey;
    const ini = row.label.split(' ').filter(Boolean).map(w => w[0]).slice(0, 2).join('').toUpperCase();
    h += '<div class="tl-grp' + (grouped ? ' tl-ind' : '') + (isF ? ' tl-focus' : '') + '"' + (isF ? ' id="tlFocus"' : '') + ' data-lane="' + esc(laneKey) + '"><span class="tava" style="background:' + row.color + '">' + esc(ini) + '</span>' + esc(row.label) + ' · ' + mine.length + ' tâche' + (mine.length > 1 ? 's' : '') + '</div>';
    for (const t of mine) {
      const ts = t.dateDebut * 1000, te = t.dateEcheance * 1000;
      const l = Math.max(0, Math.min(1, (ts - winStart) / span)) * 100;
      const rr = Math.max(0, Math.min(1, (te - winStart) / span)) * 100;
      const w = Math.max(rr - l, 1.4);
      const col = (statusCfg.byValue[t.statut] || {}).fillColor || '#64748b';
      const hrs = (effCharges(t).find(c => String(c.teamId) === String(pid)) || {}).heures || 0;
      const hot = isF && fIdx >= 0 && ts < bandE && te > bandS; // tâche dans la période focalisée
      const tp = TF.periodKey(new Date(Math.max(ts, winStart)), S.granularity); // période à ouvrir si "Ajuster"
      h += '<div class="tl-row' + (grouped ? ' tl-ind' : '') + (isF ? ' tl-focus' : '') + '" data-lane="' + esc(laneKey) + '"><div class="tl-lbl" title="' + esc(t.titre) + '">' + esc(t.titre) + '</div><div class="tl-track">' + (bandStyle ? '<div class="tl-band" style="' + bandStyle + '"></div>' : '') + '<div class="tl-bar' + (hot ? ' hot' : '') + '" style="left:' + l.toFixed(1) + '%;width:' + w.toFixed(1) + '%;background:' + col + '" data-id="' + t.id + '" data-lane="' + esc(laneKey) + '" data-period="' + tp + '" title="' + esc(t.titre) + ' · ' + r1(hrs) + ' h — cliquer pour l’aperçu">' + esc(t.titre) + '</div></div></div>';
    }
  }
  if (!any) h += '<div class="tl-empty">Aucune tâche datée sur cette fenêtre.</div>';
  body.innerHTML = h;
  body.querySelectorAll('.tl-bar').forEach(b => b.addEventListener('mousedown', (e) => startBarDrag(e, b)));
  const fg = document.getElementById('tlFocus'); if (fg) fg.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

// Drag d'une barre = REPLANIFIER (horizontal) ou RÉAFFECTER (vers une autre lane). Clic simple (sans drag) = aperçu.
function startBarDrag(e, bar) {
  if (e.button !== 0) return;
  const taskId = Number(bar.dataset.id), fromLane = bar.dataset.lane, period = bar.dataset.period;
  const track = bar.parentElement, trackW = track.clientWidth || 1;
  const starts = periodStarts(TF.shiftPeriods(new Date(), S.granularity, S.offset), S.granularity, S.horizon);
  const winStart = starts[0].getTime();
  const winEnd = TF.shiftPeriods(starts[starts.length - 1], S.granularity, 1).getTime();
  const totalDays = (winEnd - winStart) / 86400000;
  const startX = e.clientX, startY = e.clientY;
  let dragging = false;
  const clearTgt = () => document.querySelectorAll('.drop-tgt').forEach(n => n.classList.remove('drop-tgt'));
  function move(ev) {
    const dx = ev.clientX - startX, dy = ev.clientY - startY;
    if (!dragging && Math.abs(dx) + Math.abs(dy) > 4) { dragging = true; bar.classList.add('dragging'); document.body.style.cursor = 'grabbing'; closeTaskPop(); }
    if (!dragging) return;
    bar.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    clearTgt();
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    const lane = el && el.closest('[data-lane]');
    if (lane && lane.dataset.lane !== fromLane) lane.classList.add('drop-tgt');
  }
  function up(ev) {
    document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up);
    document.body.style.cursor = ''; clearTgt();
    bar.classList.remove('dragging'); bar.style.transform = '';
    if (!dragging) { openTaskPop(taskId, bar, fromLane, period); return; }
    const ddays = Math.round((ev.clientX - startX) / trackW * totalDays);
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    const laneEl = el && el.closest('[data-lane]');
    applyBarDrag(taskId, fromLane, laneEl ? laneEl.dataset.lane : fromLane, ddays);
  }
  document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
  e.preventDefault();
}
async function applyBarDrag(taskId, fromLane, toLane, ddays) {
  const t = S.tasks.find(x => x.id === taskId); if (!t) return;
  const lanePid = l => { l = String(l); const i = l.indexOf('|'); return Number(i >= 0 ? l.slice(i + 1) : l); };
  const fromPid = lanePid(fromLane), toPid = lanePid(toLane);
  const reassign = !isNaN(toPid) && toPid && toPid !== fromPid && !!teamById(toPid);
  if (!reassign && !ddays) return;  // rien à faire (la barre est déjà remise en place)
  let newDebut = null, newEch = null;
  if (ddays && t.dateDebut != null && t.dateEcheance != null) { newDebut = gToInput(t.dateDebut + ddays * 86400); newEch = gToInput(t.dateEcheance + ddays * 86400); }
  // confirmation pour une réaffectation ou un gros déplacement (≥ 1 semaine)
  if (reassign || Math.abs(ddays) >= 7) {
    const parts = [];
    if (reassign) parts.push('Réaffecter « ' + t.titre + ' » de ' + ((teamById(fromPid) || {}).nom || '?') + ' à ' + ((teamById(toPid) || {}).nom || '?'));
    if (ddays) parts.push((reassign ? 'et décaler' : 'Décaler') + ' les dates de ' + (ddays > 0 ? '+' : '') + ddays + ' j');
    const ok = await confirmModal('Confirmer le déplacement', parts.join(' ') + ' ?');
    if (!ok) { render(); return; }
  }
  if (newDebut && newEch) setDates(taskId, newDebut, newEch);
  if (reassign) reassignCharge(taskId, fromPid, toPid);
}

const PRIO_TL = { 1: ['Critique', '#e5484d'], 2: ['Haute', '#f0982d'], 3: ['Moyenne', '#4c7ef3'], 4: ['Basse', '#8a97ab'] };
function delaiDays(t) { return (t.dateCloture && t.dateEcheance) ? Math.round((t.dateCloture - t.dateEcheance) / 86400) : 0; }
function delaiTxt(t) { const d = delaiDays(t); if (d > 0) return '+' + d + ' j de retard'; if (d < 0) return Math.abs(d) + ' j d’avance'; return 'à temps'; }
function taskCardHtml(t) {

    (t.type === 'jalon' ? '<span class="tpc-mil">◆ Jalon</span>' : '') + '</div>' +

}
function openTaskPop(taskId, anchor, lane, period) {
  const t = S.tasks.find(x => x.id === taskId); if (!t) return;
  const pop = document.getElementById('tlPop');
  const canAdj = S.mode === 'prevu' && lane != null;
  pop.innerHTML = taskCardHtml(t) + (canAdj ? '<div class="tpc-foot"><button class="tpc-adj">Ajuster ▸</button></div>' : '');
  pop.style.display = 'block';
  const r = anchor.getBoundingClientRect();
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  let left = r.left + r.width / 2 - pw / 2; left = Math.max(8, Math.min(left, window.innerWidth - pw - 8));
  let top = r.top - ph - 9; if (top < 8) top = r.bottom + 9;
  top = Math.max(8, Math.min(top, window.innerHeight - ph - 8)); // jamais coupé par le bas
  pop.style.left = left + 'px'; pop.style.top = top + 'px';
  const adj = pop.querySelector('.tpc-adj'); if (adj) adj.onclick = () => { closeTaskPop(); openCell(lane, period); };
}

document.addEventListener('click', (e) => { const p = document.getElementById('tlPop'); if (p && p.style.display !== 'none' && !p.contains(e.target) && !e.target.closest('.tl-bar')) closeTaskPop(); });

function fmtCell(hr, capP) {
  if (!(hr > 0)) return '<span class="dot">·</span>';
  const pct = capP > 0 ? Math.round(hr / capP * 100) : 0;
  const pctText = capP > 0 && hr > 0 && pct === 0 ? '&lt;1%' : pct + '%';
  const txt = S.unit === 'pct' && capP > 0 ? pctText : hoursText(hr);
  return '<span class="v" style="background:' + heatBg(hr, capP) + '" title="' + hoursText(hr) + ' h' + (capP > 0 ? ' · ' + pctText + ' de la capacité' : '') + '">' + txt + '</span>';
}
// Fond façon heatmap : teinte par seuil, intensité par taux (capP = capacité de la PÉRIODE).
function heatBg(hr, capP) {
  if (!(capP > 0)) return 'rgba(59,130,246,0.55)';
  const r = hr / capP;
  if (r > 1) return 'rgba(229,72,77,' + Math.min(0.7 + (r - 1) * 0.5, 0.96).toFixed(2) + ')';
  if (r > 0.85) return 'rgba(245,158,11,0.9)';
  return 'rgba(59,130,246,' + (0.16 + 0.62 * (r / 0.85)).toFixed(2) + ')';
}
// Mode Dispo : capacité disponible (cap - charge), échelle verte (plus c'est vert, plus il y a de marge).
function fmtDispo(free, capP) {
  if (!(free > 0.005)) return '<span class="dot">·</span>';
  const r = capP > 0 ? Math.min(free / capP, 1) : 0;
  return '<span class="v" style="background:rgba(21,160,107,' + (0.18 + 0.62 * r).toFixed(2) + ')" title="' + hoursText(free) + ' h disponibles' + (capP > 0 ? ' / ' + Math.round(capP) + 'h' : '') + '">' + hoursText(free) + '</span>';
}

function renderAlerts(matrix, periods) {
  const rows = buildRows();
  let over = 0;
  for (const row of rows) { 
    if (!(row.members && row.members.length)) continue; 
    for (let pi = 0; pi < periods.length; pi++) { 
      const hr = (matrix[row.key] || {})[periods[pi]] || 0; 
      // Utiliser l'adaptateur canonique au lieu de capForRow()
      const capP = canonData ? PlanCanonAdapter.getCapacityForRow(row, periods[pi], S.granularity, canonData.dailyCapacities, true) : 0;
      if (capP > 0 && hr > capP) over++; 
    } 
  }
  const undated = planTasks().filter(t => effCharges(t).length && (t.dateDebut == null || t.dateEcheance == null)).length;
  const el = document.getElementById('alerts'); const parts = [];
  parts.push('<span class="' + (over ? 'over' : '') + '">' + (over ? '⚠ ' + over + ' cellule' + (over > 1 ? 's' : '') + ' en surcharge' : '✓ aucune surcharge sur la fenêtre') + '</span>');
  if (undated) parts.push('<span class="warn">⚠ ' + undated + ' tâche' + (undated > 1 ? 's' : '') + ' chargée' + (undated > 1 ? 's' : '') + ' sans dates — non planifiée' + (undated > 1 ? 's' : '') + '</span>');
  if (!S.includeDone) parts.push('<span>tâches terminées exclues</span>');
  el.innerHTML = parts.join('');
}

function renderSeg(id, opts, cur, cb) {
  const el = document.getElementById(id);
  el.innerHTML = opts.map(([v, l]) => '<button class="' + (v === cur ? 'on' : '') + '" data-v="' + v + '">' + l + '</button>').join('');
  el.querySelectorAll('button').forEach(b => b.onclick = () => cb(b.dataset.v));
}

// ============================================================================
// Drill cellule -> panel (liste des tâches composant la charge) - VERSION CANONIQUE
// ============================================================================
function tasksInCell(key, period) {
  if (canonPlanIndex && canonData) {
    const materialized = PlanCanonAdapter.getTasksInCell(
      canonPlanIndex,
      key,
      period,
      S.tasks,
      S.groupBy,
      canonData
    );
    if (S.mode === 'realise' || !rollingLoadIndex) return materialized;

    const virtual = PlanCanonAdapter.getRollingTasksInCell(
      rollingLoadIndex,
      key,
      period,
      S.groupBy,
      canonData
    );
    const byTask = new Map();
    materialized.concat(virtual).forEach(item => {
      const taskId = Number(item.taskId);
      if (!byTask.has(taskId)) {
        byTask.set(taskId, Object.assign({}, item, {
          slice: 0,
          total: 0,
          entries: [],
          assignmentIds: []
        }));
      }
      const merged = byTask.get(taskId);
      merged.slice += Number(item.slice || 0);
      merged.total += Number(item.total || 0);
      merged.entries = merged.entries.concat(item.entries || []);
      merged.assignmentIds = merged.assignmentIds.concat(item.assignmentIds || []);
      merged.virtual = Boolean(merged.virtual || item.virtual);
      merged.overdue = Boolean(merged.overdue || item.overdue);
    });
    return Array.from(byTask.values()).sort((a, b) => b.slice - a.slice);
  }
  
  // Fallback legacy
  const periodRange = TF.periodRange(TF.shiftPeriods(new Date(), S.granularity, S.offset), S.granularity, S.horizon);
  const periodStartsArr = periodStarts(TF.shiftPeriods(new Date(), S.granularity, S.offset), S.granularity, S.horizon);
  const pi = periodRange.indexOf(period);
  const pstart = pi >= 0 ? periodStartsArr[pi] : new Date();
  const periodDuration = S.granularity === 'week' ? 7 : 30;
  const pend = new Date(pstart.getTime() + periodDuration * 24 * 60 * 60 * 1000);
  const startDate = TF.formatDateUTC(pstart);
  const endDate = TF.formatDateUTC(pend);
  
  const entries = (S.entries || []).filter(e => 
    e.memberId === Number(key) &&
    e.date >= startDate &&
    e.date <= endDate
  );
  
  const byAssignment = TaskFlowTimeEntryLoader.groupEntriesByAssignment(entries);
  
  const out = [];
  byAssignment.forEach((assignmentEntries, assignmentId) => {
    if (!assignmentId) return;
    
    const totalHours = assignmentEntries.reduce((sum, e) => sum + e.plannedHours, 0);
    const taskId = assignmentEntries[0].taskId;
    const task = S.tasks.find(t => t.id === taskId);
    
    if (task) {
      out.push({ 
        task: task,
        assignmentId: assignmentId,
        slice: r1(totalHours),
        total: r1(totalHours),
        entries: assignmentEntries
      });
    }
  });
  
  return out.sort((a, b) => b.slice - a.slice);
}

// Disponibilité par membre sur une période - VERSION CANONIQUE
function memberAvail(period) {
  if (canonPlanIndex && canonData) {
    return PlanCanonAdapter.calculateMemberAvailability(
      activeTeam(),
      period,
      S.granularity,
      canonPlanIndex,
      canonData.dailyCapacities
    );
  }
  
  // Fallback legacy
  const pr = TF.periodRange(TF.shiftPeriods(new Date(), S.granularity, S.offset), S.granularity, S.horizon);
  const ss = periodStarts(TF.shiftPeriods(new Date(), S.granularity, S.offset), S.granularity, S.horizon);
  const pi = pr.indexOf(period);
  const pstart = pi >= 0 ? ss[pi] : new Date();
  
  const periodDuration = S.granularity === 'week' ? 7 : 30;
  const pend = new Date(pstart.getTime() + periodDuration * 24 * 60 * 60 * 1000);
  const startDate = TF.formatDateUTC(pstart);
  const endDate = TF.formatDateUTC(pend);
  
  const out = {};
  for (const m of activeTeam()) {
    const memberEntries = (S.entries || []).filter(e => 
      e.memberId === m.id && 
      e.date >= startDate && 
      e.date <= endDate
    );
    
    const plannedHours = memberEntries.reduce((sum, e) => sum + e.plannedHours, 0);
    
    const cap = capPeriod(capOf(m)) * (1 - indispoFrac(m, pstart));
    out[m.id] = { 
      load: r1(plannedHours),
      cap: r1(cap), 
      free: r1(Math.max(cap - plannedHours, 0)) 
    };
  }
  return out;
}

async function setCharge(taskId, teamId, heures) {

async function reassignCharge(taskId, fromId, toId) {
  if (Number(fromId) === Number(toId)) return;
  const sources = activeTaskAssignments(taskId, fromId);
  if (sources.length !== 1) {
    toast(sources.length ? 'Affectation source ambiguë : réaffectation bloquée' : 'Affectation source introuvable');
    return;
  }
  const source = sources[0];
  const targets = activeTaskAssignments(taskId, toId);
  if (targets.length > 1) {
    toast('Affectation cible ambiguë : réaffectation bloquée');
    return;
  }
  const actions = [];
  if (targets.length === 1) {
    const target = targets[0];
    target.heuresAllouees = Number(target.heuresAllouees || 0) + Number(source.heuresAllouees || 0);
    source.actif = false;
    actions.push(['UpdateRecord', 'TaskAssignments', target.id, { heuresAllouees: target.heuresAllouees }]);
    actions.push(['UpdateRecord', 'TaskAssignments', source.id, { actif: false }]);
  } else {
    source.membre = Number(toId);
    actions.push(['UpdateRecord', 'TaskAssignments', source.id, { membre: Number(toId) }]);
  }
  const task = S.tasks.find(t => Number(t.id) === Number(taskId));
  const legacy = legacyTaskAssignmentFields(taskId);
  if (task) {
    Object.assign(task, legacy);
    actions.push(['UpdateRecord', 'Tasks', task.id, legacy]);
  }
  await applyPlanAssignmentActions(actions);
}

 */
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

/**
 * Vérifie si la prévisualisation courante peut être committée
 * @param {number} assignmentId - ID de l'affectation à vérifier
 * @returns {boolean} true si toutes les préconditions sont réunies
 */
function canCommitCurrentPreview(assignmentId) {
  // Planning service disponible
  if (!planningService) return false;
  
  // Hors mode démo
  if (S.demo) return false;
  
  // Document non readonly
  if (TF.isReadOnly()) return false;
  
  // État courant = success
  if (currentPreviewState !== PreviewState.success) return false;
  
  // Contexte de preview existe
  if (!currentPreviewContext) return false;
  
  // Même assignmentId
  if (currentPreviewContext.assignmentId !== assignmentId) return false;
  
  // canCommit = true
  if (!currentPreviewContext.canCommit) return false;
  
  // previewDataRevision non null
  if (previewDataRevision === null) return false;
  
  // previewDataRevision === gristDataRevision
  if (previewDataRevision !== gristDataRevision) return false;
  
  // Aucune opération de commit déjà en cours
  if (planningCommitInProgress) return false;
  
  return true;
}

/**

 */

}

/**
 * Lance une prévisualisation pour une affectation
 */
async function launchPreview(assignmentId, replanFromDate, button) {
  if (!planningService) {
    toast('Service de planification non disponible');
    return;
  }
  
  if (!button || button.disabled) return;
  
  // Incrémenter l'ID de requête pour éviter les race conditions
  const requestId = ++currentPreviewRequestId;
  
  // Capturer la révision des données au moment de la requête
  const requestDataRevision = gristDataRevision;
  
  // État loading
  currentPreviewState = PreviewState.loading;
  button.disabled = true;
  button.textContent = 'Calcul...';
  
  try {
    const todayIso = new Date().toISOString().slice(0, 10);
    
    const result = await planningService.previewAssignment(assignmentId, {
      replanFromDate,
      todayIso
    });
    
    // Vérifier que c'est toujours la requête courante
    if (requestId !== currentPreviewRequestId) {
      return; // Une nouvelle requête a pris le relais
    }
    
    // Vérifier que les données n'ont pas changé entre-temps
    if (requestDataRevision !== gristDataRevision) {
      markPreviewObsolete();
      return;
    }
    
    if (result.success) {
      currentPreviewState = PreviewState.success;
      previewDataRevision = requestDataRevision;
      currentPreviewContext = {
        assignmentId,
        replanFromDate,
        dataRevision: requestDataRevision,
        canCommit: result.canCommit === true
      };
      showPreviewResult(assignmentId, result);
    } else {
      currentPreviewState = PreviewState.error;
      showPreviewError(assignmentId, result);
    }
  } catch (e) {
    if (requestId !== currentPreviewRequestId) return;
    if (requestDataRevision !== gristDataRevision) {
      markPreviewObsolete();
      return;
    }
    
    currentPreviewState = PreviewState.error;
    console.error('Preview error:', e);
    showPreviewError(assignmentId, {
      success: false,
      error: { code: 'PREVIEW_ERROR', message: e.message || String(e) }
    });
  } finally {
    button.disabled = false;
    button.textContent = 'Simuler';
  }
}

/**
 * Lance le commit d'une prévisualisation
 */
async function launchCommit(assignmentId, button) {
  if (!planningService) {
    toast('Service de planification non disponible');
    return;
  }
  
  // Protection contre les doubles clics : verrou avant la modale
  if (commitConfirmationInProgress || planningCommitInProgress) {
    return;
  }
  
  // Vérifier les préconditions avant confirmation
  if (!canCommitCurrentPreview(assignmentId)) {
    if (previewDataRevision !== gristDataRevision) {
      markPreviewObsolete();
      toast('Données modifiées — relancez la prévisualisation');
    } else {
      toast('Prévisualisation non applicable');
    }
    return;
  }
  
  // Lire la date du contexte (pas du DOM qui a disparu)
  const replanFromDate = currentPreviewContext.replanFromDate;
  
  // Verrouiller avant la modale
  commitConfirmationInProgress = true;
  if (button) {
    button.disabled = true;
    button.textContent = 'Confirmation...';
  }
  
  try {
    // Récupérer les informations pour la confirmation
    const taskById = new Map(S.tasks.map(t => [t.id, t]));
    const memberById = new Map(S.team.map(m => [m.id, m]));
    const assignment = S.assignments.find(a => a.id === assignmentId);
    
    if (!assignment) {
      toast('Affectation introuvable');
      return;
    }
    
    const task = taskById.get(assignment.tache);
    const member = memberById.get(assignment.membre);
    const taskName = task ? task.titre : `Tâche ${assignment.tache}`;
    const memberName = member ? member.nom : `Membre ${assignment.membre}`;
    
    // Obtenir le résultat actuel pour afficher le résumé
    const result = window._currentPreviewResult;
    const changeSummary = result ? result.changeSummary : null;
    
    // Utiliser les totaux incluant les suppressions
    const capacitiesCount = changeSummary?.capacities?.total || 0;
    const timeEntriesCount = changeSummary?.timeEntries?.total || 0;
    
    // Demander confirmation explicite
    const confirmed = await confirmModal(
      'Appliquer cette planification ?',
      `Tâche : ${escapeHtml(taskName)}\n` +
      `Membre : ${escapeHtml(memberName)}\n` +
      `Replanification à partir du : ${replanFromDate}\n\n` +
      `${capacitiesCount} modifications de capacités\n` +
      `${timeEntriesCount} modifications de planning quotidien\n\n` +
      `Le moteur recalculera le plan avant l'écriture.`
    );
    
    if (!confirmed) {
      return;
    }
    
    // Vérifier à nouveau APRÈS la confirmation (les données ont pu changer)
    if (!canCommitCurrentPreview(assignmentId)) {
      if (previewDataRevision !== gristDataRevision) {
        markPreviewObsolete();
        toast('Données modifiées pendant la confirmation');
      } else {
        toast('Prévisualisation non applicable');
      }
      return;
    }
    
    // État committing
    planningCommitInProgress = true;
    currentPreviewState = PreviewState.committing;
    
    const todayIso = new Date().toISOString().slice(0, 10);
    
    // Appeler exclusivement commitAssignment()
    const commitResult = await planningService.commitAssignment(assignmentId, {
      replanFromDate,
      todayIso
    });
    
    if (commitResult.success) {
      currentPreviewState = PreviewState.committed;
      
      // Recharger les données après le commit
      await loadGrist({ preservePlanningPanel: true });
      
      // Vérifier l'idempotence après succès
      const verification = await planningService.previewAssignment(assignmentId, {
        replanFromDate,
        todayIso
      });
      
      // Finaliser le contexte avant d'afficher le résultat
      invalidateCurrentPreviewRequest();
      previewDataRevision = null;
      currentPreviewContext = null;
      window._currentPreviewResult = null;
      
      if (verification.success && 
          verification.changeSummary &&
          verification.changeSummary.capacities?.total === 0 &&
          verification.changeSummary.timeEntries?.total === 0) {
        // Succès vérifié
        showCommitSuccess(assignmentId, commitResult, true);
      } else {
        // Succès mais écarts restants
        showCommitSuccess(assignmentId, commitResult, false);
      }
    } else {
      // Échec du commit : recharger les données
      await loadGrist({ preservePlanningPanel: true });
      
      currentPreviewContext = null;
      previewDataRevision = null;
      currentPreviewState = PreviewState.error;
      
      showCommitError(assignmentId, commitResult);
    }
  } catch (e) {
    // Échec du commit : recharger les données
    await loadGrist({ preservePlanningPanel: true });
    
    currentPreviewContext = null;
    previewDataRevision = null;
    currentPreviewState = PreviewState.error;
    
    console.error('Commit error:', e);
    showCommitError(assignmentId, {
      success: false,
      error: { code: 'COMMIT_ERROR', message: e.message || String(e) }
    });
  } finally {
    planningCommitInProgress = false;
    commitConfirmationInProgress = false;
    if (button) {
      button.disabled = false;
      button.textContent = 'Appliquer la planification';
    }
  }
}

    pBody.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted)">Affectation introuvable</div>';

  const taskName = task ? task.titre : `Tâche ${assignment.tache}`;
  const memberName = member ? member.nom : `Membre ${assignment.membre}`;

/**
 * Rendu du tableau du plan
 */
function renderPlanTable(desiredPlan) {
  if (!desiredPlan || desiredPlan.length === 0) {
    return '<div style="padding:16px;text-align:center;color:var(--text-muted);font-size:0.85rem">Aucun plan généré</div>';
  }
  
  // Limiter à 10 entrées pour l'affichage
  const displayPlan = desiredPlan.slice(0, 10);
  const remaining = desiredPlan.length - 10;
  
  let html = `
    <div style="max-height:300px;overflow:auto;border:1px solid var(--border);border-radius:6px">
      <table style="width:100%;font-size:0.75rem;border-collapse:collapse">
        <thead>
          <tr style="background:var(--surface-2);position:sticky;top:0">
            <th style="padding:6px;text-align:left;border-bottom:1px solid var(--border)">Date</th>
            <th style="padding:6px;text-align:right;border-bottom:1px solid var(--border)">Heures prévues</th>
            <th style="padding:6px;text-align:right;border-bottom:1px solid var(--border)">Capacité théo.</th>
            <th style="padding:6px;text-align:right;border-bottom:1px solid var(--border)">Capacité disp.</th>
          </tr>
        </thead>
        <tbody>
  `;
  
  for (const item of displayPlan) {
    const dateStr = item.date ? new Date(item.date + 'T00:00:00Z').toLocaleDateString('fr-FR') : '—';
    html += `
      <tr style="border-bottom:1px solid var(--border)">
        <td style="padding:6px">${escapeHtml(dateStr)}</td>
        <td style="padding:6px;text-align:right;font-weight:600">${(item.plannedHours || 0).toFixed(1)}h</td>

        <td style="padding:6px;text-align:right;color:var(--text-muted)">${(item.availableCapacityHours || 0).toFixed(1)}h</td>

  if (remaining > 0) {
    html += `<div style="font-size:0.75rem;color:var(--text-muted);margin-top:6px;text-align:center">+${remaining} autres lignes…</div>`;
  }
  
  return html;
}

/**
 * Rendu des diagnostics
 */
function renderDiagnostics(diagnostics) {
  if (!diagnostics || diagnostics.length === 0) return '';
  
  let html = '<div style="display:flex;flex-direction:column;gap:6px">';
  
  for (const diag of diagnostics) {
    const level = getDiagnosticLevel(diag);
    const icon = level === 'bloquant' ? '⛔' : level === 'avertissement' ? '⚠️' : 'ℹ️';
    const color = level === 'bloquant' ? 'var(--over)' : level === 'avertissement' ? 'var(--warn)' : 'var(--text-muted)';
    
    html += `
      <div style="padding:8px;border-radius:6px;font-size:0.78rem;display:flex;gap:8px;align-items:flex-start;background:rgba(255,255,255,0.02)">
        <span style="flex-shrink:0">${icon}</span>
        <div>
          <div style="font-weight:600;color:${color};margin-bottom:2px">${escapeHtml(diag.code || 'DIAGNOSTIC')}</div>
          <div style="color:var(--text-muted)">${escapeHtml(diag.message || '')}</div>
        </div>
      </div>
    `;
  }
  
  html += '</div>';
  return html;
}

/**
 * Détermine le niveau d'un diagnostic en utilisant la fonction du noyau
 */
function getDiagnosticLevel(diag) {
  // Utiliser la fonction officielle du bundle si disponible
  const api = window.TaskFlowPlanning;
  if (api && typeof api.isBlockingDiagnostic === 'function') {
    if (api.isBlockingDiagnostic(diag)) {
      return 'bloquant';
    }
  }
  
  // Fallback pour les diagnostics réellement non bloquants
  const code = diag.code || '';
  if (code.includes('OVERCONSUMPTION') || code.includes('UNPLANNED')) {
    return 'avertissement';
  }
  
  return 'information';
}

async function loadGrist(options = {}) {
  const { preservePlanningPanel = false } = options;
  
  let [tasks, team, projects, dispos, prog, entries, entites, assignments] = await Promise.all([
    grist.docApi.fetchTable('Tasks'),
    grist.docApi.fetchTable('Team'),
    grist.docApi.fetchTable('Projects'),
    grist.docApi.fetchTable('Disponibilites').catch(() => null),
    grist.docApi.fetchTable('Programmes').catch(() => null),
    grist.docApi.fetchTable('TimeEntries').catch(() => null),
    grist.docApi.fetchTable('Entites').catch(() => null),
    grist.docApi.fetchTable('TaskAssignments').catch(() => null)
  ]);
  
  S.demo = false;
  appMode = 'grist';
  
  const ensured = await ensurePlanColumns(team, tasks, dispos); team = ensured.team; tasks = ensured.tasks; dispos = ensured.dispos;
  S.tasks = tasks ? TF.columnarToRows(tasks) : [];
  S.team = team ? TF.columnarToRows(team) : [];
  S.projects = projects ? TF.columnarToRows(projects) : [];
  S.dispos = dispos ? TF.columnarToRows(dispos) : [];
  S.programmes = prog ? TF.columnarToRows(prog) : [];
  S.entites = entites ? TF.columnarToRows(entites) : [];
  // #5 : réalisé daté EXACT depuis la Feuille de temps (TimeEntries). Opt-in : actif seulement si la table existe.
  // Utilisation du loader commun pour normaliser les données (contrat Plan/CRA unifié)
  const timeEntriesResult = entries ? await TaskFlowTimeEntryLoader.loadTimeEntries(grist) : { entries: [], feuillesById: {}, diagnostics: [] };
  S.entries = timeEntriesResult.entries;
  S.feuillesById = timeEntriesResult.feuillesById;
  S.hasEntries = !!(entries && S.entries.length);
  
  // Logger les diagnostics (optionnel)
  if (timeEntriesResult.diagnostics && timeEntriesResult.diagnostics.length > 0) {
    console.log('[Plan] TimeEntries chargées:', timeEntriesResult.diagnostics);
  }
  // TaskAssignments : chargement pour la prévisualisation du planning
  S.assignments = assignments ? TF.columnarToRows(assignments) : [];
  // loadGrist est aussi rappelé par grist.onRecords. À ce stade S contient les
  // nouvelles données, donc le cache multi-tables utilisé par render doit être
  // invalidé avant tout nouveau calcul de matrice.
  invalidateCanonData();
  // Programme = opt-in : actif seulement si la colonne Projects.programme (ou portefeuille) existe. Sinon le groupement propose l'activation.
  S.hasProg = !!(projects && (('programme' in projects) || ('portefeuille' in projects)) && prog);
  
  // Incrémenter la révision des données après chargement réussi
  if (initialDataLoadComplete) {
    gristDataRevision++;
    
    // Invalider une prévisualisation déjà affichée si les données ont changé
    // SAUF si un commit est en cours (on ne veut pas afficher "obsolete" pendant l'écriture)
    if (
      !planningCommitInProgress &&
      activePanelMode === PanelMode.PREVIEW &&
      previewDataRevision !== null &&
      previewDataRevision !== gristDataRevision
    ) {
      invalidateCurrentPreviewRequest();
      previewDataRevision = null;
      currentPreviewState = PreviewState.obsolete;
      showPreviewObsolete();
    }
  } else {
    initialDataLoadComplete = true;
  }
  
  buildDispoIndex();
  initFilterManager();
  render();
}

// Le widget Plan est le CRÉATEUR UNIQUE de ses colonnes (sweet spot opt-in) : Team.capaciteHebdo/indispos
// + Tasks.charges/dateCloture. Les autres widgets ne créent rien — ils n'activent leurs bouts "charge"
// que si ces colonnes existent. Un doc qui n'ouvre jamais le Plan reste sans empreinte.
let _colsEnsured = false;
async function ensurePlanColumns(team, tasks, dispos) {
  if (_colsEnsured) return { team, tasks, dispos };
  const add = [];
  if (team && !('capaciteHebdo' in team)) add.push(['AddColumn', 'Team', 'capaciteHebdo', { type: 'Numeric' }]);
  if (team && !('indispos' in team)) add.push(['AddColumn', 'Team', 'indispos', { type: 'Text' }]);
  if (tasks && !('charges' in tasks)) add.push(['AddColumn', 'Tasks', 'charges', { type: 'Text' }]);
  if (tasks && !('dateCloture' in tasks)) add.push(['AddColumn', 'Tasks', 'dateCloture', { type: 'Date' }]);
  if (dispos == null) add.push(['AddTable', 'Disponibilites', [{ id: 'membre', type: 'Ref:Team' }, { id: 'type', type: 'Text' }, { id: 'dateDebut', type: 'Date' }, { id: 'dateFin', type: 'Date' }, { id: 'dispo', type: 'Numeric' }, { id: 'commentaire', type: 'Text' }]]);
  _colsEnsured = true; // garde anti-ré-entrance (onRecords rappelle loadGrist pendant l'await)
  if (!add.length) return { team, tasks, dispos };
  try {
    await grist.docApi.applyUserActions(add);
    const [t2, tm2, d2] = await Promise.all([
      grist.docApi.fetchTable('Tasks').catch(() => tasks),
      grist.docApi.fetchTable('Team').catch(() => team),
      grist.docApi.fetchTable('Disponibilites').catch(() => dispos)
    ]);
    return { team: tm2, tasks: t2, dispos: d2 };
  } catch (e) { return { team, tasks, dispos }; }
}

// Programme (JPP #11) : regroupement simple de projets. Satellite opt-in, créé seulement sur action
// explicite (sélection du groupement Programme). Table Programmes + colonne Projects.programme.
// L'affectation projet -> programme se fait nativement dans la table Projects (colonne Ref).
async function ensureProgSchema() {
  try {
    // Migration : Renommer Portefeuilles → Programmes si l'ancienne table existe
    const portefTable = await grist.docApi.fetchTable('_grist_Tables').then(data => {
      const rows = TF.columnarToRows(data);
      return rows.find(r => r.tableId === 'Portefeuilles');
    }).catch(() => null);
    if (portefTable) {
      await grist.docApi.applyUserActions([['RenameTable', 'Portefeuilles', 'Programmes']]);
    }
    
    const projects = await grist.docApi.fetchTable('Projects').catch(() => null);
    const progExists = await grist.docApi.fetchTable('Programmes').then(() => true).catch(() => false);
    const acts = [];
    if (!progExists) acts.push(['AddTable', 'Programmes', [
      { id: 'nom', type: 'Text' }, { id: 'couleur', type: 'Text' },
      { id: 'responsable', type: 'Ref:Team' }, { id: 'description', type: 'Text' }, { id: 'actif', type: 'Bool' }
    ]]);
    // Migration : portefeuille → programme (si ancienne colonne existe, on la garde, sinon on crée programme)
    if (projects && !('programme' in projects)) {
      // Si portefeuille existe déjà, on ne fait rien (rétrocompatible)
      if (!('portefeuille' in projects)) {
        acts.push(['AddColumn', 'Projects', 'programme', { type: 'Ref:Programmes' }]);
      }
    }
    if (acts.length) await grist.docApi.applyUserActions(acts);
    const [pj2, pf2] = await Promise.all([
      grist.docApi.fetchTable('Projects').catch(() => null),
      grist.docApi.fetchTable('Programmes').catch(() => null)
    ]);
    S.projects = pj2 ? TF.columnarToRows(pj2) : S.projects;
    S.programmes = pf2 ? TF.columnarToRows(pf2) : S.programmes;
    // hasProg = true si programme OU portefeuille existe
    S.hasProg = !!(pj2 && (('programme' in pj2) || ('portefeuille' in pj2)) && pf2);
  } catch (e) { /* droits insuffisants : hasProg reste false */ }
}

async function initGrist() {
  try {
    console.info('[Plan init] Connexion à Grist…');

    await grist.ready({
      requiredAccess: 'full'
    });

    appMode = 'grist';
    S.demo = false;

    console.info(
      '[Plan init] Connexion Grist confirmée'
    );

    TF.readOnlyBanner();

    const permissionRuntime = await TF.createPermissionRuntime(grist, {
      onIdentity: identity => {
        if (!identity.identified) console.warn('[Plan permissions]', identity.status);
      },
      onError: error => console.error('[Plan permissions] Initialisation impossible', error),
      reloadIdentitySnapshot: () => loadGrist()
    });

    TF.guardWrites(grist, {
      permissionRuntime,
      onReadOnly: () => {
        toast(
          'Lecture seule : modification non autorisée'
        );
      },
      onDenied: () => {
        toast(
          'Modification refusée par vos droits'
        );

        loadGrist().catch(error => {
          console.error(
            '[Plan] Rechargement après refus impossible',
            error
          );
        });
      }
    });

    initPlanningService();

    await loadGrist();

    S.userFilterStore = TaskFlowUserFilters.createStore(grist, {
      gristUserId: permissionRuntime.getActor()?.gristUserId,
      sourceWidget: 'plan',
      onError: error => console.error('[Plan filtres personnels]', error)
    });
    const savedFilters = await S.userFilterStore.load();
    if (S.filterManager) S.filterManager.setState(savedFilters, { origin: 'persistent', broadcast: false });

    grist.onRecords(() => {
      if (appMode !== 'grist') {
        return;
      }

      loadGrist().catch(error => {
        console.error(
          '[Plan] Rechargement Grist impossible',
          error
        );
      });
    });

  } catch (error) {
    appMode = 'error';
    S.demo = false;

    console.error(
      '[Plan init] Initialisation Grist impossible',
      error
    );

    const wrap =
      document.getElementById('gridwrap');

    if (wrap) {
      wrap.innerHTML =
        '<div class="empty">' +
          '<div class="ic">⚠</div>' +
          '<div>Connexion à Grist impossible</div>' +
          '<div style="font-size:.78rem">' +
            esc(error?.message || error) +
          '</div>' +
        '</div>';
    }
  }
}
