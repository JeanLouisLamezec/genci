            log('Migration v3 appliquée avec succès: ' + actions.length + ' actions');
            
            // Relire les métadonnées après écriture
            metadata = await loadMigrationMetadata(grist);
        } else {
            log('Aucune action nécessaire, migration déjà appliquée');
        }
        
        return { 
            success: true, 
            message: 'Migration v3 appliquée',
            actionsExecuted: actions.length,
            metadata: metadata
        };
    }

    // ========================================================================
    // MIGRATION V3 → V4 — Fondation du workflow de validation
    // ========================================================================
    
    async function migrateToV4(grist, metadata) {
        log('Migration v3 → v4: timesheet-validation-foundation-v4');
        
        var docApi = getDocApi(grist);
        var actions = [];
        var existingTables = metadata.tablesByName || {};
        var existingColumns = metadata.columnsByKey || {};
        var errors = [];
        
        // 1. Ajouter les colonnes simples manquantes de Feuilles
        var feuillesCols = [
            { id: 'responsableValidation', type: 'Ref:Team' },
            { id: 'soumisPar', type: 'Ref:Team' },
            { id: 'dateSoumission', type: 'DateTime' },
            { id: 'revisionValidation', type: 'Int' },
            { id: 'motifCorrection', type: 'Text' }
        ];
        
        for (var i = 0; i < feuillesCols.length; i++) {
            var colDef = feuillesCols[i];
            var key = 'Feuilles.' + colDef.id;
            if (!existingColumns[key]) {
                log('Ajout de la colonne Feuilles.' + colDef.id);
                actions.push(['AddColumn', 'Feuilles', colDef.id, {
                    type: colDef.type,
                    isFormula: false
                }]);
                existingColumns[key] = { type: colDef.type };
            } else {
                // Vérifier le type
                var existingCol = existingColumns[key];
                if (existingCol.type !== colDef.type) {
                    errors.push({
                        column: key,
                        expectedType: colDef.type,
                        actualType: existingCol.type,
                        issue: 'TYPE_MISMATCH'
                    });
                }
                log('Feuilles.' + colDef.id + ' existe déjà (type: ' + existingCol.type + ')');
            }
        }
        
        // 2. Ajouter les colonnes simples de TaskFlow_Meta pour les ACL
        var metaCols = [
            { id: 'aclVersion', type: 'Int' },
            { id: 'aclStatus', type: 'Choice' },
            { id: 'lastAclMigration', type: 'Text' },
            { id: 'lastAclMigrationAt', type: 'DateTime' },
            { id: 'lastAclError', type: 'Text' }
        ];
        
        for (var j = 0; j < metaCols.length; j++) {
            var colDef = metaCols[j];
            var key = 'TaskFlow_Meta.' + colDef.id;
            if (!existingColumns[key]) {
                log('Ajout de la colonne TaskFlow_Meta.' + colDef.id);
                actions.push(['AddColumn', 'TaskFlow_Meta', colDef.id, {
                    type: colDef.type,
                    isFormula: false
                }]);
                existingColumns[key] = { type: colDef.type };
            } else {
                var existingCol = existingColumns[key];
                if (existingCol.type !== colDef.type) {
                    errors.push({
                        column: key,
                        expectedType: colDef.type,
                        actualType: existingCol.type,
                        issue: 'TYPE_MISMATCH'
                    });
                }
                log('TaskFlow_Meta.' + colDef.id + ' existe déjà (type: ' + existingCol.type + ')');
            }
        }
        
        // 3. Ajouter les colonnes formulées de TimeEntries
        var timeEntriesFormulaCols = [
            { 
                id: 'statutFeuille', 
                type: 'Text', 
                formula: '$feuille.statut if $feuille else ""' 
            },
            { 
                id: 'responsableValidation', 
                type: 'Ref:Team', 
                formula: '$feuille.responsableValidation if $feuille else None' 
            },
            { 
                id: 'semaineFeuille', 
                type: 'Date', 
                formula: '$feuille.semaine if $feuille else None' 
            }
        ];
        
        for (var k = 0; k < timeEntriesFormulaCols.length; k++) {
            var colDef = timeEntriesFormulaCols[k];
            var key = 'TimeEntries.' + colDef.id;
            if (!existingColumns[key]) {
                log('Ajout de la colonne formulée TimeEntries.' + colDef.id);
                actions.push(['AddColumn', 'TimeEntries', colDef.id, {
                    type: colDef.type,
                    isFormula: true,
                    formula: colDef.formula
                }]);
                existingColumns[key] = { 
                    type: colDef.type,
                    isFormula: true,
                    formula: colDef.formula
                };
            } else {
                var existingCol = existingColumns[key];
                
                // Vérifier isFormula
                if (!existingCol.isFormula) {
                    errors.push({
                        column: key,
                        expectedFormula: true,
                        actualFormula: existingCol.isFormula,
                        issue: 'NOT_A_FORMULA'
                    });
                }
                
                // Vérifier le type
                if (existingCol.type !== colDef.type) {
                    errors.push({
                        column: key,
                        expectedType: colDef.type,
                        actualType: existingCol.type,
                        issue: 'TYPE_MISMATCH'
                    });
                }
                
                // Vérifier la formule (seulement si isFormula=true)
                if (existingCol.isFormula && existingCol.formula !== colDef.formula) {
                    // Formule différente : pourrait être une personnalisation
                    // On ne bloque pas, mais on logue
                    log('TimeEntries.' + colDef.id + ' a une formule personnalisée');
                }
                
                log('TimeEntries.' + colDef.id + ' existe déjà (type: ' + existingCol.type + ', isFormula: ' + existingCol.isFormula + ')');
            }
        }
        
        // Si des erreurs critiques, échouer la migration
        if (errors.length > 0) {
            var criticalErrors = errors.filter(function(e) { 
                return e.issue === 'TYPE_MISMATCH' || e.issue === 'NOT_A_FORMULA'; 
            });
            
            if (criticalErrors.length > 0) {
                log('Migration v4 échouée: conflits critiques détectés', criticalErrors);
                throw new Error(
                    'Migration v4 bloquée: ' + criticalErrors.length + ' conflit(s) critique(s). ' +
                    'Colonnes incompatibles détectées. Détails: ' + JSON.stringify(criticalErrors)
                );
            }
        }
        
        // Appliquer les actions si nécessaire
        if (actions.length > 0) {
            await docApi.applyUserActions(actions);
            log('Migration v4 appliquée avec succès: ' + actions.length + ' actions');
            
            // Relire les métadonnées après écriture
            metadata = await loadMigrationMetadata(grist);
        } else {
            log('Aucune action nécessaire, migration déjà appliquée');
        }
        
        return { 
            success: true, 
            message: 'Migration v4 appliquée',
            actionsExecuted: actions.length,
            metadata: metadata,
            warnings: errors.length > 0 ? errors : undefined
        };
    }

    // ========================================================================
    // MIGRATION V4 → V5 — Rattachement des entrées de temps aux feuilles hebdomadaires
    // ========================================================================
    
    async function migrateToV5(grist, metadata, options) {
        var opts = options || {};
        var dryRun = opts.dryRun || false;
        
        log('Migration v4 → v5: timesheet-sheet-link-backfill-v5');
        
        // Vérifier que le module de backfill est chargé
        if (!global.TaskFlowTimesheetBackfill) {
            throw new Error('TIMESHEET_BACKFILL_MODULE_NOT_LOADED: Le module TaskFlowTimesheetBackfill n\'est pas chargé');
        }
        
        var backfill = global.TaskFlowTimesheetBackfill;
        var docApi = getDocApi(grist);
        
        // Vérifier que les tables existent
        var tablesData = await docApi.fetchTable('_grist_Tables');
        var tables = columnarToRows(tablesData);
        var tableIds = tables.map(function(t) { return t.tableId; });
        
        var requiredTables = ['Team', 'Feuilles', 'TimeEntries'];
        var missingTables = requiredTables.filter(function(t) { return tableIds.indexOf(t) === -1; });
        
        if (missingTables.length > 0) {
            throw new Error('TIMESHEET_BACKFILL_TABLE_MISSING: Tables manquantes: ' + missingTables.join(', '));
        }
        
        // Charger les données
        var teamData = await docApi.fetchTable('Team');
        var sheetsData = await docApi.fetchTable('Feuilles');
        var entriesData = await docApi.fetchTable('TimeEntries');
        
        var team = columnarToRows(teamData);
        var sheets = columnarToRows(sheetsData);
        var entries = columnarToRows(entriesData);
        
        log('Données chargées: ' + team.length + ' membres, ' + sheets.length + ' feuilles, ' + entries.length + ' entrées');
        
        // Phase 1 : Prévalidation - construire le plan initial
        var inspection = backfill.inspect({ team: team, sheets: sheets, entries: entries });
        var plan = backfill.buildPlan({ team: team, sheets: sheets, entries: entries }, inspection);
        
        if (!plan.valid) {
            log('Migration v5 échouée: conflits détectés', plan.conflicts);
            throw new Error(
                'TIMESHEET_BACKFILL_CONFLICT: ' + plan.conflicts.length + ' conflit(s) détecté(s). ' +
                'Codes: ' + plan.conflicts.map(function(c) { return c.code; }).join(', ')
            );
        }
        
        // Dry run : retourner le plan sans appliquer
        if (dryRun) {
            log('Dry run: aucun changement appliqué');
            return {
                success: true,
                dryRun: true,
                message: 'Prévisualisation de la migration v5',
                actionsExecuted: 0,
                plan: plan
            };
        }
        
        var actionsExecuted = 0;
        var createdSheets = [];
        var linkedEntries = [];
        var preservedLinks = [];
        
        // Phase A : Créer les feuilles manquantes
        if (plan.creates.length > 0) {
            log('Phase A: Création de ' + plan.creates.length + ' feuilles manquantes');
            
            // Sauvegarder les clés des feuilles créées pour le rapport
            var createdSheetKeys = plan.creates.map(function(create) {
                return create.key;
            });
            
            var addActions = [];
            for (var i = 0; i < plan.creates.length; i++) {
                var create = plan.creates[i];
                addActions.push([
                    'AddRecord',
                    'Feuilles',
                    null,
                    create.values
                ]);
            }
            
            if (addActions.length > 0) {
                await docApi.applyUserActions(addActions);
                actionsExecuted += addActions.length;
                log('Feuilles créées: ' + addActions.length);
                createdSheets = createdSheetKeys;
            }
            
            // Relire TOUTES les tables pour la concurrence (Team, Feuilles, TimeEntries)
            var newTeamData = await docApi.fetchTable('Team');
            var newSheetsData = await docApi.fetchTable('Feuilles');
            var newEntriesData = await docApi.fetchTable('TimeEntries');
            
            var newTeam = columnarToRows(newTeamData);
            var newSheets = columnarToRows(newSheetsData);
            var newEntries = columnarToRows(newEntriesData);
            
            // Reconstruire le plan avec les nouvelles données
            var newInspection = backfill.inspect({ 
                team: newTeam, 
                sheets: newSheets, 
                entries: newEntries 
            });
            
            // Vérifier qu'il n'y a pas de conflits après création
            if (newInspection.conflicts.length > 0) {
                log('Conflits détectés après phase A', newInspection.conflicts);
                throw new Error(
                    'TIMESHEET_BACKFILL_CONFLICT_AFTER_CREATE: ' + newInspection.conflicts.length + ' conflit(s) après création des feuilles'
                );
            }
            
            var newPlan = backfill.buildPlan({ 
                team: newTeam, 
                sheets: newSheets, 
                entries: newEntries 
            }, newInspection);
            
            // Vérifier que la phase A est complète
            if (newPlan.creates.length > 0) {
                throw new Error('TIMESHEET_BACKFILL_PHASE_A_INCOMPLETE: Il reste des feuilles à créer après la phase A');
            }
            
            // Utiliser le nouveau plan pour la phase B
            plan = newPlan;
        } else {
            // Même sans création, relire pour détecter les modifications concurrentes
            var preTeamData = await docApi.fetchTable('Team');
            var preSheetsData = await docApi.fetchTable('Feuilles');
            var preEntriesData = await docApi.fetchTable('TimeEntries');
            
            var preTeam = columnarToRows(preTeamData);
            var preSheets = columnarToRows(preSheetsData);
            var preEntries = columnarToRows(preEntriesData);
            
            var preInspection = backfill.inspect({ 
                team: preTeam, 
                sheets: preSheets, 
                entries: preEntries 
            });
            
            if (preInspection.conflicts.length > 0) {
                log('Conflits détectés avant phase B', preInspection.conflicts);
                throw new Error(
                    'TIMESHEET_BACKFILL_CONFLICT_AFTER_CREATE: ' + preInspection.conflicts.length + ' conflit(s) détectés avant rattachement'
                );
            }
            
            var prePlan = backfill.buildPlan({ 
                team: preTeam, 
                sheets: preSheets, 
                entries: preEntries 
            }, preInspection);
            
            plan = prePlan;
        }
        
        // Phase B : Rattacher les TimeEntries
        if (plan.links.length > 0) {
            // Vérifier qu'il n'y a pas de créations restantes ou de liens non résolus
            var unresolvedLinks = plan.links.filter(function(link) {
                return backfill.normalizeId(link.sheetId) === null;
            });

            if (plan.creates.length > 0 || unresolvedLinks.length > 0) {
                log('Phase B bloquée : créations restantes ou liens non résolus', {
                    creates: plan.creates.length,
                    unresolvedLinks: unresolvedLinks.length
                });
                throw new Error(
                    'TIMESHEET_BACKFILL_PHASE_A_INCOMPLETE: ' +
                    plan.creates.length +
                    ' feuille(s) restent à créer et ' +
                    unresolvedLinks.length +
                    ' lien(s) restent non résolus'
                );
            }

            log('Phase B: Rattachement de ' + plan.links.length + ' entrées');
            
            var updateActions = [];
            for (var j = 0; j < plan.links.length; j++) {
                var link = plan.links[j];
                updateActions.push([
                    'UpdateRecord',
                    'TimeEntries',
                    link.entryId,
                    {
                        feuille: link.sheetId
                    }
                ]);
            }
            
            if (updateActions.length > 0) {
                await docApi.applyUserActions(updateActions);
                actionsExecuted += updateActions.length;
                log('Entrées rattachées: ' + updateActions.length);
            }
        }
        
        // Vérification finale
        log('Vérification finale...');
        var finalTeamData = await docApi.fetchTable('Team');
        var finalSheetsData = await docApi.fetchTable('Feuilles');
        var finalEntriesData = await docApi.fetchTable('TimeEntries');
        
        var finalTeam = columnarToRows(finalTeamData);
        var finalSheets = columnarToRows(finalSheetsData);
        var finalEntries = columnarToRows(finalEntriesData);
        
        var verification = backfill.verifyFinalState({ 
            team: finalTeam, 
            sheets: finalSheets, 
            entries: finalEntries 
        });
        
        if (!verification.valid) {
            log('Vérification finale échouée', verification.conflicts);
            throw new Error(
                'TIMESHEET_BACKFILL_VERIFICATION_FAILED: ' + verification.conflicts.length + ' conflit(s) après migration'
            );
        }
        
        // Compter les statistiques
        for (var k = 0; k < plan.links.length; k++) {
            var link = plan.links[k];
            if (link.pendingCreate) {
                linkedEntries.push(link.entryId);
            } else {
                // Lien vers feuille existante
                linkedEntries.push(link.entryId);
            }
        }
        
        for (var l = 0; l < plan.preservedLinks.length; l++) {
            preservedLinks.push(plan.preservedLinks[l].entryId);
        }
        
        log('Migration v5 appliquée avec succès');
        
        return {
            success: true,
            message: 'Migration v5 appliquée',
            actionsExecuted: actionsExecuted,
            createdSheets: createdSheets,
            linkedEntries: linkedEntries,
            preservedLinks: preservedLinks,
            verification: verification,
            dryRun: false
        };
    }

    // ========================================================================
    // API PUBLIQUE
    // ========================================================================

    // Lit la version actuelle installée
    async function getCurrentVersion(grist) {
        var docApi = getDocApi(grist);
        try {
            var meta = await docApi.fetchTable('TaskFlow_Meta');
            var rows = columnarToRows(meta);
            if (rows && rows.length > 0) {
                return rows[0].schemaVersion || 1;
            }
            return 1;
        } catch (e) {
            return 1; // Pas de table meta = version 1
        }
    }

    // Calcule les migrations à appliquer
    function getPendingMigrations(currentVersion) {
        var pending = [];
        var targetVersion = SCHEMA ? SCHEMA.version : 3;
        
        for (var i = 0; i < MIGRATIONS.length; i++) {
            var migration = MIGRATIONS[i];
            if (migration.version > currentVersion && migration.version <= targetVersion) {
                pending.push(migration);
            }
        }
        return pending;
    }

    // Exécute toutes les migrations en attente
    async function runMigrations(grist, currentVersion, options) {
        options = options || {};
        var nowUnixSeconds = options.nowUnixSeconds || Math.floor(Date.now() / 1000);
        var dryRun = options.dryRun || false;
        
        var pending = getPendingMigrations(currentVersion);
        
        // Le dry run reste reserve a la migration de donnees v5. La migration
        // additive v6 ne doit pas etre executee pendant cette previsualisation.
        if (dryRun && pending.length > 0) {
            var canPreviewV5 = Number(currentVersion) === 4 && pending[0].version === 5;
            if (!canPreviewV5) {
                throw new Error('DRY_RUN_REQUIRES_SCHEMA_V4: Le dry run n\'est autorisé que pour la migration v5 depuis un schéma v4');
            }
            pending = [pending[0]];
        }
        
        if (pending.length === 0) {
            log('Aucune migration en attente');
            return {
                success: true,
                applied: 0,
                message: 'Schéma à jour',
                finalVersion: currentVersion
            };
        }
        
        log('Migrations en attente: ' + pending.length, pending.map(function (m) { return m.name; }));
        
        var results = [];
        var metadata = null;
        var lastSuccessfulVersion = currentVersion;
        var docApi = getDocApi(grist);
        
        for (var i = 0; i < pending.length; i++) {
            var migration = pending[i];
            
            try {
                log('Application migration: ' + migration.name + ' (v' + migration.version + ')');
                
                // Relit les métadonnées avant chaque migration
                try {
                    metadata = await loadMigrationMetadata(grist);
                } catch (e) {
                    metadata = { tablesByName: {}, columnsByKey: {} };
                }
                
                // Exécute la migration
                var migrationOptions = {
                    dryRun: dryRun,
                    nowUnixSeconds: nowUnixSeconds
                };
                var result = await migration.run(grist, metadata, migrationOptions);
                
                if (!result || !result.success) {
                    throw new Error('Migration échouée: ' + migration.name);
                }
                
                results.push({
                    version: migration.version,
                    name: migration.name,
                    success: true,
                    message: result.message
                });
                
                // Met à jour la version courante après succès (seulement si pas dry run)
                if (!dryRun) {
                    lastSuccessfulVersion = migration.version;
                    
                    // Mettre à jour TaskFlow_Meta
                    await updateSchemaVersion(grist, lastSuccessfulVersion, migration.name, nowUnixSeconds);
                    
                    log('Migration appliquée: ' + migration.name + ' - version mise à jour: ' + lastSuccessfulVersion);
                } else {
                    log('Dry run: migration ' + migration.name + ' non appliquée');
                }
                
                // Petit délai entre les migrations
                await delay(100);
                
            } catch (e) {
                log('Échec migration: ' + migration.name, e);
                
                results.push({
                    version: migration.version,
                    name: migration.name,
                    success: false,
                    error: e.message || String(e)
                });
                
                // Met à jour les métadonnées avec l'erreur (seulement si pas dry run)
                if (!dryRun) {
                    try {
                        await updateMigrationError(grist, migration.name, e.message || String(e), nowUnixSeconds);
                    } catch (updateError) {
                        log('Erreur lors de la mise à jour de l\'erreur: ' + updateError);
                    }
                }
                
                // Arrête au premier échec
                throw new Error('Migration échouée à v' + migration.version + ': ' + (e.message || e));
            }
        }
        
        return {
            success: true,
            applied: pending.length,
            results: results,
            finalVersion: dryRun ? currentVersion : lastSuccessfulVersion,
            dryRun: dryRun
        };
    }
    
    // Met à jour la version du schéma dans TaskFlow_Meta
    async function updateSchemaVersion(grist, version, migrationName, nowUnixSeconds) {
        var docApi = getDocApi(grist);
        nowUnixSeconds = nowUnixSeconds || Math.floor(Date.now() / 1000);
        
        try {
            var meta = await docApi.fetchTable('TaskFlow_Meta');
            var rows = columnarToRows(meta);
            
            if (rows && rows.length > 0) {
                // Mettre à jour l'enregistrement existant
                var rowId = meta.id ? meta.id[0] : rows[0].id;
                await docApi.applyUserActions([
                    ['UpdateRecord', 'TaskFlow_Meta', rowId, {
                        schemaVersion: version,
                        lastMigration: migrationName,
                        lastMigrationAt: nowUnixSeconds,
                        lastError: null
                    }]
                ]);
            } else {
                // Créer un nouvel enregistrement
                await docApi.applyUserActions([
                    ['AddRecord', 'TaskFlow_Meta', null, {
                        schemaVersion: version,
                        lastMigration: migrationName,
                        lastMigrationAt: nowUnixSeconds,
                        installationStatus: 'migrated'
                    }]
                ]);
            }
        } catch (e) {
            log('Erreur lors de la mise à jour de TaskFlow_Meta: ' + (e.message || e));
            throw e; // Propager l'erreur pour que la migration échoue
        }

                var schemaTable = SCHEMA.tables[tableName];
                var schemaCol = schemaTable ? schemaTable.columns.find(function(c) { return c.id === colId; }) : null;
                var declaredType = schemaCol ? (schemaCol.opts?.type || schemaCol.type) : null;
                
                if (!existingCol) {
                    // Colonne manquante : l'ajouter avec le type déclaré
                    var targetType = declaredType || 'Any';
                    try {
                        await grist.docApi.applyUserActions([
                            ['AddColumn', tableName, colId, {
                                type: targetType,
                                isFormula: true,
                                formula: formula
                            }]
                        ]);
                        result.added.push(key);
                    } catch (e) {
                        result.errors.push({
                            table: tableName,
                            column: colId,
                            error: e.message || String(e)
                        });
                    }
                } else {
                    // Colonne existante : vérifier l'état
                    var existingFormula = existingCol.formula || '';
                    var existingIsFormula = existingCol.isFormula || false;
                    var existingType = existingCol.type;
                    
                    // Cas 1 : Formule vide "" → réparer si on a une formule centrale
                    if (existingIsFormula && existingFormula === '' && formula && formula !== '') {
                        try {
                            await grist.docApi.applyUserActions([
                                ['ModifyColumn', tableName, colId, {
                                    formula: formula
                                }]
                            ]);
                            result.repaired.push({ key: key, reason: 'formule-vide' });
                        } catch (e) {
                            result.errors.push({
                                table: tableName,
                                column: colId,
                                action: 'repair-empty-formula',
                                error: e.message || String(e)
                            });
                        }
                    }
                    // Cas 2 : Placeholder [] → réparer
                    else if (existingIsFormula && existingFormula === '[]' && formula && formula !== '[]') {
                        try {
                            await grist.docApi.applyUserActions([
                                ['ModifyColumn', tableName, colId, {
                                    formula: formula
                                }]
                            ]);
                            result.repaired.push({ key: key, reason: 'placeholder' });
                        } catch (e) {
                            result.errors.push({
                                table: tableName,
                                column: colId,
                                action: 'repair-placeholder',
                                error: e.message || String(e)
                            });
                        }
                    }
                    // Cas 3 : isFormula=false mais devrait être true → warning
                    else if (!existingIsFormula && declaredType) {
                        result.warnings.push({
                            table: tableName,
                            column: colId,
                            issue: 'should-be-formula',
                            expectedType: declaredType,
                            actualType: existingType,
                            expectedFormula: true,
                            actualFormula: existingIsFormula
                        });
                        result.skipped.push({ table: tableName, column: colId, reason: 'not-a-formula' });
                    }
                    // Cas 4 : Type incompatible → warning
                    else if (existingType !== declaredType && declaredType) {
                        result.warnings.push({
                            table: tableName,
                            column: colId,
                            issue: 'type-mismatch',
                            expectedType: declaredType,
                            actualType: existingType
                        });
                        result.skipped.push({ table: tableName, column: colId, reason: 'type-mismatch' });
                    }
                    // Cas 5 : Formule personnalisée (différente de celle du schéma) → skipped
                    else if (existingIsFormula && existingFormula && existingFormula !== formula) {
                        result.skipped.push({ table: tableName, column: colId, reason: 'custom-formula' });
                    }
                    // Cas 6 : Tout est conforme → skipped
                    else {
                        result.skipped.push({ table: tableName, column: colId, reason: 'conforme' });
                    }
                }
            }
        }
        
        return result;
    }

    // ========================================================================
    // PASSE 4 — Configuration des Choices et statuts
    // ========================================================================
    
    async function configureChoiceColumns(grist, defaultChoices) {
        var result = { configured: [], skipped: [] };
        
        for (var key in defaultChoices) {
            if (!defaultChoices.hasOwnProperty(key)) continue;
            
            var parts = key.split('.');
            if (parts.length !== 2) continue;
            
            var table = parts[0];
            var column = parts[1];
            var choices = defaultChoices[key];
            
            try {
                var statusList = choices.map(function(v) {
                    return { value: v, label: v, fillColor: '#94a3b8', textColor: '#ffffff' };
                });
                
                var seedResult = await TF.seedStatusChoices(grist, table, column, statusList);
                
                if (seedResult.ok && seedResult.changed) {
                    result.configured.push(key);
                } else if (seedResult.ok && !seedResult.changed) {
                    result.skipped.push({ key: key, reason: seedResult.reason || 'Déjà configuré' });
                } else {
                    result.skipped.push({ key: key, reason: seedResult.error || 'Erreur inconnue' });
                }
            } catch (e) {
                result.skipped.push({ key: key, reason: e.message || String(e) });
            }
        }
        
        return result;
    }

    // ========================================================================
    // PASSE 5 — Configuration des colonnes visibles des références
    // ========================================================================
    
    async function configureAllRefDisplays(grist, specs) {
        log('[GENCI display] Configuration affichage références...');
        
        var result = await TF.setRefDisplayColumns(grist, specs);
        
        if (result.configured && result.configured.length > 0) {
            log('[GENCI display] Configurés: ' + result.configured.length);
        }
        if (result.alreadyCorrect && result.alreadyCorrect.length > 0) {
            log('[GENCI display] Déjà corrects: ' + result.alreadyCorrect.length);
        }
        if (result.skipped && result.skipped.length > 0) {

        }
        if (result.errors && result.errors.length > 0) {
            log('[GENCI display] Erreurs: ' + result.errors.length, result.errors);
        }
        
        return result;
    }

    // Helper : obtient toutes les spécifications de références depuis le schéma
    function getExpectedReferenceSpecs(schema) {
        var specs = [];
        
        for (var tableId in schema.tables) {
            if (!Object.prototype.hasOwnProperty.call(schema.tables, tableId)) {
                continue;
            }
            
            var columns = schema.tables[tableId].columns || [];
            
            for (var i = 0; i < columns.length; i++) {
                var column = columns[i];
                var opts = column.opts || column;
                var type = opts.type || '';
                
                if (/^(Ref|RefList):/.test(type)) {
                    specs.push({
                        table: tableId,
                        column: column.id,
                        expectedType: type,
                        targetTable: getRefTarget(type)
                    });
                }
            }
        }
        
        return specs;
    }
    
    // Helper : charge les colonnes réelles des tables utilisateur
    async function loadActualTableColumns(grist, tableIds) {
        var columnsByTable = {};
        var errors = [];
        
        for (var i = 0; i < tableIds.length; i++) {
            var tableId = tableIds[i];
            
            try {
                var data = await grist.docApi.fetchTable(tableId);
                columnsByTable[tableId] = new Set(Object.keys(data || {}));
            } catch (e) {
                columnsByTable[tableId] = new Set();
                errors.push({
                    table: tableId,
                    error: e.message || String(e)
                });
            }
        }
        
        return {
            columnsByTable: columnsByTable,
            errors: errors
        };
    }

    function isEmptyListValue(value) {
        return Array.isArray(value) && (
            value.length === 0 ||
            (value.length === 1 && value[0] === 'L')
        );
    }

    function isDefaultColumnValue(value, type) {
        var normalizedType = String(type || 'Any');
        if (value == null || value === '') return true;
        if (isEmptyListValue(value)) return true;
        if (normalizedType === 'Bool') return value === false || value === 0;
        if (normalizedType === 'Int' || normalizedType === 'Numeric') return value === 0;
        if (/^Ref:/.test(normalizedType)) return value === 0;
        return false;
    }

    function comparableColumnValue(value) {
        if (isEmptyListValue(value)) return '[]';
        if (Array.isArray(value)) return JSON.stringify(value);
        if (value && typeof value === 'object') return JSON.stringify(value);
        if (value == null) return '';
        return String(value);
    }

    // Audit strictement en lecture seule des colonnes suffixées créées par erreur.
    // Une valeur Grist « non vide » n'est pas forcément une donnée métier : Numeric,
    // Bool et Ref sont notamment matérialisés par 0/false, et les formules ont un
    // résultat sur chaque ligne. L'audit distingue donc les valeurs par défaut,
    // les formules équivalentes et les divergences réelles.
    async function auditDuplicateColumns(grist) {
        var duplicates = [];
        var errors = [];

        var metadata = null;

        try {
            metadata = await loadSchemaMetadata(grist);
        } catch (metadataError) {
            errors.push({ table: '_grist_Tables_column', error: metadataError.message || String(metadataError) });
        }

        for (var i = 0; i < SCHEMA.tableOrder.length; i++) {
            var tableId = SCHEMA.tableOrder[i];
            var tableDef = SCHEMA.tables[tableId];
            if (!tableDef) continue;

            try {
                var data = await grist.docApi.fetchTable(tableId);
                var actualColumns = Object.keys(data || {});
                var canonicalIds = (tableDef.columns || []).map(function (column) { return column.id; });

                for (var j = 0; j < canonicalIds.length; j++) {
                    var canonicalId = canonicalIds[j];
                    var escaped = canonicalId.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                    var pattern = new RegExp('^' + escaped + '[0-9]+$');

                    for (var k = 0; k < actualColumns.length; k++) {
                        var columnId = actualColumns[k];
                        if (!pattern.test(columnId)) continue;
                        var values = Array.isArray(data[columnId]) ? data[columnId] : [];
                        var canonicalValues = Array.isArray(data[canonicalId]) ? data[canonicalId] : [];
                        var canonicalMeta = metadata && metadata.columnByKey[tableId + '.' + canonicalId];
                        var duplicateMeta = metadata && metadata.columnByKey[tableId + '.' + columnId];
                        var schemaColumn = (tableDef.columns || []).find(function (column) {
                            return column.id === canonicalId;
                        });
                        var columnType = (duplicateMeta && duplicateMeta.type) ||
                            (canonicalMeta && canonicalMeta.type) ||
                            (schemaColumn && schemaColumn.opts && schemaColumn.opts.type) ||
                            (schemaColumn && schemaColumn.type) ||
                            'Any';
                        var nonEmptyCount = values.filter(function (value) {
                            if (value == null || value === '') return false;
                            if (value === false) return false;
                            if (isEmptyListValue(value)) return false;
                            return true;
                        }).length;
                        var meaningfulCount = values.filter(function (value) {
                            return !isDefaultColumnValue(value, columnType);
                        }).length;
                        var differingFromCanonicalCount = values.filter(function (value, index) {
                            return comparableColumnValue(value) !== comparableColumnValue(canonicalValues[index]);
                        }).length;
                        var canonicalIsFormula = !!(canonicalMeta && canonicalMeta.isFormula);
                        var duplicateIsFormula = !!(duplicateMeta && duplicateMeta.isFormula);
                        var sameFormula = canonicalIsFormula && duplicateIsFormula &&
                            String(canonicalMeta.formula || '').trim() === String(duplicateMeta.formula || '').trim() &&
                            String(canonicalMeta.type || '') === String(duplicateMeta.type || '');
                        var classification;
                        var safeToRemove;

                        if (sameFormula) {
                            classification = 'equivalent-formula';
                            safeToRemove = true;
                        } else if (canonicalIsFormula || duplicateIsFormula) {
                            classification = 'formula-conflict';
                            safeToRemove = false;
                        } else if (meaningfulCount === 0) {
                            classification = 'default-only';
                            safeToRemove = true;
                        } else if (differingFromCanonicalCount === 0) {
                            classification = 'redundant-copy';
                            safeToRemove = true;
                        } else {
                            classification = 'divergent-data';
                            safeToRemove = false;
                        }

                        duplicates.push({
                            table: tableId,
                            canonicalColumn: canonicalId,
                            duplicateColumn: columnId,
                            type: columnType,
                            rowCount: values.length,
                            nonEmptyCount: nonEmptyCount,
                            meaningfulCount: meaningfulCount,
                            differingFromCanonicalCount: differingFromCanonicalCount,
                            formula: duplicateIsFormula,
                            classification: classification,
                            safeToRemove: safeToRemove,
                            // Compatibilité avec les premiers scripts d'audit.
                            empty: meaningfulCount === 0
                        });
                    }
                }
            } catch (error) {
                errors.push({ table: tableId, error: error.message || String(error) });
            }
        }

        return {
            safeToRemoveAll: errors.length === 0 && duplicates.every(function (item) { return item.safeToRemove; }),
            duplicateCount: duplicates.length,
            safeToRemoveCount: duplicates.filter(function (item) { return item.safeToRemove; }).length,
            requiresReviewCount: duplicates.filter(function (item) { return !item.safeToRemove; }).length,
            duplicates: duplicates,
            errors: errors
        };
    }

    // ========================================================================
    // INSPECTION — Vérification complète du schéma
    // ========================================================================
    
    async function inspectGenciSchema(grist, requiredTables, metadataSnapshot) {
        var result = {
            ready: true,
            missingTables: [],
            missingColumns: [],
            metadataPending: [],
            invalidColumnTypes: [],
            invalidRefTargets: [],
            invalidVisibleColumns: [],
            missingFormulaColumns: [],
            duplicateColumns: [],
            corrupted: false
        };
        
        try {
            // Utiliser le snapshot fourni ou charger les métadonnées
            var metadata = metadataSnapshot || await loadSchemaMetadata(grist);
            
            // Vérifier les tables essentielles
            for (var i = 0; i < requiredTables.length; i++) {
                var tableId = requiredTables[i];
                if (!metadata.tableById[tableId]) {
                    result.missingTables.push(tableId);
                    result.ready = false;
                }
            }
            
            // Vérifier TOUTES les références du schéma (pas juste 6)
            var expectedRefs = getExpectedReferenceSpecs(SCHEMA);
            
            // Charger les colonnes réelles des tables pour distinguer absent vs retardé
            var refTableIds = Array.from(new Set(expectedRefs.map(function(ref) {
                return ref.table;
            })));
            
            var actualColumns = await loadActualTableColumns(grist, refTableIds);
            
            for (var j = 0; j < expectedRefs.length; j++) {
                var ref = expectedRefs[j];
                var key = ref.table + '.' + ref.column;
                var metadataCol = metadata.columnByKey[key];
                var actualTableCols = actualColumns.columnsByTable[ref.table];
                var existsInTable = actualTableCols && actualTableCols.has(ref.column);
                
                // Cas 1 : Colonne absente des métadonnées ET de la table réelle
                if (!metadataCol && !existsInTable) {
                    result.missingColumns.push(key);
                    result.ready = false;
                    continue;
                }
                
                // Cas 2 : Colonne présente dans la table mais absente des métadonnées (retard)
                if (!metadataCol && existsInTable) {
                    result.metadataPending.push(key);
                    // Ne pas mettre ready = false, c'est temporaire
                    continue;
                }
                
                // Cas 3 : Colonne présente dans les métadonnées, vérifier le type
                if (metadataCol.type !== ref.expectedType) {
                    result.invalidColumnTypes.push({
                        column: key,
                        expected: ref.expectedType,
                        actual: metadataCol.type
                    });
                    result.ready = false;
                    
                    // Vérifier si la table cible existe
                    var targetType = ref.targetTable;
                    if (!metadata.tableById[targetType]) {
                        result.invalidRefTargets.push({
                            column: key,
                            expectedTarget: targetType
                        });
                    }
                }
            }
            
            // Vérifier les visibleCol sur TOUTES les références de SCHEMA.referenceDisplays
            var refDisplaySpecs = SCHEMA.referenceDisplays || [];
            
            for (var k = 0; k < refDisplaySpecs.length; k++) {
                var spec = refDisplaySpecs[k];
                var specKey = spec.table + '.' + spec.column;
                var specCol = metadata.columnByKey[specKey];
                
                if (!specCol) {
                    // Référence absente des métadonnées
                    if (!result.metadataPending.includes(specKey)) {
                        result.metadataPending.push(specKey);
                    }
                    continue;
                }
                
                var targetTable = getRefTarget(specCol.type);
                if (targetTable) {
                    var visColKey = targetTable + '.' + spec.visibleColId;
                    var visCol = metadata.columnByKey[visColKey];
                    
                    if (visCol) {
                        // Vérification stricte du visibleCol
                        if (Number(specCol.visibleCol) !== Number(visCol.id)) {
                            result.invalidVisibleColumns.push({
                                column: specKey,
                                expected: visCol.id,
                                actual: specCol.visibleCol
                            });
                            result.ready = false;
                        }
                    }
                }
            }
            
            // ====================================================================
            // DETECTION DES COLONNES DUPLIQUEES (CORRUPTION)
            // ====================================================================
            // Pour chaque table du schéma, vérifier les colonnes qui correspondent
            // au pattern ^<canonical>[0-9]+$ pour détecter les duplications
            for (var tableIdx = 0; tableIdx < SCHEMA.tableOrder.length; tableIdx++) {
                var tableId = SCHEMA.tableOrder[tableIdx];
                var tableDef = SCHEMA.tables[tableId];
                
                if (!tableDef || !metadata.tableById[tableId]) {
                    continue;
                }
                
                // Obtenir toutes les colonnes de cette table depuis les métadonnées
                var tableColumns = metadata.columns.filter(function(col) {
                    var parentTable = metadata.tables.find(function(t) { 
                        return sameRecordId(t.id, col.parentId);                    });
                    return parentTable && parentTable.tableId === tableId;
                });
                
                // Pour chaque colonne canonique du schéma
                for (var colIdx = 0; colIdx < tableDef.columns.length; colIdx++) {
                    var canonicalCol = tableDef.columns[colIdx];
                    var canonicalId = canonicalCol.id;
                    
                    // Échapper l'identifiant canonique pour la RegExp
                    var escapedCanonical = canonicalId.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                    var duplicatePattern = new RegExp('^' + escapedCanonical + '[0-9]+$');
                    
                    // Trouver les duplications
                    var duplicates = tableColumns.filter(function(col) {
                        return duplicatePattern.test(col.colId);
                    }).map(function(col) {
                        return col.colId;
                    });
                    
                    if (duplicates.length > 0) {
                        result.duplicateColumns.push({
                            table: tableId,
                            canonicalColumn: canonicalId,
                            duplicates: duplicates
                        });
                    }
                }
            }
            
            // Marquer comme corrompu si des duplications sont trouvées
            if (result.duplicateColumns.length > 0) {
                result.corrupted = true;
            }
            
        } catch (e) {
            result.error = e.message || String(e);
            result.ready = false;
        }
        
        return result;
    }

    // Helper : extrait l'ID d'un enregistrement créé
    function getAddedRecordId(actionResult, label) {
        var value = Array.isArray(actionResult)
            ? actionResult[0]
            : actionResult;

        if (typeof value === 'number' && Number.isFinite(value)) {
            return value;
        }

        if (
            value &&
            typeof value === 'object' &&
            typeof value.id === 'number'
        ) {
            return value.id;
        }

        throw new Error(
            'ID de ligne introuvable après AddRecord' +
            (label ? ' (' + label + ')' : '') +
            ': ' + JSON.stringify(actionResult)
        );
    }

    // ========================================================================
    // SEED — Données de démonstration (UNIQUEMENT si tables vides)
    // ========================================================================
    
    async function seedInitialData(grist, context) {
        var seedEntries = [];
        context = context || {};
        
        try {
            // Vérifier si Tasks est vide
            var tasksData = await grist.docApi.fetchTable('Tasks');
            var tasksCount = (tasksData && tasksData.id && tasksData.id.length) || 0;
            
            if (tasksCount > 0) {
                log('[GENCI seed] Tables non vides (' + tasksCount + ' tasks) — seed ignoré');
                return { seeded: false, reason: 'Tables non vides' };
            }
            
            log('[GENCI seed] Tables vides — création données de démonstration...');
            
            // Créer les données dans l'ordre de dépendance
            var createdIds = {};
            
            // 1. Entités
            if (context.tablesCreated && context.tablesCreated.indexOf('Entites') !== -1) {
                var entiteRacine = await grist.docApi.applyUserActions([
                    ['AddRecord', 'Entites', null, { nom: 'Direction', niveau: 'direction', actif: true }]
                ]);
                createdIds.Entites = { racine: getAddedRecordId(entiteRacine, 'Entites.Direction') };
                
                var entiteDev = await grist.docApi.applyUserActions([
                    ['AddRecord', 'Entites', null, { nom: 'Développement', parent: createdIds.Entites.racine, niveau: 'service', actif: true }]
                ]);
                createdIds.Entites.dev = getAddedRecordId(entiteDev, 'Entites.Développement');
                
                seedEntries.push('Créé: Entités (2)');
            }
            
            // 2. Team
            if (context.tablesCreated && context.tablesCreated.indexOf('Team') !== -1) {
                var member1 = await grist.docApi.applyUserActions([
                    ['AddRecord', 'Team', null, { nom: 'Alice Martin', role: 'chef_de_projet', actif: true }]
                ]);
                createdIds.Team = { alice: getAddedRecordId(member1, 'Team.Alice') };
                
                var member2 = await grist.docApi.applyUserActions([
                    ['AddRecord', 'Team', null, { nom: 'Bob Durant', role: 'membre', actif: true }]
                ]);
                createdIds.Team.bob = getAddedRecordId(member2, 'Team.Bob');
                
                // Mettre à jour les références
                if (createdIds.Entites && createdIds.Entites.dev) {
                    await grist.docApi.applyUserActions([
                        ['UpdateRecord', 'Team', createdIds.Team.alice, { entite: createdIds.Entites.dev }],
                        ['UpdateRecord', 'Team', createdIds.Team.bob, { entite: createdIds.Entites.dev, responsable: createdIds.Team.alice }]
                    ]);
                }
                
                seedEntries.push('Créé: Team (2)');
            }
            
            // 3. Programmes
            if (context.tablesCreated && context.tablesCreated.indexOf('Programmes') !== -1) {
                var programme = await grist.docApi.applyUserActions([
                    ['AddRecord', 'Programmes', null, { nom: 'Transformation Digitale', couleur: '#4f46e5', actif: true }]
                ]);
                createdIds.Programmes = { digital: getAddedRecordId(programme, 'Programmes.Transformation') };
                seedEntries.push('Créé: Programmes (1)');
            }
            
            // 4. Competences
            if (context.tablesCreated && context.tablesCreated.indexOf('Competences') !== -1) {
                await grist.docApi.applyUserActions([
                    ['AddRecord', 'Competences', null, { nom: 'JavaScript', categorie: 'technique', actif: true }],
                    ['AddRecord', 'Competences', null, { nom: 'Python', categorie: 'technique', actif: true }],
                    ['AddRecord', 'Competences', null, { nom: 'Gestion de projet', categorie: 'fonctionnel', actif: true }]
                ]);
                seedEntries.push('Créé: Competences (3)');
            }
            
            // 5. KanbanSteps
            if (context.tablesCreated && context.tablesCreated.indexOf('KanbanSteps') !== -1) {
                await grist.docApi.applyUserActions([
                    ['AddRecord', 'KanbanSteps', null, { nom: 'À faire', valeur: 'todo', couleur: '#94a3b8', ordre: 0, actif: true }],
                    ['AddRecord', 'KanbanSteps', null, { nom: 'En cours', valeur: 'inprogress', couleur: '#f59e0b', ordre: 1, actif: true }],
                    ['AddRecord', 'KanbanSteps', null, { nom: 'En revue', valeur: 'review', couleur: '#3b82f6', ordre: 2, actif: true }],
                    ['AddRecord', 'KanbanSteps', null, { nom: 'Terminé', valeur: 'done', couleur: '#10b981', ordre: 3, actif: true }]
                ]);
                seedEntries.push('Créé: KanbanSteps (4)');
            }
            
            return { seeded: true, ids: createdIds, log: seedEntries };
            
        } catch (e) {
            log('[GENCI seed] Erreur: ' + (e.message || e));
            return { seeded: false, error: e.message || String(e) };
        }
    }

    // ========================================================================
    // ORCHESTRATEUR PRINCIPAL
    // ========================================================================
    
    async function ensureGenciSchema(grist, options) {
        options = options || {};
        
        // Utiliser les formules et choix centralisés par défaut
        var formulasMap = options.formulasMap || SCHEMA.formulas || {};
        var defaultChoices = options.defaultChoices || SCHEMA.defaultChoices || {};
        
        // Sérialise les appels dans une même iframe
        if (bootstrapPromise) {
            return bootstrapPromise;
        }
        
        if (bootstrapComplete && !options.force) {
            return Promise.resolve({ success: true, alreadyComplete: true });
        }
        
        bootstrapPromise = (async function () {
            var startTime = Date.now();
            var globalLog = [];
            var result = {
                success: false,
                phases: {},
                errors: [],
                warnings: []
            };
            
            try {
                log('Démarrage initialisation...');
                
                // Phase 0 : Inspection et détection du type de document
                log('Phase 0: Inspection...');
                var migrationLog = await migrateLegacyTables(grist);
                globalLog = globalLog.concat(migrationLog);
                
                // Inspection des tables existantes
                var tablesData = await grist.docApi.fetchTable('_grist_Tables');
