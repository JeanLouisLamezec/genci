        // ═══════════════════════════════════════════════════════════════════════
        // FIELD HANDLERS
        // ═══════════════════════════════════════════════════════════════════════
        function getTaskChargeValidation(data) {
            if (!data || data.type !== 'tache') return { ok: true, missingMemberIds: [] };
            return GanttTaskPanelRules.validatePositiveCharges(data.assignees, data.charges);
        }
        function getChargeValidationMessage(validation) {
            const names = (validation.missingMemberIds || []).map(getTeamMemberName).filter(Boolean);
            const suffix = names.length ? ' pour ' + names.join(', ') : '';
            return 'Renseignez une charge supérieure à 0' + suffix + ' avant d\'enregistrer l\'affectation.';
        }
        function updateChargeUnit(memberId, value) {
            if (!panelState.chargeUnits) panelState.chargeUnits = {};
            panelState.chargeUnits[memberId] = GanttTaskPanelRules.normalizeUnit(value);
            renderPanel();
        }
        function updateCharge(memberId, value) {
            const data = panelState.editData; if (!data) return;
            if (!Array.isArray(data.charges)) data.charges = [];
            const unit = GanttTaskPanelRules.normalizeUnit(panelState.chargeUnits && panelState.chargeUnits[memberId]);
            const h = GanttTaskPanelRules.displayValueToHours(value, unit);
            const existing = data.charges.find(c => c.teamId === memberId);
            if (existing) existing.heures = h; else data.charges.push({ teamId: memberId, heures: h });
            const validation = getTaskChargeValidation(data);
            if (!validation.ok) {
                renderPanel();
                return;
            }
            syncLocalTask(); if (!panelState.isNew && gristReady) saveTaskToGrist(); renderPanel();
        }
        function updateAssignmentMode(memberId, value) {
            const data = panelState.editData; if (!data) return;
            if (value !== 'uniforme' && value !== 'ponctuel') {
                console.warn('[Gantt] Mode invalide:', value);
                showToast('Mode invalide (utilisez "Régulier" ou "Ponctuel")', 'error');
                return;
            }
            if (!panelState.assignmentModes) panelState.assignmentModes = {};
            panelState.assignmentModes[memberId] = value;
            syncLocalTask();
            if (!panelState.isNew && gristReady) saveTaskToGrist();
            renderPanel();
        }
        function updateField(field, value, noSave) {
            const data = panelState.editData;
            if (!data) return;

            if (field === 'dateDebut' || field === 'dateEcheance') {
                value = value ? dateToGrist(new Date(value)) : null;
            }
            // dateCloture auto : posee au statut terminal, effacee si reouverture
            if (field === 'statut') { const _wasT = TF.isTerminal(statusCfg, data.statut), _nowT = TF.isTerminal(statusCfg, value); if (_nowT && !_wasT) data.dateCloture = Math.floor(Date.now() / 1000); else if (!_nowT && _wasT) data.dateCloture = null; }

            data[field] = value;

            if (field === 'projet') {
                if (data.parentTask) {
                    const parent = tasks.find(function(task) { return task.id === data.parentTask; });
                    if (!parent || !GanttTaskPanelRules.sameProject(parent.projet, value)) {
                        data.parentTask = null;
                        showToast('Parent retiré : il appartient à un autre projet.', 'info');
                    }
                }
                const previousDependencyCount = (data.dependDe || []).length;
                data.dependDe = (data.dependDe || []).filter(function(dependencyId) {
                    const dependency = tasks.find(function(task) { return task.id === dependencyId; });
                    return dependency && GanttTaskPanelRules.sameProject(dependency.projet, value);
                });
                if (data.dependDe.length !== previousDependencyCount) {
                    showToast('Dépendances hors projet retirées.', 'info');
                }
            }

            if (field === 'type' && value === 'jalon' && data.dateDebut) {
                data.dateEcheance = data.dateDebut;
            }

            // FIX: Synchroniser le task local pour affichage immédiat
            syncLocalTask();

            const visualFields = ['type', 'priorite', 'statut', 'projet', 'progression', 'dateDebut', 'dateEcheance', 'couleur', 'parentTask'];
            if (visualFields.includes(field)) {
                renderPanel();
                if (!panelState.isNew) render();
            }

            if (field === 'titre' && panelState.isNew) {
                const btn = document.querySelector('.panel-footer .panel-btn.success');
                if (btn) btn.disabled = !value || !value.trim() || !validateTaskDateConstraints(data).ok || !getTaskChargeValidation(data).ok;
            }

            if (!panelState.isNew && !noSave && gristReady) saveTaskToGrist();
        }

        function setProgressPreset(value) {
            const data = panelState.editData;
            if (!data) return;
            data.progression = value;
            syncLocalTask();

            const slider = document.querySelector('.progress-slider');
            const valueSpan = document.getElementById('progressValue');
            const barFill = document.getElementById('progressBarFill');
            if (slider) slider.value = value;
            if (valueSpan) valueSpan.textContent = value + '%';
            if (barFill) barFill.style.width = value + '%';
            document.querySelectorAll('.progress-preset').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.textContent) === value);
            });
            if (!panelState.isNew && gristReady) saveTaskToGrist();
            render();
        }

        function setTodayDate() {
            const data = panelState.editData;
            if (!data) return;
            const today = new Date();
            today.setHours(12, 0, 0, 0);
            data.dateDebut = dateToGrist(today);
            if (data.type === 'jalon') data.dateEcheance = data.dateDebut;
            syncLocalTask();
            if (!panelState.isNew && gristReady) saveTaskToGrist();
            renderPanel();
            render();
        }

        // Subtasks/Checklist
        function getSubtasks(task) {
            if (!task?.subtasks) return [];
            try { return JSON.parse(task.subtasks); } catch (e) { return []; }
        }
        function subtasksToJson(subtasks) {
            return JSON.stringify(subtasks || []);
        }
        function addSubtask() {
            const input = document.getElementById('newSubtaskInput');
            const text = input?.value?.trim();
            if (!text) return;
            const data = panelState.editData;
            if (!data.subtasks) data.subtasks = [];
            data.subtasks.push({ id: Date.now(), text: text, done: false });
            input.value = '';
            updateSubtaskProgress();
            if (!panelState.isNew && gristReady) saveTaskToGrist();
            renderPanel();
            render();
        }
        function toggleSubtask(id) {
            const data = panelState.editData;
            if (!data.subtasks) return;
            const st = data.subtasks.find(s => s.id === id);
            if (st) {
                st.done = !st.done;
                updateSubtaskProgress();
                if (!panelState.isNew && gristReady) saveTaskToGrist();
                renderPanel();
                render();
            }
        }
        function removeSubtask(id) {
            const data = panelState.editData;
            if (!data.subtasks) return;
            const idx = data.subtasks.findIndex(s => s.id === id);
            if (idx !== -1) {
                data.subtasks.splice(idx, 1);
                updateSubtaskProgress();
                if (!panelState.isNew && gristReady) saveTaskToGrist();
                renderPanel();
                render();
            }
        }
        // Édite le texte d'un item de checklist (pas de renderPanel -> garde le focus dans l'input)
        function editSubtask(id, value) {
            const data = panelState.editData;
            if (!data || !data.subtasks) return;
            const st = data.subtasks.find(s => s.id === id);
            if (!st) return;
            const t = (value || '').trim();
            if (!t || t === st.text) return;
            st.text = t;
            if (!panelState.isNew && gristReady) saveTaskToGrist();
            render();
        }
        function updateSubtaskProgress() {
            const data = panelState.editData;
            if (!data.subtasks || data.subtasks.length === 0) return;
            const done = data.subtasks.filter(s => s.done).length;
            const total = data.subtasks.length;
            data.progression = Math.round((done / total) * 100);
            syncLocalTask();
        }
        function handleSubtaskKeydown(e) {
            if (e.key === 'Enter') { e.preventDefault(); addSubtask(); }
        }

        function toggleMultiSelect(id) {
            const el = document.getElementById(id);
            document.querySelectorAll('.multi-select').forEach(s => { if (s.id !== id) s.classList.remove('open'); });
            el.classList.toggle('open');
        }

        function toggleAssignee(id) {
            const data = panelState.editData;
            const idx = data.assignees.indexOf(id);
            if (idx !== -1) {
                removeAssignee(id);
                return;
            }
            data.assignees.push(id);
            if (!panelState.chargeUnits) panelState.chargeUnits = {};
            panelState.chargeUnits[id] = 'j';
            if (!panelState.assignmentModes) panelState.assignmentModes = {};
            panelState.assignmentModes[id] = panelState.assignmentModes[id] || 'uniforme';
            const validation = getTaskChargeValidation(data);
            if (validation.ok) {
                syncLocalTask();
                if (!panelState.isNew && gristReady) saveTaskToGrist();
            }
            renderPanel();
            render();
        }

        function removeAssignee(id) {
            const data = panelState.editData;
            const idx = data.assignees.indexOf(id);
            if (idx !== -1) {
                data.assignees.splice(idx, 1);
                data.charges = (data.charges || []).filter(function(charge) { return charge.teamId !== id; });
                if (panelState.chargeUnits) delete panelState.chargeUnits[id];
                if (panelState.assignmentModes) delete panelState.assignmentModes[id];
                syncLocalTask();  // FIX
                if (!panelState.isNew && gristReady) saveTaskToGrist();
                renderPanel();
                render();
            }
        }

        function toggleDependency(id) {
            const data = panelState.editData;
            const dependency = tasks.find(function(task) { return task.id === id; });
            if (!dependency || !GanttTaskPanelRules.sameProject(dependency.projet, data.projet)) {
                showToast('Dépendance impossible : sélectionnez une tâche du même projet.', 'error');
                return;
            }
            const idx = data.dependDe.indexOf(id);
            if (idx === -1) data.dependDe.push(id);
            else data.dependDe.splice(idx, 1);
            syncLocalTask();  // FIX
            if (!panelState.isNew && gristReady) saveTaskToGrist();
            renderPanel();
            render();

        function removeDependency(id) {
            const data = panelState.editData;
            const idx = data.dependDe.indexOf(id);
            if (idx !== -1) {
                data.dependDe.splice(idx, 1);
                syncLocalTask();  // FIX
                if (!panelState.isNew && gristReady) saveTaskToGrist();
                renderPanel();
                render();
            }
        }

        function handleTagKeydown(e) {
            const data = panelState.editData;
            if (e.key === 'Enter' || e.key === ',') {
                e.preventDefault();
                const tag = e.target.value.trim().replace(/^#/, '');
                if (tag && !data.tags.includes(tag)) {
                    data.tags.push(tag);
                    e.target.value = '';
                    syncLocalTask();  // FIX
                    if (!panelState.isNew && gristReady) saveTaskToGrist();
                    renderPanel();
                }
            } else if (e.key === 'Backspace' && !e.target.value && data.tags.length) {
                data.tags.pop();
                syncLocalTask();  // FIX
                if (!panelState.isNew && gristReady) saveTaskToGrist();
                renderPanel();
            }
        }

        function removeTag(tag) {
            const data = panelState.editData;
            const idx = data.tags.indexOf(tag);
            if (idx !== -1) {
                data.tags.splice(idx, 1);
                syncLocalTask();  // FIX
                if (!panelState.isNew && gristReady) saveTaskToGrist();

        function showDeleteConfirm() { document.getElementById('deleteConfirm').classList.add('visible'); }
        function hideDeleteConfirm() { document.getElementById('deleteConfirm').classList.remove('visible'); }

        // ═══════════════════════════════════════════════════════════════════════
        // SAVE OPERATIONS
        // ═══════════════════════════════════════════════════════════════════════
        async function saveTaskToGrist() {
            const data = panelState.editData;
            if (!data || panelState.isNew || !gristReady) return;
            // `syncLocalTask()` met à jour `tasks` avant la sauvegarde. Reconstruire
            // ici le contexte avec le snapshot original évite de comparer la
            // proposition avec elle-même et garantit le contrôle des dates.
            const validationTasks = tasks.map(task => task.id === panelState.taskId
                ? { ...task, ...(panelState.originalTask || {}), id: panelState.taskId }
                : task);
            const dateValidation = validateTaskDateConstraints(
                { ...data, id: panelState.taskId },
                validationTasks
            );
            if (!dateValidation.ok) {
                showToast('Modification impossible : ' + dateValidation.message, 'error');
                return;
            }

            const taskId = panelState.taskId;
            const saveData = cloneEditableTaskData(data);
            const originalData = cloneEditableTaskData(panelState.originalTask || {});
            const chargeValidation = getTaskChargeValidation(saveData);
            if (!chargeValidation.ok) {
                renderPanel();
                return;
            }

            function normalizeDate(dateInput) {
                if (dateInput == null) return null;
                if (typeof dateInput === 'number') {
                    return Math.floor(dateInput);
                }
                if (dateInput instanceof Date) {
                    return Math.floor(dateInput.getTime() / 1000);
                }
                if (typeof dateInput === 'string') {
                    var d = new Date(dateInput);
                    if (!isNaN(d.getTime())) {
                        return Math.floor(d.getTime() / 1000);
                    }
                }
                return null;
            }

            function normalizeAssigneeIds(value) {
                if (!Array.isArray(value)) return [];
                return value
                    .filter(function(v) { return v !== 'L'; })
                    .map(function(v) { return Number(v); })
                    .filter(function(v) { return Number.isInteger(v) && v > 0; })
                    .sort(function(a, b) { return a - b; });
            }

            function normalizeChargesValue(charges) {
                if (!charges) return [];
                var chargesArray = charges;
                if (typeof charges === 'string') {
                    try {
                        chargesArray = JSON.parse(charges);
                    } catch (e) {
                        return [];
                    }
                }
                if (!Array.isArray(chargesArray)) return [];
                return chargesArray
                    .map(function(c) {
                        return {
                            teamId: Number(c.teamId || 0),
                            heures: Number(c.heures || 0)
                        };
                    })
                    .filter(function(c) { return c.teamId > 0; })
                    .sort(function(a, b) { return a.teamId - b.teamId; });
            }

            function arraysEqual(a, b) {
                if (a.length !== b.length) return false;
                for (var i = 0; i < a.length; i++) {
                    if (a[i] !== b[i]) return false;
                }
                return true;
            }

            const datesChanged =
                normalizeDate(saveData.dateDebut) !== normalizeDate(originalData.dateDebut) ||
                normalizeDate(saveData.dateEcheance) !== normalizeDate(originalData.dateEcheance);

            const assigneesChanged = !arraysEqual(
                normalizeAssigneeIds(saveData.assignees),
                normalizeAssigneeIds(originalData.assignees)
            );

            const chargesChanged = JSON.stringify(normalizeChargesValue(saveData.charges)) !== JSON.stringify(normalizeChargesValue(originalData.charges));

            // LOT B2 : Détecter le changement de mode de répartition PAR MEMBRE
            var currentModesResult = normalizeAssignmentModes(panelState.assignmentModes, normalizeAssigneeIds(saveData.assignees));
            var originalModesResult = normalizeAssignmentModes(panelState.originalAssignmentModes, normalizeAssigneeIds(originalData.assignees));

            // Validation fail-closed : bloquer si mode invalide
            if (!currentModesResult.ok) {
                console.error('[Gantt] Modes invalides:', currentModesResult.errors);
                showToast('Mode de répartition invalide (utilisez "Régulier" ou "Ponctuel")', 'error');
                return;
            }

            var currentAssignmentModes = currentModesResult.modes;
            var originalAssignmentModes = originalModesResult.modes;
            const modeChanged = !assignmentModesEqual(panelState.assignmentModes, panelState.originalAssignmentModes, normalizeAssigneeIds(saveData.assignees));

            console.info('[Gantt date sync decision]', {
                taskId: taskId,
                originalDates: {
                    dateDebut: originalData.dateDebut,
                    dateEcheance: originalData.dateEcheance
                },
                newDates: {
                    dateDebut: saveData.dateDebut,
                    dateEcheance: saveData.dateEcheance
                },
                datesChanged: datesChanged,
                assigneesChanged: assigneesChanged,
                chargesChanged: chargesChanged,
                modeChanged: modeChanged
            });

            const record = {
                titre: saveData.titre, description: saveData.description, type: saveData.type, priorite: saveData.priorite,
                statut: saveData.statut, progression: saveData.progression, dateDebut: saveData.dateDebut, dateEcheance: saveData.dateEcheance,
                projet: saveData.projet, assignees: toGristRefList(saveData.assignees), dependDe: toGristRefList(saveData.dependDe),
                tags: toGristChoiceList(saveData.tags), estimationH: saveData.estimationH, tempsPasse: saveData.tempsPasse,
                subtasks: subtasksToJson(saveData.subtasks), couleur: saveData.couleur || null,
                parentTask: saveData.parentTask || null,
                charges: TF.chargesToJson((saveData.charges || []).filter(c => saveData.assignees.includes(c.teamId))), dateCloture: saveData.dateCloture || null
            };

            try {
                var assignmentSyncSuccess = true;
                var syncErrorMessage = null;
                var syncResult = null;
                
                // PHASE A.11 : PRÉCONTRÔLE AVANT TOUTE ÉCRITURE
                // Si des affectations/modes changent, on précontrôle AVANT d'écrire dans Tasks
                if (assignmentIntegration && (assigneesChanged || chargesChanged || modeChanged)) {
                    console.info('[Gantt] Précontrôle affectations pour tâche ' + taskId);
                    var syncData = Object.assign({}, saveData, {
                        assignmentsEdited: true,
                        datesEdited: datesChanged,
                        assignmentModes: currentAssignmentModes
                    });
                    
                    syncResult = await assignmentIntegration.onTaskUpdated(taskId, syncData);
                    
                    if (!syncResult.ok) {
                        console.warn('[Gantt] Précontrôle échoué:', syncResult);
                        assignmentSyncSuccess = false;
                        syncErrorMessage = syncResult.message || syncResult.code;
                        
                        // Messages d'erreur explicites
                        var removalDetails = syncResult.details;
                        if (removalDetails && removalDetails.length > 0) {
                            var blockedMembers = removalDetails.map(function(d) {
                                var member = team.find(m => m.id === d.memberId);
                                return member ? member.nom : 'Membre ' + d.memberId;
                            }).join(', ');
                            var lockedCount = removalDetails.reduce(function(sum, d) {
                                return sum + (d.lockedEntries ? d.lockedEntries.length : 0);
                            }, 0);
                            showToast('Retrait impossible : ' + blockedMembers + ' a des temps protégés (' + lockedCount + ' entrées)', 'error');
                        } else if (syncResult.conflict) {
                            showToast('Conflit de données : impossible de vérifier les temps', 'error');
                        } else {
                            showToast('Modification refusée : ' + syncErrorMessage, 'error');
                        }
                        
                        return; // Zéro écriture
                    }
                }
                
                // Écriture dans Tasks APRÈS précontrôle réussi
                await grist.docApi.applyUserActions([['UpdateRecord', 'Tasks', taskId, pruneTaskRecord(record)]]);
                
                if (assignmentIntegration) {
                    // Si on arrive ici, le précontrôle a déjà été fait si nécessaire
                    if (datesChanged && !assigneesChanged && !chargesChanged && !modeChanged) {
                        console.info('[Gantt] Sync dates uniquement pour tâche ' + taskId);
                        syncResult = await assignmentIntegration.syncTaskDates(taskId, saveData.dateDebut, saveData.dateEcheance);
                    } else if (syncResult && syncResult.ok) {
                        console.info('[Gantt] Sync affectations terminée pour tâche ' + taskId);
                    } else {
                        console.info('[Gantt] Aucun changement affectation/date/mode pour tâche ' + taskId);
                        syncResult = { ok: true, code: 'NO_ASSIGNMENT_CHANGE' };
                    }

                    if (!syncResult.ok) {
                        console.warn('[Gantt] Échec synchronisation affectations:', syncResult);
                        assignmentSyncSuccess = false;
                        syncErrorMessage = syncResult.message || syncResult.code;
                    } else {
                        if (planningService && (datesChanged || assigneesChanged || chargesChanged)) {
                            try {
                                console.log('[Gantt] Replanification après modification');
                                var assignmentsTable = await grist.docApi.fetchTable('TaskAssignments');
                                var memberIds = [];
                                
                                if (assignmentsTable.id) {
                                    for (var i = 0; i < assignmentsTable.id.length; i++) {
                                        if (assignmentsTable.tache[i] === taskId && assignmentsTable.actif[i] !== false) {
                                            var memberId = assignmentsTable.membre[i];
                                            if (memberId && memberIds.indexOf(memberId) < 0) {
                                                memberIds.push(memberId);
                                            }
                                        }
                                    }
                                }
                                
                                // NOTE: La planification automatique est maintenant gérée par
                                // gantt-auto-planning-integration.js après la synchronisation.
                                // Ce bloc a été désactivé pour éviter les doubles appels.
                                /*
                                if (memberIds.length > 0) {
                                    console.log('[Gantt] Replanification membres:', memberIds);
                                    var replanResult = await planningService.replanMembers(memberIds, {
                                        allowPartialPlanning: false
                                    });
                                    console.log('[Gantt] Résultat replanification:', replanResult);
                                }
                                */
                            } catch (e) {
                                console.warn('[Gantt] Erreur replanification:', e);
                            }
                        }
                    }
                }
                
                if (assignmentSyncSuccess) {
                    // LOT B2 : Vérifier la postcondition AVANT d'afficher le succès
                    var verification = await verifyPersistedAssignmentModes(
                        taskId,
                        currentAssignmentModes,
                        normalizeAssigneeIds(saveData.assignees)
                    );

                    if (!verification.ok) {
                        // Échec postcondition — retour immédiat, aucun succès visuel
                        console.warn('[Gantt] Postcondition échouée :', verification);
                        showToast('Impossible de confirmer l\'enregistrement des types de planification', 'error');
                        return;
                    }
                    // Succès — mettre à jour originalAssignmentModes et afficher le message approprié
                    panelState.originalAssignmentModes = { ...currentAssignmentModes };
                    panelState.originalTask = cloneEditableTaskData(saveData);

                    // Messages de succès incluant modeChanged
                    if (syncResult && syncResult.planningResult) {
                        showPlanningResult(syncResult.planningResult);
                    } else if (datesChanged && (assigneesChanged || chargesChanged || modeChanged)) {
                        showToast('Dates et affectations enregistrées', 'success');
                    } else if (datesChanged) {
                        showToast('Dates enregistrées', 'success');
                    } else if (assigneesChanged || chargesChanged || modeChanged) {
                        showToast('Affectations enregistrées', 'success');
                    } else {
                        showToast('Tâche enregistrée', 'success');
                    }

                    showSaveIndicator();
                    const idx = tasks.findIndex(t => t.id === taskId);
                    if (idx !== -1) tasks[idx] = { ...tasks[idx], ...record };
                } else {
                    showToast('Tâche enregistrée, mais échec synchronisation : ' + syncErrorMessage, 'warning');
                }
            } catch (e) {
                console.error(e);
                showToast('Erreur sauvegarde', 'error');
            }
        }

        async function createTask() {
            const data = panelState.editData;
            if (!data || !data.titre || !data.titre.trim()) {
                showToast('Titre requis', 'error');
                return;
            }
            const dateValidation = validateTaskDateConstraints(data);
            if (!dateValidation.ok) {
                showToast('Création impossible : ' + dateValidation.message, 'error');
                return;
            }
            const chargeValidation = getTaskChargeValidation(data);
            if (!chargeValidation.ok) {
                renderPanel();
                return;
            }

            // LOT B2 : Validation fail-closed des modes AVANT création
            var assigneeIds = normalizeAssigneeIds(data.assignees);
            var normalizedModesResult = normalizeAssignmentModes(panelState.assignmentModes, assigneeIds);
            if (!normalizedModesResult.ok) {
                console.warn('[Gantt] Modes invalides détectés avant création:', normalizedModesResult.errors);
                showToast('Modes de répartition invalides : ' + normalizedModesResult.errors.map(function(e) { return 'membre ' + e.memberId + ' (' + e.value + ')'; }).join(', '), 'error');
                return;
            }
            var currentAssignmentModes = normalizedModesResult.modes;

            const record = {
                titre: data.titre, description: data.description || '', type: data.type || 'tache',
                priorite: data.priorite || '3', statut: data.statut || 'todo', progression: data.progression || 0,
                dateDebut: data.dateDebut, dateEcheance: data.dateEcheance, projet: data.projet,
                assignees: toGristRefList(data.assignees), dependDe: toGristRefList(data.dependDe),
                tags: toGristChoiceList(data.tags), estimationH: data.estimationH, tempsPasse: data.tempsPasse,
                subtasks: subtasksToJson(data.subtasks), couleur: data.couleur || null,
                parentTask: data.parentTask || null,
                charges: TF.chargesToJson((data.charges || []).filter(c => data.assignees.includes(c.teamId))), dateCloture: data.dateCloture || null
            };

            if (gristReady) {
                try {
                    // 1. Créer la tâche
                    var createResults = await grist.docApi.applyUserActions([['AddRecord', 'Tasks', null, pruneTaskRecord(record)]]);
                    var taskId = getCreatedRecordId(createResults);
                    
                    console.log('[Gantt] Task créée', {
                        taskId: taskId,
                        createResults: createResults,
                        integrationAvailable: Boolean(assignmentIntegration)
                    });
                    
                    // 2. Vérifier que l'intégration est disponible
                    if (!assignmentIntegration) {
                        throw new Error(
                            'TaskAssignment integration non disponible après création de la tâche ' +
                            taskId
                        );
                    }
                    
                    // 3. Synchroniser les affectations
                    // LOT B2 : Transmettre assignmentModes normalisés
                    var createData = Object.assign({}, data, {
                        assignmentModes: currentAssignmentModes
                    });
                    var syncResult = await assignmentIntegration.onTaskCreated(taskId, createData);
                    console.log('[Gantt] Synchronisation TaskAssignments', syncResult);
                    
                    if (!syncResult.ok) {
                        console.warn('[Gantt] Échec synchronisation affectations:', syncResult);
                        showToast('Tâche créée mais affectations non synchronisées', 'warning');
                        await loadAllData();
                        return;
                    }
                    
                    // 4. LOT B2 : Vérifier la postcondition AVANT toast de succès
                    var verification = await verifyPersistedAssignmentModes(
                        taskId,
                        currentAssignmentModes,
                        assigneeIds
                    );

                    if (!verification.ok) {
                        console.warn('[Gantt] Postcondition échouée après création:', verification);
                        showToast('Impossible de confirmer l\'enregistrement des types de planification', 'error');
                        await loadAllData();
                        return;
                    }

                    // 5. La planification automatique est gérée par onTaskCreated
                    // Utiliser le résultat de la planification si disponible
                    if (syncResult && syncResult.planningResult) {
                        showPlanningResult(syncResult.planningResult);
                    } else {
                        showToast('Tâche et affectations créées', 'success');
                    }
                    closePanel();
                    await loadAllData();
                } catch (e) {
                    console.error(e);
                    showToast('Erreur création', 'error');
                }
            } else {
                record.id = Date.now();
                tasks.push(record);
                sortTasks();
                showToast('Tâche créée', 'success');
                closePanel();
                render();
            }
        }

        async function confirmDelete() {
            if (panelState.isNew || !panelState.taskId) return;

            // WBS-05: si la tâche a des descendants, demander cascade ou détachement
            const descendants = getAllDescendants(panelState.taskId);
            let ids = [panelState.taskId];
            let includeDescendants = false;
            let detachChildren = false;
            
            if (descendants.length) {
                const choice = confirm('Cette tâche contient ' + descendants.length + ' sous-tâche(s).\n\nOK = supprimer tout (cascade)\nAnnuler = détacher les enfants (ils deviennent racines)');
                if (choice) {
                    ids = [panelState.taskId, ...descendants.map(d => d.id)];
                    includeDescendants = true;
                } else {
                    detachChildren = true;
                }
            }

            if (gristReady) {
                try {
                    // FAIL-CLOSED : Utiliser UNIQUEMENT l'intégration pour supprimer avec les données liées
                    if (!assignmentIntegration || !assignmentIntegration.deleteTasksWithAssignments) {
                        showToast('Suppression impossible : service indisponible', 'error');
                        await loadAllData();
                        return;
                    }
                    
                    let result = await assignmentIntegration.deleteTasksWithAssignments([panelState.taskId], {
                        detachChildren: detachChildren,
                        includeDescendants: includeDescendants
                    });
                    
                    // Un administrateur peut supprimer aussi les temps saisis ou
                    // validés, mais uniquement après un avertissement destructif
                    // explicite. L'intégration revérifie elle-même le rôle admin.
                    if (!result.ok && result.code === 'TASK_DELETE_BLOCKED_BY_TIME_ENTRIES') {
                        const actor = permissionRuntime && permissionRuntime.getActor
                            ? permissionRuntime.getActor()
                            : null;
                        if (actor && actor.isAdmin) {
                            const protectedCount = Array.isArray(result.timeEntryIds) ? result.timeEntryIds.length : 0;
                            const confirmed = confirm(
                                'Suppression administrateur\n\n' +
                                protectedCount + ' entrée(s) de temps saisie(s) ou validée(s) seront supprimée(s) définitivement.\n' +
                                'Les feuilles concernées seront modifiées. Continuer ?'
                            );
                            if (!confirmed) {
                                showToast('Suppression annulée', 'info');
                                return;
                            }
                            result = await assignmentIntegration.deleteTasksWithAssignments([panelState.taskId], {
                                detachChildren: detachChildren,
                                includeDescendants: includeDescendants,
                                forceProtectedTimeEntries: true
                            });
                        }
                    }

                    console.log('[Gantt] Suppression TaskAssignments', result);
                    
                    if (!result.ok) {
                        if (result.code === 'TASK_DELETE_BLOCKED_BY_TIME_ENTRIES') {
                            showToast('Suppression impossible : cette tâche contient des temps saisis ou validés', 'error');
                        } else {
                            showToast('La tâche n\'a pas été supprimée : ' + (result.message || 'erreur inconnue'), 'error');
                        }
                        await loadAllData();
                        return;
                    }
                    
                    showToast(ids.length > 1 ? `${result.deletedTasks} tâches et données liées supprimées` : 'Tâche et données liées supprimées', 'success');
                    
                    closePanel();
                    await loadAllData();
                } catch (e) {
                    console.error(e);
                    showToast('Erreur suppression', 'error');
                }
            } else {
                // Mode démo : pas de suppression possible sans service
                showToast('Suppression impossible en mode démo', 'error');
                closePanel();
                render();
            }
        }

        // ═══════════════════════════════════════════════════════════════════════
        // DRAG & DROP
        // ═══════════════════════════════════════════════════════════════════════
        function startDrag(e, bar, type) {
            const id = parseInt(bar.dataset.id);
            const task = tasks.find(t => t.id === id);
            if (!task || isJalon(task)) return;

            // WBS-02: parent autorisé uniquement pour 'move' (resize bloqué car ajusté auto)
            const isParent = hasChildren(task);
            if (isParent && type !== 'move') return;

            e.preventDefault();
            e.stopPropagation();

            // Capturer les descendants pour drag en bloc du parent
            const descendants = isParent ? getAllDescendants(id).map(d => ({
                id: d.id,
                originalStart: gristToDate(d.dateDebut),
                originalEnd: gristToDate(d.dateEcheance)
            })).filter(d => d.originalStart && d.originalEnd) : [];

            dragState = {
                active: true, type: type, taskId: id, startX: e.clientX,
                originalLeft: parseFloat(bar.style.left), originalWidth: parseFloat(bar.style.width),
                originalStart: gristToDate(task.dateDebut), originalEnd: gristToDate(task.dateEcheance),
                descendants: descendants
            };

            bar.style.zIndex = '100';
            bar.style.opacity = '0.8';

            document.addEventListener('mousemove', onDrag);
            document.addEventListener('mouseup', endDrag);
        }

        function onDrag(e) {
            if (!dragState.active) return;

            const pxPerDay = effectivePxPerDay;
            const dx = e.clientX - dragState.startX;
            // Un clic peut dériver de quelques pixels : ne pas le transformer en
            // modification de dates, surtout dans les vues fortement dézoomées.
            if (Math.abs(dx) < 4) return;
            const daysDelta = Math.round(dx / pxPerDay);
            const bar = document.querySelector('.gantt-bar[data-id="' + dragState.taskId + '"]');
            if (!bar) return;

            if (dragState.type === 'move') {
                bar.style.left = (dragState.originalLeft + daysDelta * pxPerDay) + 'px';
            } else if (dragState.type === 'resize-right') {
                const newWidth = Math.max(dragState.originalWidth + daysDelta * pxPerDay, pxPerDay);
                bar.style.width = newWidth + 'px';
            } else if (dragState.type === 'resize-left') {
                const newLeft = dragState.originalLeft + daysDelta * pxPerDay;
                const newWidth = dragState.originalWidth - daysDelta * pxPerDay;
                if (newWidth >= pxPerDay) {
                    bar.style.left = newLeft + 'px';
                    bar.style.width = newWidth + 'px';
                }
            }
        }

        async function endDrag(e) {
            document.removeEventListener('mousemove', onDrag);
            document.removeEventListener('mouseup', endDrag);

            if (!dragState.active) return;

            const bar = document.querySelector('.gantt-bar[data-id="' + dragState.taskId + '"]');
            if (bar) { bar.style.zIndex = ''; bar.style.opacity = ''; }

            const task = tasks.find(t => t.id === dragState.taskId);
            if (!task) { dragState.active = false; return; }

            const pxPerDay = effectivePxPerDay;
            const dx = e.clientX - dragState.startX;
            if (Math.abs(dx) < 4) {
                dragState.active = false;
                return;
            }
            const daysDelta = Math.round(dx / pxPerDay);
            if (daysDelta === 0) {
                dragState.active = false;
                return;
            }

            const originalDates = new Map(tasks.map(t => [t.id, {
                dateDebut: t.dateDebut,
                dateEcheance: t.dateEcheance
            }]));

            let newStart = dragState.originalStart, newEnd = dragState.originalEnd;
            if (dragState.type === 'move') { newStart = addDays(dragState.originalStart, daysDelta); newEnd = addDays(dragState.originalEnd, daysDelta); }
            else if (dragState.type === 'resize-right') newEnd = addDays(dragState.originalEnd, daysDelta);
            else if (dragState.type === 'resize-left') newStart = addDays(dragState.originalStart, daysDelta);

            task.dateDebut = dateToGrist(newStart);
            task.dateEcheance = dateToGrist(newEnd);

            // WBS-02: drag parent en bloc — décaler les descendants du même daysDelta (move uniquement)
            const childUpdates = [];
            if (dragState.type === 'move' && dragState.descendants && dragState.descendants.length) {
                for (const d of dragState.descendants) {
                    const newS = addDays(d.originalStart, daysDelta);
                    const newE = addDays(d.originalEnd, daysDelta);
                    const child = tasks.find(x => x.id === d.id);
                    if (child) { child.dateDebut = dateToGrist(newS); child.dateEcheance = dateToGrist(newE); }
                    childUpdates.push({ id: d.id, dateDebut: dateToGrist(newS), dateEcheance: dateToGrist(newE) });
                }
            }

            // GANTT-06: Propager les changements aux tâches dépendantes
            const cascadeUpdates = propagateDependencyDates(task.id);

            // Valider l'ensemble des mutations locales avant la moindre écriture Grist.
            // Pour un parent déplacé en bloc, les enfants sont contrôlés contre les
            // nouvelles dates du parent déjà présentes dans `tasks`.
            const changedIds = new Set([task.id]);
            childUpdates.forEach(update => changedIds.add(update.id));
            cascadeUpdates.forEach(update => changedIds.add(update.id));
            let dateViolation = null;
            for (const changedId of changedIds) {
                const changedTask = tasks.find(candidate => candidate.id === changedId);
                if (!changedTask) continue;
                const validation = validateTaskDateConstraints(changedTask, tasks, { forceValidation: true });
                if (!validation.ok) {
                    dateViolation = validation;
                    break;
                }
            }
            if (dateViolation) {
                tasks.forEach(candidate => {
                    const original = originalDates.get(candidate.id);
                    if (!original) return;
                    candidate.dateDebut = original.dateDebut;
                    candidate.dateEcheance = original.dateEcheance;
                });
                dragState.active = false;
                showToast('Modification impossible : ' + dateViolation.message, 'error');
                render();
                return;
            }

            if (gristReady) {
                try {
                    const actions = [['UpdateRecord', 'Tasks', task.id, { dateDebut: task.dateDebut, dateEcheance: task.dateEcheance }]];
                    childUpdates.forEach(u => actions.push(['UpdateRecord', 'Tasks', u.id, { dateDebut: u.dateDebut, dateEcheance: u.dateEcheance }]));
                    cascadeUpdates.forEach(u => actions.push(['UpdateRecord', 'Tasks', u.id, { dateDebut: u.dateDebut, dateEcheance: u.dateEcheance }]));
                    await grist.docApi.applyUserActions(actions);

                    // Synchroniser les affectations pour TOUTES les tâches modifiées
                    const extras = childUpdates.length + cascadeUpdates.length;
                    var allSuccess = true;
                    var syncErrors = [];
                    var tasksSynced = [];
                    var planningResults = [];
                    var planningCommitted = false;
                    
                    if (assignmentIntegration) {
                        try {
                            // Tâche principale
                            var mainResult = await assignmentIntegration.syncTaskDates(task.id, task.dateDebut, task.dateEcheance);
                            if (!mainResult.ok) {
                                allSuccess = false;
                                syncErrors.push('Tâche principale: ' + (mainResult.message || 'échec'));
                            } else {
                                tasksSynced.push(task.id);
                                if (mainResult.planningResult) {
                                    planningResults.push(mainResult.planningResult);
                                }
                            }
                            
                            // Tâches enfants déplacées
                            for (const child of childUpdates) {
                                var childResult = await assignmentIntegration.syncTaskDates(child.id, child.dateDebut, child.dateEcheance);
                                if (!childResult.ok) {
                                    allSuccess = false;
                                    syncErrors.push('Enfant ' + child.id + ': ' + (childResult.message || 'échec'));
                                } else {
                                    tasksSynced.push(child.id);
                                    if (childResult.planningResult) {
                                        planningResults.push(childResult.planningResult);
                                    }
                                }
                            }
                            
                            // Tâches dépendantes
                            for (const dep of cascadeUpdates) {
                                var depResult = await assignmentIntegration.syncTaskDates(dep.id, dep.dateDebut, dep.dateEcheance);
                                if (!depResult.ok) {
                                    allSuccess = false;
                                    syncErrors.push('Dépendante ' + dep.id + ': ' + (depResult.message || 'échec'));
                                } else {
                                    tasksSynced.push(dep.id);
                                    if (depResult.planningResult) {
                                        planningResults.push(depResult.planningResult);
                                    }
                                }
                            }
                            
                            // Vérifier les résultats de planification
                            var problematicResult = planningResults.find(function(result) {
                                return result.success === false || 
                                       (result.blockedMemberIds && result.blockedMemberIds.length > 0);
                            });
                            
                            if (problematicResult) {
                                allSuccess = false;
                                syncErrors.push(problematicResult.code || 'Échec de la planification automatique');
                                showPlanningResult(problematicResult);
                            } else if (planningResults.length > 0) {
                                planningCommitted = planningResults.some(function(r) {
                                    return r.summary && r.summary.committed > 0;
                                });
                            }
                        } catch (syncErr) {
                            allSuccess = false;
                            syncErrors.push('Erreur synchronisation: ' + syncErr.message);
                        }
                    }
                    
                    // Afficher le bon message selon le résultat
                    if (allSuccess) {
                        const successLabel = planningCommitted
                            ? 'Dates, affectations et planning mis à jour'
                            : 'Dates et affectations mises à jour';
                        showToast(extras > 0 ? `${successLabel} (+${extras} tâches liées)` : successLabel, 'success');
                    } else {
                        console.warn('[Gantt] Échec partiel synchronisation:', syncErrors);
                        showToast('Dates mises à jour, mais échec synchronisation affectations', 'warning');
                    }
                } catch (err) {
                    // Le garde de permissions bloque avant l'écriture Grist. Le
                    // modèle local ayant déjà été déplacé pour le preview, il
                    // faut le restaurer immédiatement pour ne jamais afficher
                    // une modification refusée comme si elle avait réussi.
                    tasks.forEach(candidate => {
                        const original = originalDates.get(candidate.id);
                        if (!original) return;
                        candidate.dateDebut = original.dateDebut;
                        candidate.dateEcheance = original.dateEcheance;
                    });
                    if (!err || !err.tfPermissionDenied) {
                        showToast('Erreur de mise à jour : ' + ((err && err.message) || 'erreur inconnue'), 'error');
                    }
                }
            }

            dragState.active = false;
            render();
        }

        // Helper robuste pour extraire l'ID d'un enregistrement créé
        function getCreatedRecordId(result, actionIndex = 0) {
            // Format Grist standard : { retValues: [ID] }
            if (result && Array.isArray(result.retValues)) {
                const value = result.retValues[actionIndex];
                if (Number.isInteger(value) && value > 0) {
                    return value;
                }
            }
            
            // Compatibilité avec certains mocks ou wrappers
            if (Array.isArray(result)) {
                const value = result[actionIndex];
                if (Number.isInteger(value) && value > 0) {
                    return value;
                }
            }
            
            // Résultat direct (rare)
            if (Number.isInteger(result) && result > 0) {
                return result;
            }
            
            // Objet avec .id
            if (result && Number.isInteger(result.id) && result.id > 0) {
                return result.id;
            }
            
            throw new Error(
                'Impossible de récupérer l\'ID créé : ' +
                JSON.stringify(result)
            );
        }
        
        function convert(data) {
            if (!data || Array.isArray(data)) return data || [];
            const cols = Object.keys(data);
            if (!cols.length) return [];
            const n = data[cols[0]]?.length || 0;
            const r = [];
            for (let i = 0; i < n; i++) { const rec = {}; cols.forEach(c => rec[c] = data[c][i]); r.push(rec); }
            return r;
        }

        async function loadAllData() {
            const generation = ++loadGeneration;
            const loadStart = performance.now();
            console.log('[Gantt data] loadAllData started', { generation, appMode: appMode });
            
            // Helper pour fetch optionnel
            const fetchOptional = async (tableName) => {
                try {
                    return convert(await grist.docApi.fetchTable(tableName));
                } catch (e) {
                    return [];
                }
            };
            
            // Charger toutes les tables en parallèle
            const [tasksRaw, teamData, projectsData, entitesData, programmesData] = await Promise.all([
                grist.docApi.fetchTable('Tasks').then(raw => {
                    TASK_COLS = new Set(Object.keys(raw || {}));
                    return convert(raw);
                }).catch(() => []),
                fetchOptional('Team'),
                fetchOptional('Projects'),
                fetchOptional('Entites'),
                fetchOptional('Programmes')
            ]);
            
            // Construire le snapshot localement
            const snapshot = {
                tasks: tasksRaw,
                team: teamData,
                projects: projectsData,
                entites: entitesData,
                programmes: programmesData
            };
            
            // Vérifier que cette génération est toujours la courante
            if (generation !== loadGeneration) {
                console.log('[Gantt data] loadAllData cancelled: stale generation', { generation, current: loadGeneration });
                return null;
            }
            
            // Vérifier que le mode est toujours 'grist'
            if (appMode !== 'grist') {
                console.log('[Gantt data] loadAllData cancelled: appMode changed', { appMode: appMode });
                return null;
            }
            
            // Publication atomique des données
            tasks = snapshot.tasks;
            team = snapshot.team;
            projects = snapshot.projects;
            entites = snapshot.entites;

            if (!initialLoadComplete) {
                collapsedProjects = GanttVisibleTree.buildDefaultCollapsedProjectIds(

            console.log('[Gantt init] grist.ready() succeeded in ' + Math.round(gristDuration) + 'ms, appMode = grist');
            
            // Succès de grist.ready() : mode Grist confirmé
            appMode = 'grist';

            // Initialiser le service de planning par membre

                                 (typeof globalThis !== 'undefined' && globalThis.TaskFlowPlanning);
            
            if (planningGlobal && planningGlobal.createMemberPlanningOrchestrator) {

            permissionRuntime = await TF.createPermissionRuntime(grist, {

                    if (!identity.identified) showToast('Identité non associée : modifications bloquées', 'error');
                },
                onError: (error) => console.error('[Gantt permissions] Initialisation impossible', error)
            });
            TF.guardWrites(grist, {
                permissionRuntime: permissionRuntime,
                onPermissionDenied: (error, decision) => { showToast(decision.message || error.message, 'error'); loadAllData(); },
                onReadOnly: () => showToast('Lecture seule : modification non autorisee', 'error'),
                onDenied: () => { showToast('Modification refusee par vos droits', 'error'); loadAllData(); }
            });
            // Phase 2 : ici on est dans Grist.
            // NOTE : La gestion du schéma est déléguée au Kanban (étape 1)
            // Le Gantt ne modifie jamais le schéma directement.
            // if (!TF.isReadOnly()) {
            //     try { await ensureSchema(); } catch (e) { ... }
            // }
            try { CRA_ACTIVE = (await grist.docApi.listTables()).includes('TimeEntries'); } catch (e) {}
            
            // Afficher le squelette pendant le chargement
            dataLoadState = 'loading';
            renderGanttSkeleton();
            
            try {
                await loadAllData();
            } catch (e) {
                console.error('loadAllData error (continuing):', e);
                showToast('Chargement: ' + (e?.message || e), 'error');
                dataLoadState = 'error';
                initialLoadError = e;
                appMode = 'error';
            }

            userFilterStore = TaskFlowUserFilters.createStore(grist, {
                gristUserId: permissionRuntime.getActor()?.gristUserId,
                sourceWidget: 'gantt',
                onError: (error) => console.error('[Gantt filtres personnels]', error)
            });
            const savedFilters = await userFilterStore.load();
            if (filterManager) filterManager.setState(savedFilters, { origin: 'persistent', broadcast: false });
            
            const totalLoadTime = performance.now() - loadStartTime;
            performance.mark('gantt-data-ready');
            performance.measure('gantt-full-load', 'gantt-load-start', 'gantt-data-ready');
            
            console.log('[Gantt data] loaded', {
                tasks: tasks.length,
                team: team.length,
                projects: projects.length,
                loadState: dataLoadState,
                totalLoadTime: Math.round(totalLoadTime) + 'ms'
            });
            try {
                grist.onRecords(async () => {
                    permissionRuntime.invalidate();
                    await loadAllData();
                });
                grist.onRecord((rec) => {
                    if (rec?.id && rec.id !== selectedTaskId) {
                        selectedTaskId = rec.id;
                        // Grist envoie aussi la sélection déjà active lors de
                        // l'initialisation : elle ne doit pas annuler l'état
                        // replié par défaut en ouvrant automatiquement un projet.
                        if (!initialRecordSelectionHandled) {
                            initialRecordSelectionHandled = true;
                            render();
                            return;
                        }
                        let cur = tasks.find(t => t.id === rec.id), guard = 0;
                        const selectedProjectKey = cur && projects.some(p => String(p.id) === String(cur.projet))
                            ? String(cur.projet)
                            : GanttVisibleTree.WITHOUT_PROJECT;
                        collapsedProjects.delete(selectedProjectKey);
                        while (cur?.parentTask && guard++ < 64) {
                            expandedTasks.add(cur.parentTask);
                            cur = tasks.find(t => t.id === cur.parentTask);
                        }
                        render();
                    }
                });
            } catch (e) {
                console.error('Grist listeners error:', e);
            }
        }

        // État d'initialisation explicite
        let appMode = 'loading';  // 'loading' | 'grist' | 'demo' | 'error'
        let loadGeneration = 0;
        // État de chargement des données
        let dataLoadState = 'loading';  // loading | ready | empty | error
        let initialLoadComplete = false;
        let initialLoadError = null;
        let loadStartTime = 0;
        
        // Vérifier si le mode démo est demandé explicitement via l'URL
        function isExplicitDemoMode() {
            try {
                return new URLSearchParams(location.search).get('demo') === '1';
            } catch (e) {
                return false;
            }
        }
        
        // Fonction protégée pour le mode démo
        function useDemoMode() {
            // Empêcher l'activation en mode Grist
            if (gristReady || appMode === 'grist') {
                console.warn('[Gantt] useDemoMode ignoré : le widget est connecté à Grist', {
                    appMode: appMode,
                    gristReady: gristReady
                });
                return;
            }
            
            // Éviter les appels multiples
            if (appMode === 'demo') {
                console.warn('[Gantt] useDemoMode déjà activé');
                return;
            }
            
            console.warn('[Gantt demo] useDemoMode activé', {
                appMode: appMode,
                gristReady: gristReady
            });
            
            appMode = 'demo';
            
            // Ajouter le badge démo (une seule fois)
            if (!document.querySelector('.demo-badge')) {
                document.body.insertAdjacentHTML('beforeend', '<div class="demo-badge">Démo</div>');
            }

            team = [
                { id: 1, nom: 'Alice Martin', actif: true, couleur: '#4f46e5' },

            ];

                { id: 3, nom: 'API v2', couleur: '#f59e0b', actif: true }
            ];

            const today = new Date();
            const day = (d) => dateToGrist(new Date(today.getFullYear(), today.getMonth(), today.getDate() + d));

            tasks = [
                { id: 1, titre: 'Analyse besoins', priorite: '1', projet: 1, dateDebut: day(-10), dateEcheance: day(-5), progression: 100, statut: 'done', type: 'tache', assignees: ['L', 1], tags: ['L', 'documentation'] },
                { id: 2, titre: 'Dev Backend', priorite: '1', projet: 1, dateDebut: day(-4), dateEcheance: day(2), progression: 60, statut: 'inprogress', type: 'tache', dependDe: ['L', 1], assignees: ['L', 1, 2], estimationH: 32, tempsPasse: 12 },
                { id: 3, titre: 'Design UI', priorite: '2', projet: 2, dateDebut: day(-5), dateEcheance: day(1), progression: 80, statut: 'review', type: 'tache', assignees: ['L', 3] },
                { id: 4, titre: 'Livraison MVP', priorite: '1', projet: 1, dateDebut: day(15), dateEcheance: day(15), progression: 0, statut: 'todo', type: 'jalon', dependDe: ['L', 2], assignees: ['L', 1] },
                { id: 5, titre: 'Tests QA', priorite: '3', projet: 2, dateDebut: day(5), dateEcheance: day(12), progression: 0, statut: 'todo', type: 'tache', assignees: ['L', 2], tags: ['L', 'qa', 'tests'] },
                { id: 6, titre: 'Documentation', priorite: '4', projet: 3, dateDebut: day(-2), dateEcheance: day(-1), progression: 20, statut: 'inprogress', type: 'tache', assignees: ['L', 3] },
                { id: 7, titre: 'Correction bugs', priorite: '2', projet: 1, dateDebut: day(0), dateEcheance: day(3), progression: 10, statut: 'inprogress', type: 'tache', assignees: ['L', 2] },
                { id: 8, titre: 'Réunion client', priorite: '2', projet: 2, dateDebut: day(7), dateEcheance: day(7), progression: 0, statut: 'todo', type: 'reunion', assignees: ['L', 1, 3] },
                { id: 9, titre: 'Migration DB', priorite: '1', projet: 3, dateDebut: day(-3), dateEcheance: day(0), progression: 90, statut: 'review', type: 'tache', assignees: ['L', 1] },
                { id: 10, titre: 'Formation équipe', priorite: '3', projet: 1, dateDebut: day(10), dateEcheance: day(14), progression: 0, statut: 'todo', type: 'reunion', assignees: ['L', 2, 3] },
                // WBS-01: exemple hiérarchique — 3 enfants de "Dev Backend" (id=2)
                { id: 11, titre: 'Modèle de données', priorite: '1', projet: 1, dateDebut: day(-4), dateEcheance: day(-1), progression: 100, statut: 'done', type: 'tache', assignees: ['L', 2], estimationH: 12, tempsPasse: 12, parentTask: 2 },
                { id: 12, titre: 'Routes /users /auth', priorite: '1', projet: 1, dateDebut: day(0), dateEcheance: day(5), progression: 60, statut: 'inprogress', type: 'tache', assignees: ['L', 2], estimationH: 16, tempsPasse: 10, parentTask: 2 },
                { id: 13, titre: 'Tests unitaires API', priorite: '2', projet: 1, dateDebut: day(6), dateEcheance: day(10), progression: 0, statut: 'todo', type: 'tache', assignees: ['L', 2], estimationH: 8, parentTask: 2 }
            ];

            collapsedProjects = GanttVisibleTree.buildDefaultCollapsedProjectIds(
                tasks,
                projects
            );

            rebuildChildrenCache();
            sortTasks();
            updateFilterUI();
            render();
        }

        // ═══════════════════════════════════════════════════════════════════════
        // EVENT LISTENERS
        // ═══════════════════════════════════════════════════════════════════════
        document.addEventListener('click', (e) => {
            // Fermer les menus dropdown
            if (!e.target.closest('.filter-dropdown')) {
                document.querySelectorAll('.filter-menu').forEach(m => m.classList.remove('open'));
            }
            if (!e.target.closest('.multi-select')) {
                document.querySelectorAll('.multi-select').forEach(s => s.classList.remove('open'));
            }
            // Fermer les pickers couleur (Projects / Team) si clic extérieur
            if (!e.target.closest('.color-picker-pop, .project-color-dot, .member-color-picker, .member-color-dot')) {
                document.querySelectorAll('.color-picker-pop, .member-color-picker').forEach(p => p.classList.remove('open'));
            }
            // GEN-01: Désélection si clic en dehors d'une barre, du panel ou des contrôles
            if (!e.target.closest('.gantt-bar, .gantt-milestone, .panel, .task-row, .toolbar, .filter-dropdown, .time-view-controls')) {
                if (selectedTaskId !== null && !panelState.open) {
                    selectedTaskId = null;
                    render();
                }
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && panelState.open) confirmClosePanel();
            if (panelState.open && !panelState.isNew && !e.target.matches('input, textarea, select')) {
                if (e.key === 'ArrowLeft') navigatePanelTask(-1);
                if (e.key === 'ArrowRight') navigatePanelTask(1);
            }
        });

        const panelOverlay = document.getElementById('panelOverlay');
        panelOverlay.addEventListener('mousedown', (e) => { overlayPointerStart = { x: e.clientX, y: e.clientY }; });
        panelOverlay.addEventListener('mouseup', (e) => {
            const dx = Math.abs(e.clientX - overlayPointerStart.x);
            const dy = Math.abs(e.clientY - overlayPointerStart.y);
            if (dx < 5 && dy < 5) confirmClosePanel();
        });

        // ═══════════════════════════════════════════════════════════════════════

        { const s = document.getElementById('sortSelect'); if (s) s.value = sortMode; }

        { const s = document.getElementById('colorSelect'); if (s) s.value = colorMode; }

        new ResizeObserver(() => render()).observe(document.getElementById('timelineScroll'));

            var P={
                statut:'<svg class="tf-pic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
                priorite:'<svg class="tf-pic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V4s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>',
                date:'<svg class="tf-pic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
                projet:'<svg class="tf-pic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>',
                couleur:'<svg class="tf-pic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>',
                parent:'<svg class="tf-pic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>',
                assigne:'<svg class="tf-pic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
                charge:'<svg class="tf-pic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
                progression:'<svg class="tf-pic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>'
            };
            function pic(txt){ var t=(txt||'').toLowerCase();
                if(t.indexOf('statut')>=0)return P.statut;
                if(t.indexOf('priorit')>=0)return P.priorite;
                if(t.indexOf('date')>=0)return P.date;
                if(t.indexOf('projet')>=0)return P.projet;
                if(t.indexOf('couleur')>=0)return P.couleur;
                if(t.indexOf('parent')>=0)return P.parent;
                if(t.indexOf('assign')>=0||t.indexOf('particip')>=0||t.indexOf('quipe')>=0)return P.assigne;
                if(t.indexOf('charge')>=0)return P.charge;
                if(t.indexOf('progress')>=0)return P.progression;
                return ''; }
            function collapse(c){
                ['status-selector','priority-selector'].forEach(function(cls){
                    c.querySelectorAll('.prop-value .'+cls+':not(.tfc)').forEach(function(sel){
                        sel.classList.add('tfc');
                        sel.addEventListener('click', function(ev){
                            if(!sel.classList.contains('tfo')){ ev.stopPropagation(); ev.preventDefault();
                                document.querySelectorAll('.tfc.tfo').forEach(function(o){ o.classList.remove('tfo'); });
                                sel.classList.add('tfo'); }
                        }, true);
                    });
                });
            }
            function deco(){ var c=document.getElementById('panelContent'); if(!c)return;
                c.querySelectorAll('.prop-label:not([data-dec])').forEach(function(l){ l.setAttribute('data-dec','1'); var s=pic(l.textContent); if(s)l.insertAdjacentHTML('afterbegin',s); });
                /* collapse(c) désactivé — structure A : sélecteurs déployés */ }
            var c=document.getElementById('panelContent');
            if(c){ try{ new MutationObserver(deco).observe(c,{childList:true}); }catch(e){} deco(); }
            document.addEventListener('click', function(ev){ document.querySelectorAll('.tfc.tfo').forEach(function(o){ if(!o.contains(ev.target)) o.classList.remove('tfo'); }); });
        })();
        renderGanttSkeleton();  // 06 · squelette pendant le chargement
        
        // Initialisation : mode démo explicite OU Grist
        (function initApp() {
            console.log('[Gantt init] initApp called', { 
                explicitDemo: isExplicitDemoMode(),
                appMode: appMode 
            });
            
            // Si mode démo explicite demandé
            if (isExplicitDemoMode()) {
                console.log('[Gantt init] explicit demo mode requested');
                appMode = 'demo';
                useDemoMode();
                return;
            }
            
            // Sinon, initialisation Grist normale
            initGrist();
        })();
        
        try { if (new URLSearchParams(location.search).has('nav')) document.body.classList.add('suite-nav'); } catch (e) {}
    </script>
